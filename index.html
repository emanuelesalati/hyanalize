async function loadContentRace(key) {
  if (raceCache[key]) return raceCache[key];
  const resp = await fetch(`data/races/${key}.json`);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const data = await resp.json();
  raceCache[key] = deduplicateResults(data);
  return raceCache[key];
}

async function generateContent() {
  const key = document.getElementById('content-event-select').value;
  if (!key) return;
  const area = document.getElementById('content-area');
  area.innerHTML = '<div class="loading-msg">Caricamento...</div>';

  try {
    const results = await loadContentRace(key);
    contentRaceData = results;
    contentEventKey = key;

    // Update division/gender dropdowns
    const divSel = document.getElementById('content-division');
    const genSel = document.getElementById('content-gender');
    const divs = [...new Set(results.map(r => r.division).filter(Boolean))].sort();
    const gens = [...new Set(results.map(r => r.gender).filter(Boolean))].sort();
    divSel.innerHTML = '<option value="">Tutte</option>' + divs.map(d => `<option value="${d}">${d}</option>`).join('');
    genSel.innerHTML = '<option value="">Tutti</option>' + gens.map(g => `<option value="${g}">${g}</option>`).join('');

    if (contentType === 'top10') generateTop10(key, results);
    else if (contentType === 'report') generateReport(key, results);
    else if (contentType === 'distribuzione') generateDistribuzione(key, results);
    else if (contentType === 'stazioni') generateStazioni(key, results);
    else if (contentType === 'pacing') generatePacing(key, results);
    else if (contentType === 'nazionalita') generateNazionalita(key, results);
  } catch (err) {
    area.innerHTML = `<div class="loading-msg">Errore: ${err.message}</div>`;
  }
}

// pyrox-client duplicates doubles athletes as singles entries (phantom data).
// This function removes them: if "Name" appears in pro_doubles AND pro, remove the pro entry.
function deduplicateResults(results) {
  // Build sets of individual names from doubles divisions
  const doublesNames = { pro_doubles: new Set(), doubles: new Set() };
  results.forEach(r => {
    if (!r.name || (r.division !== 'pro_doubles' && r.division !== 'doubles')) return;
    // Doubles name format: "Name1, Name2, Name1 Name2" — extract individual names
    r.name.split(', ').forEach(part => {
      const words = part.trim().split(' ');
      if (words.length >= 2 && words.length <= 3) {
        doublesNames[r.division].add(part.trim().toLowerCase());
      }
    });
  });
  // Filter: remove singles entries whose name matches a doubles athlete
  return results.filter(r => {
    const name = (r.name || '').toLowerCase().trim();
    if (r.division === 'pro' && doublesNames.pro_doubles.has(name)) return false;
    if (r.division === 'open' && doublesNames.doubles.has(name)) return false;
    return true;
  });
}

function getFilteredContent(results) {
  const div = document.getElementById('content-division')?.value || '';
  const gen = document.getElementById('content-gender')?.value || '';
  let filtered = deduplicateResults(results);
  if (div) filtered = filtered.filter(r => r.division === div);
  if (gen) filtered = filtered.filter(r => r.gender === gen);
  return filtered.filter(r => r.total_time).sort((a, b) => a.total_time - b.total_time);
}

function formatName(name) {
  if (!name) return '???';
  return name.split(', ').reverse().join(' ');
}

function generateTop10(key, results) {
  const event = DATA.events.find(e => e.key === key);
  const filtered = getFilteredContent(results);
  const top = filtered.slice(0, 10);
  const div = document.getElementById('content-division')?.value || '';
  const gen = document.getElementById('content-gender')?.value || '';

  const title = `TOP 10 — ${event.location.toUpperCase()} ${event.year}`;
  const subtitle = [div, gen].filter(Boolean).join(' | ') || 'Open';

  let text = `${title}\n${subtitle}\n${'─'.repeat(40)}\n\n`;
  top.forEach((r, i) => {
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i+1}.`;
    const flag = r.nationality ? ` (${r.nationality})` : '';
    text += `${medal} ${formatName(r.name)}${flag}\n`;
    text += `   Tempo: ${minsToTime(r.total_time)}\n`;

    // Find best and worst split
    const splits = [
      { name: 'SkiErg', val: r.skiErg },
      { name: 'Sled Push', val: r.sledPush },
      { name: 'Sled Pull', val: r.sledPull },
      { name: 'Burpee BJ', val: r.burpee },
      { name: 'Row', val: r.row },
      { name: 'Farmers', val: r.farmersCarry },
      { name: 'Lunges', val: r.lunges },
      { name: 'Wall Balls', val: r.wallBalls },
    ].filter(s => s.val);

    if (splits.length) {
      const best = splits.reduce((a, b) => a.val < b.val ? a : b);
      text += `   Best split: ${best.name} ${minsToTime(best.val)}\n`;
    }
    text += '\n';
  });

  text += `\n${filtered.length.toLocaleString()} partecipanti totali`;

  const area = document.getElementById('content-area');
  area.innerHTML = `<div class="content-output"><button class="btn-copy" onclick="copyContent()">Copia</button>${escHtml(text)}</div>` + renderGraphicControls('top10');
  // store data for graphic generation
  window._igData = { type: 'top10', key, event, filtered, top, div, gen, subtitle };
}

function generateReport(key, results) {
  const event = DATA.events.find(e => e.key === key);
  const filtered = getFilteredContent(results);
  if (!filtered.length) {
    document.getElementById('content-area').innerHTML = '<div class="loading-msg">Nessun risultato con i filtri selezionati</div>';
    return;
  }

  const n = filtered.length;
  const times = filtered.map(r => r.total_time);
  const avg = times.reduce((a, b) => a + b, 0) / n;
  const median = times[Math.floor(n / 2)];
  const p10 = n >= 10 ? times[Math.floor(n * 0.1)] : null;
  const p90 = n >= 10 ? times[Math.floor(n * 0.9)] : null;

  // Average splits
  const splitNames = ['skiErg','sledPush','sledPull','burpee','row','farmersCarry','lunges','wallBalls'];
  const splitLabels = { skiErg:'SkiErg', sledPush:'Sled Push', sledPull:'Sled Pull', burpee:'Burpee BJ', row:'Row', farmersCarry:'Farmers Carry', lunges:'Lunges', wallBalls:'Wall Balls' };
  const avgSplits = splitNames.map(s => {
    const vals = filtered.map(r => r[s]).filter(v => v && !isNaN(v));
    return { name: splitLabels[s], avg: vals.length ? vals.reduce((a,b) => a+b,0) / vals.length : null };
  }).filter(s => s.avg);

  const slowest = avgSplits.length ? avgSplits.reduce((a, b) => a.avg > b.avg ? a : b) : null;
  const fastest = avgSplits.length ? avgSplits.reduce((a, b) => a.avg < b.avg ? a : b) : null;

  // Nationality breakdown
  const natCounts = {};
  filtered.forEach(r => { if (r.nationality) natCounts[r.nationality] = (natCounts[r.nationality]||0) + 1; });
  const topNats = Object.entries(natCounts).sort((a,b) => b[1]-a[1]).slice(0, 5);

  const div = document.getElementById('content-division')?.value || '';
  const gen = document.getElementById('content-gender')?.value || '';
  const title = `REPORT — ${event.location.toUpperCase()} ${event.year}`;
  const subtitle = [div, gen].filter(Boolean).join(' | ') || 'Tutte le divisioni';

  let text = `${title}\n${subtitle}\n${'─'.repeat(40)}\n\n`;
  text += `Partecipanti: ${n.toLocaleString()}\n\n`;
  text += `Miglior tempo:  ${minsToTime(times[0])} (${formatName(filtered[0].name)})\n`;
  text += `Tempo medio:    ${minsToTime(avg)}\n`;
  text += `Mediana:        ${minsToTime(median)}\n`;
  text += `Peggior tempo:  ${minsToTime(times[n-1])}\n`;
  if (p10) text += `Top 10%:        sotto ${minsToTime(p10)}\n`;
  if (p90) text += `Top 90%:        sotto ${minsToTime(p90)}\n`;

  if (avgSplits.length) {
    text += `\nTEMPI MEDI PER STAZIONE\n${'─'.repeat(30)}\n`;
    avgSplits.sort((a,b) => b.avg - a.avg).forEach(s => {
      const marker = s === slowest ? ' ← PIU LENTA' : s === fastest ? ' ← PIU VELOCE' : '';
      text += `${s.name.padEnd(14)} ${minsToTime(s.avg)}${marker}\n`;
    });
  }

  if (topNats.length) {
    text += `\nNAZIONALITA TOP 5\n${'─'.repeat(30)}\n`;
    topNats.forEach(([nat, cnt]) => {
      text += `${nat.padEnd(6)} ${cnt} atleti (${Math.round(cnt/n*100)}%)\n`;
    });
  }

  const area = document.getElementById('content-area');
  area.innerHTML = `<div class="content-output"><button class="btn-copy" onclick="copyContent()">Copia</button>${escHtml(text)}</div>` + renderGraphicControls('report');
  window._igData = { type: 'report', key, event, filtered, n, times, avg, median, p10, p90, avgSplits, slowest, fastest, topNats, div, gen, subtitle };
}

function generateDistribuzione(key, results) {
  const event = DATA.events.find(e => e.key === key);
  const filtered = getFilteredContent(results);
  if (!filtered.length) { document.getElementById('content-area').innerHTML = '<div class="loading-msg">Nessun risultato</div>'; return; }

  const times = filtered.map(r => r.total_time);
  const n = times.length;
  const avg = times.reduce((a, b) => a + b, 0) / n;
  const median = times[Math.floor(n / 2)];
  const stddev = Math.sqrt(times.reduce((s, t) => s + (t - avg) ** 2, 0) / n);
  const p10 = times[Math.floor(n * 0.1)];
  const p25 = times[Math.floor(n * 0.25)];
  const p75 = times[Math.floor(n * 0.75)];
  const p90 = times[Math.floor(n * 0.9)];

  const div = document.getElementById('content-division')?.value || '';
  const gen = document.getElementById('content-gender')?.value || '';
  const subtitle = [div, gen].filter(Boolean).join(' | ') || 'Tutte le divisioni';

  let text = `DISTRIBUZIONE TEMPI - ${event.location.toUpperCase()} ${event.year}\n${subtitle}\n${'─'.repeat(40)}\n\n`;
  text += `Partecipanti: ${n.toLocaleString()}\n`;
  text += `Piu veloce: ${minsToTime(times[0])}\n`;
  text += `Media: ${minsToTime(avg)}\n`;
  text += `Mediana: ${minsToTime(median)}\n`;
  text += `Deviazione std: ${minsToTime(stddev)}\n`;
  text += `Piu lento: ${minsToTime(times[n - 1])}\n\n`;
  text += `ZONE PERCENTILI\n${'─'.repeat(30)}\n`;
  text += `Top 10%: sotto ${minsToTime(p10)}\n`;
  text += `Top 25%: sotto ${minsToTime(p25)}\n`;
  text += `Mediana: ${minsToTime(median)}\n`;
  text += `Bottom 25%: sopra ${minsToTime(p75)}\n`;
  text += `Bottom 10%: sopra ${minsToTime(p90)}\n`;

  const area = document.getElementById('content-area');
  area.innerHTML = '<div class="content-output"><button class="btn-copy" onclick="copyContent()">Copia</button>' + escHtml(text) + '</div>' + renderGraphicControls('distribuzione');
  window._igData = { type: 'distribuzione', key, event, filtered, times, n, avg, median, stddev, p10, p25, p75, p90, div, gen, subtitle };
}

function generateStazioni(key, results) {
  const event = DATA.events.find(e => e.key === key);
  const filtered = getFilteredContent(results);
  if (!filtered.length) { document.getElementById('content-area').innerHTML = '<div class="loading-msg">Nessun risultato</div>'; return; }

  const splitNames = ['skiErg','sledPush','sledPull','burpee','row','farmersCarry','lunges','wallBalls'];
  const splitLabels = { skiErg:'SkiErg', sledPush:'Sled Push', sledPull:'Sled Pull', burpee:'Burpee BJ', row:'Row', farmersCarry:'Farmers Carry', lunges:'Lunges', wallBalls:'Wall Balls' };

  const avgSplits = splitNames.map(s => {
    const vals = filtered.map(r => r[s]).filter(v => v && !isNaN(v));
    if (!vals.length) return null;
    const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    return { key: s, name: splitLabels[s], avg, count: vals.length };
  }).filter(Boolean);

  if (!avgSplits.length) { document.getElementById('content-area').innerHTML = '<div class="loading-msg">Nessun dato stazioni</div>'; return; }

  const totalAvg = avgSplits.reduce((s, sp) => s + sp.avg, 0);
  avgSplits.forEach(sp => sp.pct = (sp.avg / totalAvg) * 100);
  const sorted = [...avgSplits].sort((a, b) => b.avg - a.avg);
  const slowest = sorted[0];
  const fastest = sorted[sorted.length - 1];

  const div = document.getElementById('content-division')?.value || '';
  const gen = document.getElementById('content-gender')?.value || '';
  const subtitle = [div, gen].filter(Boolean).join(' | ') || 'Tutte le divisioni';

  let text = `CONFRONTO STAZIONI - ${event.location.toUpperCase()} ${event.year}\n${subtitle}\n${'─'.repeat(40)}\n\n`;
  sorted.forEach(s => {
    const marker = s === slowest ? ' ← PIU LENTA' : s === fastest ? ' ← PIU VELOCE' : '';
    text += `${s.name.padEnd(14)} ${minsToTime(s.avg)} (${s.pct.toFixed(1)}%)${marker}\n`;
  });
  text += `\nStazione piu difficile: ${slowest.name} (${minsToTime(slowest.avg)})\n`;
  text += `Stazione piu veloce: ${fastest.name} (${minsToTime(fastest.avg)})\n`;

  const area = document.getElementById('content-area');
  area.innerHTML = '<div class="content-output"><button class="btn-copy" onclick="copyContent()">Copia</button>' + escHtml(text) + '</div>' + renderGraphicControls('stazioni');
  window._igData = { type: 'stazioni', key, event, filtered, avgSplits, sorted, slowest, fastest, totalAvg, div, gen, subtitle };
}

function generatePacing(key, results) {
  const event = DATA.events.find(e => e.key === key);
  const filtered = getFilteredContent(results);
  if (!filtered.length) { document.getElementById('content-area').innerHTML = '<div class="loading-msg">Nessun risultato</div>'; return; }

  const runKeys = ['run1','run2','run3','run4','run5','run6','run7','run8'];
  const runAvgs = runKeys.map((k, i) => {
    const vals = filtered.map(r => r[k]).filter(v => v && !isNaN(v));
    if (!vals.length) return null;
    const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    return { name: 'Run ' + (i + 1), key: k, avg, count: vals.length, index: i };
  }).filter(Boolean);

  if (runAvgs.length < 2) { document.getElementById('content-area').innerHTML = '<div class="loading-msg">Dati run insufficienti</div>'; return; }

  const run1Avg = runAvgs[0].avg;
  runAvgs.forEach(r => r.fade = ((r.avg - run1Avg) / run1Avg) * 100);

  // Find "the wall" - biggest increase from previous run
  let wallIdx = 0, wallDelta = 0;
  for (let i = 1; i < runAvgs.length; i++) {
    const delta = runAvgs[i].avg - runAvgs[i - 1].avg;
    if (delta > wallDelta) { wallDelta = delta; wallIdx = i; }
  }

  // Negative split analysis
  let negSplitCount = 0, posSplitCount = 0;
  filtered.forEach(r => {
    const firstHalf = runKeys.slice(0, 4).map(k => r[k]).filter(v => v && !isNaN(v));
    const secondHalf = runKeys.slice(4).map(k => r[k]).filter(v => v && !isNaN(v));
    if (firstHalf.length && secondHalf.length) {
      const fhAvg = firstHalf.reduce((a, b) => a + b, 0) / firstHalf.length;
      const shAvg = secondHalf.reduce((a, b) => a + b, 0) / secondHalf.length;
      if (shAvg < fhAvg) negSplitCount++; else posSplitCount++;
    }
  });
  const totalSplitAthletes = negSplitCount + posSplitCount;
  const negSplitPct = totalSplitAthletes > 0 ? (negSplitCount / totalSplitAthletes * 100) : 0;

  const div = document.getElementById('content-division')?.value || '';
  const gen = document.getElementById('content-gender')?.value || '';
  const subtitle = [div, gen].filter(Boolean).join(' | ') || 'Tutte le divisioni';

  let text = `PACING ANALYSIS - ${event.location.toUpperCase()} ${event.year}\n${subtitle}\n${'─'.repeat(40)}\n\n`;
  text += 'TEMPI MEDI PER RUN\n';
  runAvgs.forEach(r => {
    const fadeStr = r.fade > 0 ? ` (+${r.fade.toFixed(1)}%)` : r.fade < 0 ? ` (${r.fade.toFixed(1)}%)` : '';
    text += `${r.name.padEnd(8)} ${minsToTime(r.avg)}${fadeStr}\n`;
  });
  text += `\nTHE WALL: ${runAvgs[wallIdx].name} (+${minsToTime(wallDelta)} vs run precedente)\n`;
  text += `Fade totale da Run 1: +${runAvgs[runAvgs.length - 1].fade.toFixed(1)}%\n`;
  text += `\nNegative split: ${negSplitCount} atleti (${negSplitPct.toFixed(1)}%)\n`;
  text += `Positive split: ${posSplitCount} atleti (${(100 - negSplitPct).toFixed(1)}%)\n`;

  const area = document.getElementById('content-area');
  area.innerHTML = '<div class="content-output"><button class="btn-copy" onclick="copyContent()">Copia</button>' + escHtml(text) + '</div>' + renderGraphicControls('pacing');
  window._igData = { type: 'pacing', key, event, filtered, runAvgs, wallIdx, wallDelta, negSplitCount, posSplitCount, negSplitPct, totalSplitAthletes, div, gen, subtitle };
}

function generateNazionalita(key, results) {
  const event = DATA.events.find(e => e.key === key);
  const filtered = getFilteredContent(results);
  if (!filtered.length) { document.getElementById('content-area').innerHTML = '<div class="loading-msg">Nessun risultato</div>'; return; }

  const natData = {};
  filtered.forEach(r => {
    if (!r.nationality) return;
    if (!natData[r.nationality]) natData[r.nationality] = { count: 0, totalTime: 0, timeCount: 0 };
    natData[r.nationality].count++;
    if (r.total_time) { natData[r.nationality].totalTime += r.total_time; natData[r.nationality].timeCount++; }
  });

  const natList = Object.entries(natData).map(([nat, d]) => ({
    nat, count: d.count, avgTime: d.timeCount > 0 ? d.totalTime / d.timeCount : null
  })).sort((a, b) => b.count - a.count);

  const top10 = natList.slice(0, 10);
  const fastestNat = natList.filter(n => n.avgTime && n.count >= 3).sort((a, b) => a.avgTime - b.avgTime)[0];

  const div = document.getElementById('content-division')?.value || '';
  const gen = document.getElementById('content-gender')?.value || '';
  const subtitle = [div, gen].filter(Boolean).join(' | ') || 'Tutte le divisioni';

  let text = `NAZIONALITA - ${event.location.toUpperCase()} ${event.year}\n${subtitle}\n${'─'.repeat(40)}\n\n`;
  text += 'TOP 10 NAZIONALITA PER PARTECIPANTI\n';
  top10.forEach((n, i) => {
    const pct = (n.count / filtered.length * 100).toFixed(1);
    const avgStr = n.avgTime ? ` — media: ${minsToTime(n.avgTime)}` : '';
    text += `${(i + 1 + '.').padEnd(4)} ${n.nat.padEnd(6)} ${n.count} atleti (${pct}%)${avgStr}\n`;
  });
  if (fastestNat) {
    text += `\nNazionalita piu veloce (min 3 atleti): ${fastestNat.nat} — ${minsToTime(fastestNat.avgTime)} media\n`;
  }

  const area = document.getElementById('content-area');
  area.innerHTML = '<div class="content-output"><button class="btn-copy" onclick="copyContent()">Copia</button>' + escHtml(text) + '</div>' + renderGraphicControls('nazionalita');
  window._igData = { type: 'nazionalita', key, event, filtered, top10, natList, fastestNat, div, gen, subtitle };
}

async function searchAthlete() {
  const search = (document.getElementById('content-athlete-search')?.value || '').toLowerCase().trim();
  if (search.length < 3) {
    document.getElementById('content-area').innerHTML = '<div class="loading-msg">Inserisci almeno 3 caratteri</div>';
    return;
  }

  const area = document.getElementById('content-area');
  const total = DATA.events.length;
  let done = 0;
  area.innerHTML = `<div class="loading-msg" id="search-progress">Cerco in tutte le gare... 0/${total}</div>`;

  const found = [];
  // Parallel fetch in batches of 10
  const BATCH = 10;
  for (let i = 0; i < total; i += BATCH) {
    const batch = DATA.events.slice(i, i + BATCH);
    const promises = batch.map(async event => {
      try {
        const results = await loadContentRace(event.key);
        const words = search.split(/\s+/);
        const matches = results.filter(r => {
          const name = (r.name || '').toLowerCase();
          return words.every(w => name.includes(w));
        });
        if (matches.length) {
          matches.forEach(m => found.push({ ...m, event }));
        }
      } catch (err) {
        console.error(`Errore caricamento ${event.key}:`, err);
      }
      done++;
    });
    await Promise.all(promises);
    const prog = document.getElementById('search-progress');
    if (prog) prog.textContent = `Cerco in tutte le gare... ${done}/${total} (${found.length} trovati)`;
  }

  if (!found.length) {
    area.innerHTML = '<div class="loading-msg">Atleta non trovato in nessuna gara</div>';
    return;
  }

  // Store all found results for re-filtering
  window._athleteSearchResults = found;

  renderAthleteResults(found);
}

function renderAthleteResults(found) {
  const area = document.getElementById('content-area');

  // Get unique divisions and build filter
  const allDivGens = [...new Set(found.map(r => r.division + '_' + r.gender))].sort();
  const divGenLabels = {
    open_male: 'Open Men', open_female: 'Open Women',
    doubles_male: 'Doubles Men', doubles_female: 'Doubles Women', doubles_mixed: 'Doubles Mixed',
    pro_male: 'Pro Men', pro_female: 'Pro Women',
    pro_doubles_male: 'Pro Doubles Men', pro_doubles_female: 'Pro Doubles Women', pro_doubles_mixed: 'Pro Doubles Mixed',
  };

  const currentFilter = document.getElementById('athlete-div-filter')?.value || '';

  let filterHtml = '<div style="display:flex;gap:0.8rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem">';
  filterHtml += '<label style="color:var(--text2);font-size:0.85rem">Divisione:</label>';
  filterHtml += '<select id="athlete-div-filter" onchange="filterAthleteResults()" style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:0.5rem 0.8rem;color:var(--text);font-size:0.85rem">';
  filterHtml += '<option value="">Tutte</option>';
  allDivGens.forEach(dg => {
    const label = divGenLabels[dg] || dg;
    const sel = dg === currentFilter ? ' selected' : '';
    filterHtml += `<option value="${dg}"${sel}>${label}</option>`;
  });
  filterHtml += '</select></div>';

  // Apply division filter
  let filtered = found;
  if (currentFilter) {
    filtered = found.filter(r => (r.division + '_' + r.gender) === currentFilter);
  }

  // Sort by newest first (season desc, year desc)
  filtered.sort((a, b) => (b.event.season || 0) - (a.event.season || 0) || (b.event.year || 0) - (a.event.year || 0));

  // Group by athlete name
  const byName = {};
  filtered.forEach(r => {
    const key = r.name || '???';
    if (!byName[key]) byName[key] = [];
    byName[key].push(r);
  });

  const entries = Object.entries(byName).sort((a, b) => b[1].length - a[1].length);

  let html = filterHtml;
  let raceIdx = 0;
  if (!window._athleteData) window._athleteData = {};
  window._radarQueue = [];

  for (const [name, races] of entries) {
    // Keep newest-first order (already sorted above)
    const bestResult = [...races].sort((a, b) => (a.total_time || 9999) - (b.total_time || 9999)).find(r => r.total_time);
    const displayName = formatName(name);

    html += `<div style="margin-bottom:1.5rem">`;
    html += `<h3 style="color:var(--accent);margin-bottom:0.3rem">${displayName}</h3>`;
    html += `<div style="color:var(--text2);font-size:0.85rem;margin-bottom:0.8rem">${races.length} gara/e${bestResult ? ` — Miglior tempo: ${minsToTime(bestResult.total_time)}` : ''}</div>`;

    races.forEach(r => {
      const ev = r.event;
      const rid = `race-${raceIdx++}`;

      // --- Compute rankings & averages from cached race data ---
      const allResults = raceCache[ev.key] || [];
      const peers = allResults.filter(p => p.division === r.division && p.gender === r.gender && p.total_time);
      const sortedPeers = [...peers].sort((a, b) => a.total_time - b.total_time);
      const totalPeers = sortedPeers.length;
      const rank = sortedPeers.findIndex(p => p.name === r.name && Math.abs((p.total_time||0) - (r.total_time||0)) < 0.01) + 1;
      const pctile = totalPeers > 0 && rank > 0 ? ((rank / totalPeers) * 100) : 0;
      const pctileClass = pctile <= 25 ? 'top25' : pctile <= 50 ? 'top50' : pctile <= 75 ? 'top75' : 'bottom25';

      const splitKeys = [
        { key: 'skiErg', name: 'SkiErg' },
        { key: 'sledPush', name: 'Sled Push' },
        { key: 'sledPull', name: 'Sled Pull' },
        { key: 'burpee', name: 'Burpee BJ' },
        { key: 'row', name: 'Row' },
        { key: 'farmersCarry', name: 'Farmers' },
        { key: 'lunges', name: 'Lunges' },
        { key: 'wallBalls', name: 'Wall Balls' },
        { key: 'run_time', name: 'Run' },
      ];

      // Compute averages, best times, and per-split ranks
      const splitData = splitKeys.map(sk => {
        const val = r[sk.key];
        if (!val || isNaN(val)) return null;
        const peerVals = sortedPeers.map(p => p[sk.key]).filter(v => v && !isNaN(v));
        const avg = peerVals.length ? peerVals.reduce((a,b) => a+b, 0) / peerVals.length : null;
        const best = peerVals.length ? Math.min(...peerVals) : null;
        const peerSorted = [...peerVals].sort((a,b) => a - b);
        const splitRank = peerSorted.filter(v => v < val).length + 1;
        return { name: sk.name, key: sk.key, val, avg, best, splitRank, totalWithSplit: peerVals.length };
      }).filter(Boolean);

      const maxSplitVal = splitData.length ? Math.max(...splitData.map(s => s.val), ...splitData.map(s => s.avg || 0)) : 1;

      // --- Build HTML ---
      html += `<div class="athlete-race-card">`;

      // 1. Header
      html += `<div class="arc-header">`;
      html += `<div class="arc-event-line">${ev.location.toUpperCase()} ${ev.year} — Season ${ev.season}</div>`;
      html += `<div class="arc-meta-line">`;
      if (r.division) html += `<span>${r.division}</span>`;
      if (r.gender) html += `<span>${r.gender}</span>`;
      if (r.age_group) html += `<span>${r.age_group}</span>`;
      if (r.nationality) html += `<span>${r.nationality}</span>`;
      html += `</div>`;
      html += `<div class="arc-total-time">${minsToTime(r.total_time)}</div>`;
      html += `</div>`;

      // 2. Ranking badge
      if (rank > 0 && totalPeers > 0) {
        html += `<div class="arc-ranking-badge ${pctileClass}">`;
        html += `#${rank} su ${totalPeers} — top ${pctile.toFixed(1)}%`;
        html += `</div>`;
      }

      // 3. Split bars with comparison
      if (splitData.length) {
        html += `<div class="arc-body">`;
        html += `<div class="arc-section-title">Split times vs media evento</div>`;

        splitData.forEach(s => {
          const barPct = (s.val / maxSplitVal) * 100;
          const avgPct = s.avg ? (s.avg / maxSplitVal) * 100 : 0;
          const isFaster = s.avg && s.val < s.avg;
          const barColor = s.avg ? (isFaster ? 'rgba(0,214,143,0.7)' : 'rgba(255,107,107,0.7)') : 'rgba(139,143,163,0.5)';
          const delta = s.avg ? s.val - s.avg : 0;
          const deltaSign = delta < 0 ? '' : '+';
          const deltaClass = delta < 0 ? 'faster' : 'slower';

          html += `<div class="arc-split-row">`;
          html += `<div class="arc-split-name">${s.name}</div>`;
          html += `<div class="arc-split-bars">`;
          html += `<div class="arc-split-bar-athlete" style="width:${barPct.toFixed(1)}%;background:${barColor}"></div>`;
          if (s.avg) html += `<div class="arc-split-bar-avg" style="left:${avgPct.toFixed(1)}%" title="Media: ${minsToTime(s.avg)}"></div>`;
          html += `</div>`;
          html += `<div class="arc-split-time">${minsToTime(s.val)}</div>`;
          if (s.avg) html += `<div class="arc-split-delta ${deltaClass}">${deltaSign}${minsToTime(Math.abs(delta))}</div>`;
          else html += `<div class="arc-split-delta"></div>`;
          html += `<div class="arc-split-rank">#${s.splitRank}</div>`;
          html += `</div>`;
        });

        // Legend
        html += `<div class="arc-legend">`;
        html += `<span><span class="arc-legend-dot" style="background:rgba(0,214,143,0.7)"></span>Piu veloce della media</span>`;
        html += `<span><span class="arc-legend-dot" style="background:rgba(255,107,107,0.7)"></span>Piu lento della media</span>`;
        html += `<span><span class="arc-legend-dot" style="background:rgba(255,255,255,0.5);width:2px;height:10px;border-radius:0"></span>Media evento</span>`;
        html += `</div>`;

        html += `</div>`; // arc-body
      }

      // 3b. Station distribution histograms
      const histoStations = splitData.filter(s => s.name !== 'Run');
      if (histoStations.length) {
        if (!window._histoQueue) window._histoQueue = [];

        html += `<div class="arc-stations-grid">`;
        histoStations.forEach(s => {
          const hid = `histo-${rid}-${s.key}`;
          const peerVals = sortedPeers.map(p => p[s.key]).filter(v => v && !isNaN(v));
          const splitPctile = s.totalWithSplit > 0 ? ((s.splitRank / s.totalWithSplit) * 100) : 0;
          const badgeClass = splitPctile <= 25 ? 'top25' : splitPctile <= 50 ? 'top50' : splitPctile <= 75 ? 'top75' : 'bottom25';

          html += `<div class="arc-station-card">`;
          html += `<div class="arc-station-header">`;
          html += `<div class="arc-station-name">${s.name}</div>`;
          html += `<div class="arc-station-time">${minsToTime(s.val)}</div>`;
          html += `</div>`;
          html += `<div class="arc-station-badges">`;
          html += `<span class="arc-station-badge arc-ranking-badge ${badgeClass}" style="margin:0;padding:0.1rem 0.4rem">#${s.splitRank} su ${s.totalWithSplit}</span>`;
          html += `<span class="arc-station-badge arc-ranking-badge ${badgeClass}" style="margin:0;padding:0.1rem 0.4rem">top ${splitPctile.toFixed(1)}%</span>`;
          html += `</div>`;
          html += `<div class="arc-histo-wrap"><canvas id="${hid}" class="arc-histo-canvas"></canvas></div>`;
          html += `<div class="arc-histo-axis" id="${hid}-axis"></div>`;
          html += `</div>`;

          window._histoQueue.push({ id: hid, vals: peerVals, athleteVal: s.val });
        });
        html += `</div>`;
      }

      // 4. Individual Run Laps
      const runLapKeys = ['run1','run2','run3','run4','run5','run6','run7','run8'];
      const runLaps = runLapKeys.map((k, i) => {
        const val = r[k];
        if (!val || isNaN(val)) return null;
        const peerVals = sortedPeers.map(p => p[k]).filter(v => v && !isNaN(v));
        const avg = peerVals.length ? peerVals.reduce((a,b) => a+b, 0) / peerVals.length : null;
        const peerSorted = [...peerVals].sort((a,b) => a - b);
        const lapRank = peerSorted.filter(v => v < val).length + 1;
        return { name: `Run ${i+1}`, key: k, val, avg, lapRank, total: peerVals.length };
      }).filter(Boolean);

      if (runLaps.length > 0) {
        const maxRunVal = Math.max(...runLaps.map(l => l.val), ...runLaps.map(l => l.avg || 0));
        const minRunVal = Math.min(...runLaps.map(l => l.val));
        const avgRunVal = runLaps.reduce((s, l) => s + l.val, 0) / runLaps.length;

        // Stations interleaved between runs
        const stationOrder = ['skiErg','sledPush','sledPull','burpee','row','farmersCarry','lunges','wallBalls'];
        const stationNames = { skiErg:'SkiErg', sledPush:'Sled Push', sledPull:'Sled Pull', burpee:'Burpee BJ', row:'Row', farmersCarry:'Farmers', lunges:'Lunges', wallBalls:'Wall Balls' };

        html += `<div class="arc-body" style="border-top:1px solid var(--border)">`;
        html += `<div class="arc-section-title">Run Laps</div>`;
        html += `<div style="display:flex;gap:1rem;margin-bottom:0.8rem;font-size:0.78rem;color:var(--text2)">`;
        html += `<span>Avg: <strong style="color:var(--text)">${minsToTime(avgRunVal)}</strong></span>`;
        html += `<span>Best: <strong style="color:var(--green)">${minsToTime(minRunVal)}</strong></span>`;
        const maxLap = runLaps.reduce((a,b) => a.val > b.val ? a : b);
        const minLap = runLaps.reduce((a,b) => a.val < b.val ? a : b);
        html += `</div>`;

        runLaps.forEach((lap, i) => {
          const barPct = (lap.val / maxRunVal) * 100;
          const avgPct = lap.avg ? (lap.avg / maxRunVal) * 100 : 0;
          const isFaster = lap.avg && lap.val < lap.avg;
          const isBest = lap === minLap;
          const isWorst = lap === maxLap;
          const barColor = isBest ? 'rgba(0,214,143,0.8)' : isWorst ? 'rgba(255,107,107,0.8)' : isFaster ? 'rgba(0,214,143,0.5)' : 'rgba(255,107,107,0.5)';
          const delta = lap.avg ? lap.val - lap.avg : 0;
          const deltaSign = delta < 0 ? '' : '+';
          const deltaClass = delta < 0 ? 'faster' : 'slower';
          const lapPctile = lap.total > 0 ? ((lap.lapRank / lap.total) * 100).toFixed(1) : '—';

          html += `<div class="arc-split-row">`;
          html += `<div class="arc-split-name" style="font-weight:${isBest||isWorst?'700':'400'};color:${isBest?'var(--green)':isWorst?'#ff6b6b':'var(--text2)'}">${lap.name}</div>`;
          html += `<div class="arc-split-bars">`;
          html += `<div class="arc-split-bar-athlete" style="width:${barPct.toFixed(1)}%;background:${barColor}"></div>`;
          if (lap.avg) html += `<div class="arc-split-bar-avg" style="left:${avgPct.toFixed(1)}%" title="Media: ${minsToTime(lap.avg)}"></div>`;
          html += `</div>`;
          html += `<div class="arc-split-time">${minsToTime(lap.val)}</div>`;
          if (lap.avg) html += `<div class="arc-split-delta ${deltaClass}">${deltaSign}${minsToTime(Math.abs(delta))}</div>`;
          else html += `<div class="arc-split-delta"></div>`;
          html += `<div class="arc-split-rank">#${lap.lapRank}</div>`;
          html += `</div>`;

          // Show station between runs (smaller, dimmed)
          if (i < stationOrder.length && i < runLaps.length - 1) {
            const sk = stationOrder[i];
            const sVal = r[sk];
            if (sVal) {
              html += `<div style="display:flex;align-items:center;gap:0.6rem;margin:0.1rem 0 0.1rem 0;font-size:0.7rem;color:var(--text2);opacity:0.6">`;
              html += `<div style="width:85px;text-align:right;flex-shrink:0">${stationNames[sk]}</div>`;
              html += `<div style="flex:1;height:1px;background:var(--border)"></div>`;
              html += `<div style="width:60px;text-align:right;font-family:monospace">${minsToTime(sVal)}</div>`;
              html += `<div style="width:56px"></div><div style="width:44px"></div>`;
              html += `</div>`;
            }
          }
        });

        // Roxzone
        if (r.roxzone) {
          html += `<div style="margin-top:0.5rem;font-size:0.8rem;color:var(--text2)">Roxzone: <span style="color:var(--text);font-family:monospace">${minsToTime(r.roxzone)}</span></div>`;
        }

        html += `</div>`;
      }

      // 5. Radar chart
      const workSplits = splitData.filter(s => s.name !== 'Run');
      if (workSplits.length >= 3) {
        const radarId = `radar-${rid}`;
        html += `<div class="arc-radar-section">`;
        html += `<canvas id="${radarId}" class="arc-radar-canvas" width="320" height="320"></canvas>`;
        html += `</div>`;
        // Queue radar drawing after DOM insertion
        if (!window._radarQueue) window._radarQueue = [];
        window._radarQueue.push({ id: radarId, splits: workSplits });
      }

      // 5. Genera Grafica buttons (preserved)
      html += `<div class="arc-footer">
        <select id="ig-format-${rid}" style="background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:0.3rem 0.6rem;color:var(--text);font-size:0.8rem">
          <option value="post">Post 1080x1080</option>
          <option value="story">Story 1080x1920</option>
        </select>
        <button class="btn-generate" style="padding:0.3rem 0.8rem;font-size:0.8rem" onclick="generateAthleteGraphic('${rid}')">Genera Grafica</button>
        <button class="btn-generate" id="btn-download-${rid}" style="display:none;background:var(--green);padding:0.3rem 0.8rem;font-size:0.8rem" onclick="downloadAthlPNG('${rid}')">Scarica PNG</button>
      </div>
      <div style="padding:0 1.5rem 1rem;text-align:center">
        <canvas id="canvas-${rid}" style="display:none;max-width:100%;border:1px solid var(--border);border-radius:8px"></canvas>
      </div>`;

      // Store data for this specific race (preserved for graphic generation)
      const splits = splitKeys.map(sk => ({ name: sk.name, val: r[sk.key] })).filter(s => s.val);
      window._athleteData[rid] = {
        name: displayName,
        eventLocation: ev.location,
        eventYear: ev.year,
        eventSeason: ev.season,
        division: r.division,
        gender: r.gender,
        total_time: r.total_time,
        splits: splits,
        nationality: r.nationality,
        age_group: r.age_group,
      };

      html += '</div>';
    });

    html += '</div>';
  }

  area.innerHTML = html;

  // Draw queued radar charts
  if (window._radarQueue && window._radarQueue.length) {
    window._radarQueue.forEach(({ id, splits }) => drawRadarChart(id, splits));
    window._radarQueue = [];
  }
  // Draw queued histograms
  if (window._histoQueue && window._histoQueue.length) {
    window._histoQueue.forEach(h => drawHistogram(h.id, h.vals, h.athleteVal));
    window._histoQueue = [];
  }
}

function drawRadarChart(canvasId, splits) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2;
  const R = Math.min(cx, cy) - 40;
  const n = splits.length;

  ctx.clearRect(0, 0, W, H);

  // Background rings
  for (let ring = 1; ring <= 5; ring++) {
    const rr = (ring / 5) * R;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
      const x = cx + rr * Math.cos(angle);
      const y = cy + rr * Math.sin(angle);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = 'rgba(46,51,71,0.8)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Axis lines + labels
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
    const x = cx + R * Math.cos(angle);
    const y = cy + R * Math.sin(angle);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(x, y);
    ctx.strokeStyle = 'rgba(46,51,71,0.5)';
    ctx.stroke();

    // Label
    const lx = cx + (R + 22) * Math.cos(angle);
    const ly = cy + (R + 22) * Math.sin(angle);
    ctx.fillStyle = '#8b8fa3';
    ctx.font = '11px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(splits[i].name, lx, ly);
  }

  // For radar: invert scale so faster = bigger
  // Use the worst time in the field as baseline (0%), best time = 100%
  function normalizeInverted(s) {
    if (!s.best || !s.avg) return 0.5;
    // worst = avg * 1.5 as a reasonable upper bound (or use actual max)
    const worst = Math.max(s.val, s.avg) * 1.4;
    const best = s.best;
    if (worst === best) return 1;
    const pct = 1 - ((s.val - best) / (worst - best));
    return Math.max(0.08, Math.min(1, pct));
  }

  // Draw average polygon
  const avgNorms = splits.map(s => {
    if (!s.best || !s.avg) return 0.5;
    const worst = Math.max(s.val, s.avg) * 1.4;
    const best = s.best;
    if (worst === best) return 1;
    return Math.max(0.08, Math.min(1, 1 - ((s.avg - best) / (worst - best))));
  });

  ctx.beginPath();
  avgNorms.forEach((norm, i) => {
    const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
    const x = cx + R * norm * Math.cos(angle);
    const y = cy + R * norm * Math.sin(angle);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.closePath();
  ctx.fillStyle = 'rgba(139,143,163,0.12)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(139,143,163,0.4)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([4, 4]);
  ctx.stroke();
  ctx.setLineDash([]);

  // Draw athlete polygon
  const athleteNorms = splits.map(normalizeInverted);

  ctx.beginPath();
  athleteNorms.forEach((norm, i) => {
    const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
    const x = cx + R * norm * Math.cos(angle);
    const y = cy + R * norm * Math.sin(angle);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.closePath();
  ctx.fillStyle = 'rgba(200,255,0,0.15)';
  ctx.fill();
  ctx.strokeStyle = '#c8ff00';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Draw dots on athlete polygon
  athleteNorms.forEach((norm, i) => {
    const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
    const x = cx + R * norm * Math.cos(angle);
    const y = cy + R * norm * Math.sin(angle);
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#c8ff00';
    ctx.fill();
  });

  // Legend at bottom
  ctx.fillStyle = '#c8ff00';
  ctx.fillRect(W / 2 - 80, H - 18, 10, 10);
  ctx.fillStyle = '#8b8fa3';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('Atleta', W / 2 - 66, H - 9);

  ctx.strokeStyle = 'rgba(139,143,163,0.5)';
  ctx.setLineDash([3, 3]);
  ctx.beginPath();
  ctx.moveTo(W / 2 + 10, H - 13);
  ctx.lineTo(W / 2 + 22, H - 13);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillText('Media', W / 2 + 26, H - 9);
}

function copyContent() {
  const output = document.querySelector('.content-output');
  if (!output) return;
  const text = output.textContent.replace('Copia', '').trim();
  navigator.clipboard.writeText(text).then(() => {
    const btn = output.querySelector('.btn-copy');
    if (btn) { btn.textContent = 'Copiato!'; setTimeout(() => btn.textContent = 'Copia', 1500); }
  });
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function drawHistogram(canvasId, vals, athleteVal) {
  const canvas = document.getElementById(canvasId);
  if (!canvas || !vals.length) return;

  // Set canvas size to container
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const W = rect.width;
  const H = rect.height;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const sorted = [...vals].sort((a, b) => a - b);
  const minV = sorted[0];
  const maxV = sorted[sorted.length - 1];
  const range = maxV - minV || 1;

  // Create bins
  const numBins = Math.min(40, Math.max(15, Math.floor(vals.length / 10)));
  const binWidth = range / numBins;
  const bins = new Array(numBins).fill(0);
  vals.forEach(v => {
    let idx = Math.floor((v - minV) / binWidth);
    if (idx >= numBins) idx = numBins - 1;
    bins[idx]++;
  });
  const maxBin = Math.max(...bins);

  const padL = 0, padR = 0, padT = 4, padB = 4;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  const barW = chartW / numBins;

  // Draw bars
  bins.forEach((count, i) => {
    const barH = maxBin > 0 ? (count / maxBin) * chartH : 0;
    const x = padL + i * barW;
    const y = padT + chartH - barH;

    // Color based on position relative to athlete
    const binCenter = minV + (i + 0.5) * binWidth;
    if (binCenter <= athleteVal) {
      ctx.fillStyle = 'rgba(0,214,143,0.4)';  // faster = green
    } else {
      ctx.fillStyle = 'rgba(139,143,163,0.25)';  // slower = gray
    }
    ctx.fillRect(x + 0.5, y, barW - 1, barH);
  });

  // Athlete line
  const athleteX = padL + ((athleteVal - minV) / range) * chartW;
  ctx.strokeStyle = '#c8ff00';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(athleteX, padT);
  ctx.lineTo(athleteX, padT + chartH);
  ctx.stroke();

  // Athlete dot
  ctx.fillStyle = '#c8ff00';
  ctx.beginPath();
  ctx.arc(athleteX, padT + 6, 4, 0, Math.PI * 2);
  ctx.fill();

  // Axis labels
  const axisDiv = document.getElementById(canvasId + '-axis');
  if (axisDiv) {
    const nLabels = 5;
    let labels = '';
    for (let i = 0; i <= nLabels; i++) {
      const v = minV + (range * i / nLabels);
      labels += `<span>${minsToTime(v)}</span>`;
    }
    axisDiv.innerHTML = labels;
  }
}

function generateGraphic() {
  const format = document.getElementById('ig-format').value;
  const W = 1080;
  const H = format === 'story' ? 1920 : 1080;
  const canvas = document.getElementById('ig-canvas');
  canvas.width = W;
  canvas.height = H;
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');

  const BG = '#0f1117', SURFACE = '#1a1d27', ACCENT = '#c8ff00', TEXT = '#e4e6ed', TEXT2 = '#8b8fa3';
  const GOLD = '#ffd700', SILVER = '#c0c0c0', BRONZE = '#cd7f32', GREEN = '#00d68f', RED = '#ff6b6b';

  // Background
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);

  // Helper: draw rounded rect
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  // Header
  function drawHeader(title) {
    // Top bar
    ctx.fillStyle = SURFACE;
    ctx.fillRect(0, 0, W, 100);
    ctx.fillStyle = ACCENT;
    ctx.font = 'bold 40px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('HY', 50, 65);
    const hyW = ctx.measureText('HY').width;
    ctx.fillStyle = TEXT;
    ctx.fillText('ANALIZE', 50 + hyW, 65);
    // Title
    ctx.fillStyle = ACCENT;
    ctx.font = 'bold 32px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(title, W / 2, 160);
  }

  // Footer
  function drawFooter(extra) {
    const fy = H - 60;
    ctx.fillStyle = SURFACE;
    ctx.fillRect(0, fy, W, 60);
    ctx.fillStyle = TEXT2;
    ctx.font = '22px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('@hyroxitaliacommunity' + (extra ? '  |  ' + extra : ''), W / 2, fy + 38);
  }

  const data = window._igData;
  const athleteData = window._igAthleteData;

  const C = { BG, SURFACE, ACCENT, TEXT, TEXT2, GOLD, SILVER, BRONZE, GREEN, RED };
  if (data && data.type === 'top10') {
    drawTop10Graphic(ctx, W, H, data, drawHeader, drawFooter, roundRect, C);
  } else if (data && data.type === 'report') {
    drawReportGraphic(ctx, W, H, data, drawHeader, drawFooter, roundRect, C);
  } else if (data && data.type === 'distribuzione') {
    drawDistribuzioneGraphic(ctx, W, H, data, drawHeader, drawFooter, roundRect, C);
  } else if (data && data.type === 'stazioni') {
    drawStazioniGraphic(ctx, W, H, data, drawHeader, drawFooter, roundRect, C);
  } else if (data && data.type === 'pacing') {
    drawPacingGraphic(ctx, W, H, data, drawHeader, drawFooter, roundRect, C);
  } else if (data && data.type === 'nazionalita') {
    drawNazionalitaGraphic(ctx, W, H, data, drawHeader, drawFooter, roundRect, C);
  } else if (athleteData) {
    drawAthleteGraphic(ctx, W, H, athleteData, drawHeader, drawFooter, roundRect, C);
  }

  document.getElementById('btn-download-png').style.display = '';
}

function drawTop10Graphic(ctx, W, H, data, drawHeader, drawFooter, roundRect, C) {
  const { event, top, subtitle, filtered } = data;
  const isStory = H === 1920;
  const title = `TOP 10 - ${event.location.toUpperCase()} ${event.year}`;
  drawHeader(title);

  // Subtitle
  ctx.fillStyle = C.TEXT2;
  ctx.font = '24px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(subtitle || 'Open', W / 2, 200);

  const startY = 240;
  const footerH = 100; // space for participants count + footer
  const availH = H - startY - footerH;
  const rowH = Math.min(isStory ? 140 : 75, Math.floor(availH / 10));
  const padX = 60;
  const rankW = 70;
  const timeW = 200;
  const nameMaxW = W - 2 * padX - rankW - timeW - 40;
  const nameFontSize = isStory ? 28 : 24;
  const rankFontSize = isStory ? 34 : 28;
  const timeFontSize = isStory ? 28 : 26;
  const flagFontSize = isStory ? 18 : 15;

  function truncateName(name, maxW) {
    ctx.font = 'bold ' + nameFontSize + 'px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif';
    if (ctx.measureText(name).width <= maxW) return name;
    let t = name;
    while (t.length > 3 && ctx.measureText(t + '...').width > maxW) t = t.slice(0, -1);
    return t + '...';
  }

  top.forEach((r, i) => {
    const y = startY + i * rowH;
    const rank = i + 1;

    // Row background
    ctx.fillStyle = i % 2 === 0 ? C.SURFACE : C.BG;
    roundRect(padX - 10, y, W - 2 * padX + 20, rowH - 6, 10);
    ctx.fill();

    // Gradient accent bar under top 3
    if (rank <= 3) {
      const barH = 3;
      const grad = ctx.createLinearGradient(padX - 10, 0, padX - 10 + (W - 2 * padX + 20), 0);
      if (rank === 1) { grad.addColorStop(0, C.GOLD); grad.addColorStop(1, 'rgba(255,215,0,0.2)'); }
      else if (rank === 2) { grad.addColorStop(0, C.SILVER); grad.addColorStop(1, 'rgba(192,192,192,0.2)'); }
      else { grad.addColorStop(0, C.BRONZE); grad.addColorStop(1, 'rgba(205,127,50,0.2)'); }
      ctx.fillStyle = grad;
      roundRect(padX - 10, y + rowH - 6 - barH, W - 2 * padX + 20, barH, 2);
      ctx.fill();
    }

    // Rank number
    const cy = y + (rowH - 6) / 2;
    ctx.textAlign = 'center';
    ctx.font = 'bold ' + rankFontSize + 'px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif';
    if (rank === 1) ctx.fillStyle = C.GOLD;
    else if (rank === 2) ctx.fillStyle = C.SILVER;
    else if (rank === 3) ctx.fillStyle = C.BRONZE;
    else ctx.fillStyle = C.TEXT2;
    ctx.fillText('#' + rank, padX + rankW / 2, cy + Math.round(rankFontSize * 0.35));

    // Name (truncated)
    const nameRaw = formatName(r.name);
    const nameX = padX + rankW + 10;
    const truncated = truncateName(nameRaw, nameMaxW - (r.nationality ? 50 : 0));
    ctx.fillStyle = rank <= 3 ? C.TEXT : C.TEXT;
    ctx.font = 'bold ' + nameFontSize + 'px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(truncated, nameX, cy + Math.round(nameFontSize * 0.35) - (r.nationality ? 4 : 0));

    // Nationality badge (compact, below name)
    if (r.nationality) {
      const badgeY = cy + Math.round(nameFontSize * 0.35) + (isStory ? 12 : 8);
      ctx.font = flagFontSize + 'px SF Mono, Cascadia Code, monospace';
      ctx.fillStyle = C.TEXT2;
      const flagText = r.nationality;
      const tw = ctx.measureText(flagText).width;
      // small pill background
      ctx.fillStyle = 'rgba(139,143,163,0.15)';
      roundRect(nameX, badgeY - flagFontSize + 2, tw + 12, flagFontSize + 6, 4);
      ctx.fill();
      ctx.fillStyle = C.TEXT2;
      ctx.fillText(flagText, nameX + 6, badgeY);
    }

    // Time (right-aligned)
    ctx.fillStyle = C.ACCENT;
    ctx.font = 'bold ' + timeFontSize + 'px SF Mono, Cascadia Code, monospace';
    ctx.textAlign = 'right';
    ctx.fillText(minsToTime(r.total_time), W - padX - 10, cy + Math.round(timeFontSize * 0.35));
  });

  // Total participants count
  if (filtered && filtered.length) {
    const countY = startY + 10 * rowH + 15;
    ctx.fillStyle = C.TEXT2;
    ctx.font = '20px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(filtered.length.toLocaleString() + ' partecipanti totali', W / 2, countY);
  }

  const footerExtra = [data.div, data.gen].filter(Boolean).join(' | ');
  drawFooter(footerExtra);
}

function drawReportGraphic(ctx, W, H, data, drawHeader, drawFooter, roundRect, C) {
  const { event, n, times, avg, median, p10, p90, avgSplits, slowest, fastest, subtitle } = data;
  const title = `REPORT - ${event.location.toUpperCase()} ${event.year}`;
  drawHeader(title);

  ctx.fillStyle = C.TEXT2;
  ctx.font = '24px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(subtitle || 'Tutte le divisioni', W / 2, 200);

  const padX = 60;
  let y = 240;

  // Stats blocks
  const stats = [
    { label: 'PARTECIPANTI', value: n.toLocaleString() },
    { label: 'MIGLIOR TEMPO', value: minsToTime(times[0]) },
    { label: 'TEMPO MEDIO', value: minsToTime(avg) },
    { label: 'MEDIANA', value: minsToTime(median) },
  ];
  if (p10) stats.push({ label: 'TOP 10%', value: minsToTime(p10) });
  if (p90) stats.push({ label: 'TOP 90%', value: minsToTime(p90) });

  const cols = Math.min(stats.length, 3);
  const boxW = (W - 2 * padX - (cols - 1) * 15) / cols;
  const boxH = 90;

  stats.forEach((s, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const bx = padX + col * (boxW + 15);
    const by = y + row * (boxH + 15);

    ctx.fillStyle = C.SURFACE;
    roundRect(bx, by, boxW, boxH, 10);
    ctx.fill();

    ctx.fillStyle = C.TEXT2;
    ctx.font = '16px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(s.label, bx + boxW / 2, by + 30);

    ctx.fillStyle = C.ACCENT;
    ctx.font = 'bold 30px SF Mono, Cascadia Code, monospace';
    ctx.fillText(s.value, bx + boxW / 2, by + 68);
  });

  const statRows = Math.ceil(stats.length / cols);
  y += statRows * (boxH + 15) + 30;

  // Bar chart - average split times
  if (avgSplits.length) {
    ctx.fillStyle = C.TEXT;
    ctx.font = 'bold 22px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('TEMPI MEDI PER STAZIONE', padX, y);
    y += 30;

    const sorted = [...avgSplits].sort((a, b) => b.avg - a.avg);
    const maxVal = sorted[0].avg;
    const barMaxW = W - 2 * padX - 180;
    const barH = H === 1920 ? 55 : 40;
    const barGap = H === 1920 ? 12 : 8;

    sorted.forEach(s => {
      const barW = (s.avg / maxVal) * barMaxW;
      let barColor = C.TEXT2;
      if (s === slowest) barColor = '#ff6b6b';
      else if (s === fastest) barColor = C.GREEN;

      // Label
      ctx.fillStyle = C.TEXT;
      ctx.font = '18px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(s.name, padX, y + barH / 2 + 6);

      // Bar
      ctx.fillStyle = barColor;
      roundRect(padX + 150, y, barW, barH, 6);
      ctx.fill();

      // Time label on bar
      ctx.fillStyle = C.BG;
      ctx.font = 'bold 16px SF Mono, Cascadia Code, monospace';
      ctx.textAlign = 'left';
      ctx.fillText(minsToTime(s.avg), padX + 158, y + barH / 2 + 6);

      y += barH + barGap;
    });

    // Legend
    y += 10;
    ctx.font = '16px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ff6b6b';
    ctx.fillRect(padX, y, 14, 14);
    ctx.fillStyle = C.TEXT2;
    ctx.fillText('Piu lenta', padX + 22, y + 12);
    ctx.fillStyle = C.GREEN;
    ctx.fillRect(padX + 140, y, 14, 14);
    ctx.fillStyle = C.TEXT2;
    ctx.fillText('Piu veloce', padX + 162, y + 12);
  }

  drawFooter([data.div, data.gen].filter(Boolean).join(' | '));
}

function drawAthleteGraphic(ctx, W, H, data, drawHeader, drawFooter, roundRect, C) {
  const { name, races, best } = data;
  drawHeader(name.toUpperCase());

  const padX = 60;
  let y = 210;

  // Best time big
  ctx.fillStyle = C.TEXT2;
  ctx.font = '22px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('MIGLIOR TEMPO', W / 2, y);
  y += 50;
  ctx.fillStyle = C.ACCENT;
  ctx.font = 'bold 60px SF Mono, Cascadia Code, monospace';
  ctx.fillText(best ? minsToTime(best.total_time) : '--:--', W / 2, y);
  y += 30;

  // Races count
  ctx.fillStyle = C.TEXT2;
  ctx.font = '22px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif';
  ctx.fillText(`${races.length} gara/e disputata/e`, W / 2, y + 30);
  y += 70;

  // Best race splits as bars
  if (best) {
    const splits = [
      { name: 'SkiErg', val: best.skiErg },
      { name: 'Sled Push', val: best.sledPush },
      { name: 'Sled Pull', val: best.sledPull },
      { name: 'Burpee BJ', val: best.burpee },
      { name: 'Row', val: best.row },
      { name: 'Farmers', val: best.farmersCarry },
      { name: 'Lunges', val: best.lunges },
      { name: 'Wall Balls', val: best.wallBalls },
    ].filter(s => s.val);

    if (splits.length) {
      ctx.fillStyle = C.TEXT;
      ctx.font = 'bold 22px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('SPLIT MIGLIOR GARA', padX, y);
      y += 30;

      const bestSplit = splits.reduce((a, b) => a.val < b.val ? a : b);
      const worstSplit = splits.reduce((a, b) => a.val > b.val ? a : b);
      const maxVal = worstSplit.val;
      const barMaxW = W - 2 * padX - 180;
      const barH = H === 1920 ? 55 : 45;
      const barGap = H === 1920 ? 12 : 8;

      splits.forEach(s => {
        const barW = Math.max((s.val / maxVal) * barMaxW, 20);
        let barColor = C.TEXT2;
        if (s === bestSplit) barColor = C.GREEN;
        else if (s === worstSplit) barColor = '#ff6b6b';

        ctx.fillStyle = C.TEXT;
        ctx.font = '18px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(s.name, padX, y + barH / 2 + 6);

        ctx.fillStyle = barColor;
        roundRect(padX + 150, y, barW, barH, 6);
        ctx.fill();

        ctx.fillStyle = C.BG;
        ctx.font = 'bold 16px SF Mono, Cascadia Code, monospace';
        ctx.textAlign = 'left';
        ctx.fillText(minsToTime(s.val), padX + 158, y + barH / 2 + 6);

        y += barH + barGap;
      });

      // Legend
      y += 10;
      ctx.font = '16px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillStyle = C.GREEN;
      ctx.fillRect(padX, y, 14, 14);
      ctx.fillStyle = C.TEXT2;
      ctx.fillText('Punto forte', padX + 22, y + 12);
      ctx.fillStyle = '#ff6b6b';
      ctx.fillRect(padX + 150, y, 14, 14);
      ctx.fillStyle = C.TEXT2;
      ctx.fillText('Punto debole', padX + 172, y + 12);
    }
  }

  drawFooter('');
}

// -- Distribuzione Graphic --
function drawDistribuzioneGraphic(ctx, W, H, data, drawHeader, drawFooter, roundRect, C) {
  const { event, times, n, avg, median, stddev, p10, p25, p75, p90, subtitle } = data;
  const isStory = H === 1920;
  drawHeader('DISTRIBUZIONE TEMPI - ' + event.location.toUpperCase() + ' ' + event.year);

  ctx.fillStyle = C.TEXT2;
  ctx.font = '24px Inter, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(subtitle || 'Tutte le divisioni', W / 2, 200);

  const padX = 60;
  let y = 240;

  // Stats cards (2 rows x 3)
  const stats = [
    { label: 'PARTECIPANTI', value: n.toLocaleString() },
    { label: 'PIU VELOCE', value: minsToTime(times[0]) },
    { label: 'PIU LENTO', value: minsToTime(times[n - 1]) },
    { label: 'MEDIA', value: minsToTime(avg) },
    { label: 'MEDIANA', value: minsToTime(median) },
    { label: 'DEV. STD', value: minsToTime(stddev) },
  ];
  const cols = 3, boxW = (W - 2 * padX - 30) / cols, boxH = isStory ? 110 : 85;
  stats.forEach((s, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    const bx = padX + col * (boxW + 15), by = y + row * (boxH + 15);
    ctx.fillStyle = C.SURFACE; roundRect(bx, by, boxW, boxH, 10); ctx.fill();
    ctx.fillStyle = C.TEXT2; ctx.font = '15px Inter, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(s.label, bx + boxW / 2, by + 28);
    ctx.fillStyle = C.ACCENT; ctx.font = 'bold 28px JetBrains Mono, monospace';
    ctx.fillText(s.value, bx + boxW / 2, by + boxH - 18);
  });
  y += 2 * (boxH + 15) + 30;

  // Histogram
  const histH = isStory ? 500 : 280;
  const histW = W - 2 * padX;
  const sorted = [...times].sort((a, b) => a - b);
  const minV = sorted[0], maxV = sorted[sorted.length - 1], range = maxV - minV || 1;
  const numBins = Math.min(40, Math.max(15, Math.floor(n / 10)));
  const binWidth = range / numBins;
  const bins = new Array(numBins).fill(0);
  times.forEach(v => { let idx = Math.floor((v - minV) / binWidth); if (idx >= numBins) idx = numBins - 1; bins[idx]++; });
  const maxBin = Math.max(...bins);

  const barW = histW / numBins;
  bins.forEach((count, i) => {
    const barH = maxBin > 0 ? (count / maxBin) * (histH - 40) : 0;
    const x = padX + i * barW;
    const by2 = y + histH - 20 - barH;
    const binCenter = minV + (i + 0.5) * binWidth;

    // Gradient color based on position
    if (binCenter <= p25) ctx.fillStyle = 'rgba(0,214,143,0.6)';
    else if (binCenter <= median) ctx.fillStyle = 'rgba(0,214,143,0.35)';
    else if (binCenter <= p75) ctx.fillStyle = 'rgba(200,255,0,0.3)';
    else ctx.fillStyle = 'rgba(255,107,107,0.35)';

    roundRect(x + 1, by2, barW - 2, barH, 2); ctx.fill();
  });

  // Percentile lines
  const drawPLine = (val, label, color) => {
    const px = padX + ((val - minV) / range) * histW;
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(px, y); ctx.lineTo(px, y + histH - 20); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = color; ctx.font = 'bold 13px Inter, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(label, px, y - 4);
    ctx.font = '12px JetBrains Mono, monospace';
    ctx.fillText(minsToTime(val), px, y + histH - 4);
  };
  drawPLine(p10, 'Top 10%', C.GREEN);
  drawPLine(median, 'Mediana', C.ACCENT);
  drawPLine(p90, 'Bottom 10%', C.RED);

  // X axis label
  y += histH + 20;
  ctx.fillStyle = C.TEXT2; ctx.font = '16px Inter, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('Tempo totale (hh:mm)', W / 2, y);

  drawFooter([data.div, data.gen].filter(Boolean).join(' | '));
}

// -- Stazioni Graphic --
function drawStazioniGraphic(ctx, W, H, data, drawHeader, drawFooter, roundRect, C) {
  const { event, sorted, slowest, fastest, totalAvg, subtitle } = data;
  const isStory = H === 1920;
  drawHeader('CONFRONTO STAZIONI - ' + event.location.toUpperCase() + ' ' + event.year);

  ctx.fillStyle = C.TEXT2; ctx.font = '24px Inter, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(subtitle || 'Tutte le divisioni', W / 2, 200);

  const padX = 60;
  let y = 250;

  // Bar chart
  const maxVal = sorted[0].avg;
  const barMaxW = W - 2 * padX - 200;
  const barH = isStory ? 70 : 52;
  const barGap = isStory ? 18 : 12;

  sorted.forEach(s => {
    const barW = Math.max((s.avg / maxVal) * barMaxW, 30);
    let barColor;
    if (s === slowest) barColor = C.RED;
    else if (s === fastest) barColor = C.GREEN;
    else barColor = 'rgba(200,255,0,0.4)';

    // Label
    ctx.fillStyle = C.TEXT; ctx.font = 'bold 18px Inter, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(s.name, padX, y + barH / 2 + 6);

    // Bar with gradient
    if (s === slowest || s === fastest) {
      ctx.fillStyle = barColor;
    } else {
      const grad = ctx.createLinearGradient(padX + 160, 0, padX + 160 + barW, 0);
      grad.addColorStop(0, 'rgba(200,255,0,0.5)'); grad.addColorStop(1, 'rgba(200,255,0,0.15)');
      ctx.fillStyle = grad;
    }
    roundRect(padX + 160, y, barW, barH, 8); ctx.fill();

    // Time + pct on bar
    ctx.fillStyle = C.TEXT; ctx.font = 'bold 17px JetBrains Mono, monospace'; ctx.textAlign = 'left';
    ctx.fillText(minsToTime(s.avg), padX + 170, y + barH / 2 - 2);
    ctx.fillStyle = C.TEXT2; ctx.font = '14px Inter, sans-serif';
    ctx.fillText(s.pct.toFixed(1) + '%', padX + 170, y + barH / 2 + 16);

    y += barH + barGap;
  });

  // Legend
  y += 15;
  ctx.font = '16px Inter, sans-serif'; ctx.textAlign = 'left';
  ctx.fillStyle = C.RED; ctx.fillRect(padX, y, 16, 16); ctx.fillStyle = C.TEXT2; ctx.fillText('Piu lenta', padX + 24, y + 13);
  ctx.fillStyle = C.GREEN; ctx.fillRect(padX + 140, y, 16, 16); ctx.fillStyle = C.TEXT2; ctx.fillText('Piu veloce', padX + 164, y + 13);

  // Pie-style summary
  y += 50;
  ctx.fillStyle = C.TEXT; ctx.font = 'bold 20px Inter, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('DISTRIBUZIONE % TEMPO STAZIONI', W / 2, y);
  y += 30;

  // Stacked horizontal bar showing % breakdown
  const totalBarW = W - 2 * padX;
  let xOff = padX;
  const colors = ['#00d68f', '#3dd9a4', '#7ae5c0', '#c8ff00', '#e8ff66', '#ffcc00', '#ff9966', '#ff6b6b'];
  sorted.slice().reverse().forEach((s, i) => {
    const segW = (s.pct / 100) * totalBarW;
    ctx.fillStyle = colors[i % colors.length];
    roundRect(xOff, y, segW - 1, 30, i === 0 ? 6 : i === sorted.length - 1 ? 6 : 0);
    ctx.fill();
    // Label on segment if wide enough
    if (segW > 50) {
      ctx.fillStyle = C.BG; ctx.font = 'bold 12px Inter, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(s.pct.toFixed(0) + '%', xOff + segW / 2, y + 20);
    }
    xOff += segW;
  });

  // Legend below stacked bar
  y += 50;
  const legendCols = isStory ? 2 : 4;
  const legendColW = (W - 2 * padX) / legendCols;
  sorted.slice().reverse().forEach((s, i) => {
    const col = i % legendCols, row = Math.floor(i / legendCols);
    const lx = padX + col * legendColW, ly = y + row * 25;
    ctx.fillStyle = colors[i % colors.length]; ctx.fillRect(lx, ly, 12, 12);
    ctx.fillStyle = C.TEXT2; ctx.font = '13px Inter, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(s.name, lx + 18, ly + 11);
  });

  drawFooter([data.div, data.gen].filter(Boolean).join(' | '));
}

// -- Pacing Analysis Graphic --
function drawPacingGraphic(ctx, W, H, data, drawHeader, drawFooter, roundRect, C) {
  const { event, runAvgs, wallIdx, wallDelta, negSplitCount, posSplitCount, negSplitPct, totalSplitAthletes, subtitle } = data;
  const isStory = H === 1920;
  drawHeader('PACING ANALYSIS - ' + event.location.toUpperCase() + ' ' + event.year);

  ctx.fillStyle = C.TEXT2; ctx.font = '24px Inter, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(subtitle || 'Tutte le divisioni', W / 2, 200);

  const padX = 60;
  let y = 250;

  // Run times bar chart
  const maxRun = Math.max(...runAvgs.map(r => r.avg));
  const minRun = Math.min(...runAvgs.map(r => r.avg));
  const chartH = isStory ? 450 : 280;
  const chartW = W - 2 * padX;
  const barW = chartW / runAvgs.length - 10;
  const chartBottom = y + chartH;
  const scaleRange = maxRun - minRun * 0.85 || 1;

  runAvgs.forEach((r, i) => {
    const x = padX + i * (barW + 10) + 5;
    const barH = ((r.avg - minRun * 0.85) / scaleRange) * (chartH - 60);
    const by = chartBottom - barH;

    // Bar color based on fade
    let barColor;
    if (i === wallIdx) barColor = C.RED;
    else if (r.fade <= 0) barColor = C.GREEN;
    else if (r.fade < 5) barColor = 'rgba(200,255,0,0.6)';
    else barColor = 'rgba(255,165,0,0.5)';

    ctx.fillStyle = barColor;
    roundRect(x, by, barW, barH, 6); ctx.fill();

    // Time label on top
    ctx.fillStyle = C.TEXT; ctx.font = 'bold 15px JetBrains Mono, monospace'; ctx.textAlign = 'center';
    ctx.fillText(minsToTime(r.avg), x + barW / 2, by - 22);

    // Fade % below time
    if (i > 0) {
      ctx.fillStyle = r.fade > 0 ? C.RED : C.GREEN;
      ctx.font = '13px JetBrains Mono, monospace';
      ctx.fillText((r.fade > 0 ? '+' : '') + r.fade.toFixed(1) + '%', x + barW / 2, by - 6);
    }

    // Run label at bottom
    ctx.fillStyle = C.TEXT2; ctx.font = 'bold 16px Inter, sans-serif';
    ctx.fillText(r.name, x + barW / 2, chartBottom + 22);
  });

  // "The Wall" indicator
  if (runAvgs.length > wallIdx) {
    const wallX = padX + wallIdx * (barW + 10) + 5 + barW / 2;
    ctx.fillStyle = C.RED; ctx.font = 'bold 14px Inter, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('THE WALL', wallX, chartBottom + 42);
  }

  y = chartBottom + 65;

  // Stats cards
  const cardData = [
    { label: 'THE WALL', value: runAvgs[wallIdx].name, sub: '+' + minsToTime(wallDelta) + ' vs precedente' },
    { label: 'FADE TOTALE', value: '+' + runAvgs[runAvgs.length - 1].fade.toFixed(1) + '%', sub: 'da Run 1 a Run 8' },
    { label: 'NEGATIVE SPLIT', value: negSplitPct.toFixed(0) + '%', sub: negSplitCount + '/' + totalSplitAthletes + ' atleti' },
  ];
  const cardW = (W - 2 * padX - 30) / 3, cardH = isStory ? 120 : 90;
  cardData.forEach((c, i) => {
    const cx = padX + i * (cardW + 15);
    ctx.fillStyle = C.SURFACE; roundRect(cx, y, cardW, cardH, 10); ctx.fill();
    ctx.fillStyle = C.TEXT2; ctx.font = '13px Inter, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(c.label, cx + cardW / 2, y + 22);
    ctx.fillStyle = i === 0 ? C.RED : i === 1 ? '#ffa500' : C.GREEN;
    ctx.font = 'bold 26px JetBrains Mono, monospace';
    ctx.fillText(c.value, cx + cardW / 2, y + cardH / 2 + 8);
    if (c.sub) { ctx.fillStyle = C.TEXT2; ctx.font = '12px Inter, sans-serif'; ctx.fillText(c.sub, cx + cardW / 2, y + cardH - 12); }
  });

  // Neg vs Pos split donut
  if (isStory && totalSplitAthletes > 0) {
    y += cardH + 50;
    const centerX = W / 2, centerY = y + 80, radius = 70, thick = 25;
    const negAngle = (negSplitPct / 100) * Math.PI * 2;

    // Positive (red)
    ctx.beginPath(); ctx.arc(centerX, centerY, radius, negAngle - Math.PI / 2, 1.5 * Math.PI);
    ctx.arc(centerX, centerY, radius - thick, 1.5 * Math.PI, negAngle - Math.PI / 2, true);
    ctx.closePath(); ctx.fillStyle = 'rgba(255,107,107,0.6)'; ctx.fill();

    // Negative (green)
    ctx.beginPath(); ctx.arc(centerX, centerY, radius, -Math.PI / 2, negAngle - Math.PI / 2);
    ctx.arc(centerX, centerY, radius - thick, negAngle - Math.PI / 2, -Math.PI / 2, true);
    ctx.closePath(); ctx.fillStyle = 'rgba(0,214,143,0.7)'; ctx.fill();

    // Labels
    ctx.fillStyle = C.TEXT; ctx.font = 'bold 18px Inter, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Negative Split', centerX - 130, centerY + 5);
    ctx.fillText('Positive Split', centerX + 130, centerY + 5);
    ctx.fillStyle = C.GREEN; ctx.font = 'bold 22px JetBrains Mono, monospace';
    ctx.fillText(negSplitPct.toFixed(0) + '%', centerX - 130, centerY + 30);
    ctx.fillStyle = C.RED;
    ctx.fillText((100 - negSplitPct).toFixed(0) + '%', centerX + 130, centerY + 30);
  }

  drawFooter([data.div, data.gen].filter(Boolean).join(' | '));
}

// -- Nazionalita Graphic --

  ctx.fillText(subtitle || 'Tutte le divisioni', W / 2, 200);

  const padX = 60;
  let y = 250;
  const maxCount = top10.length ? top10[0].count : 1;
  const barMaxW = W - 2 * padX - 220;
  const barH = isStory ? 70 : 52;

  ctx.fillStyle = C.TEXT; ctx.font = 'bold 20px Inter, sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('TOP 10 NAZIONALITA PER PARTECIPANTI', padX, y); y += 35;

  top10.forEach((n, i) => {
    const barW = Math.max((n.count / maxCount) * barMaxW, 30);

    else if (i < 3) { grad.addColorStop(0, 'rgba(200,255,0,0.5)'); grad.addColorStop(1, 'rgba(200,255,0,0.15)'); }
    else { grad.addColorStop(0, 'rgba(139,143,163,0.4)'); grad.addColorStop(1, 'rgba(139,143,163,0.1)'); }
    ctx.fillStyle = grad;
    roundRect(padX + 80, y, barW, barH, 8); ctx.fill();

    // Rank + flag code
    ctx.fillStyle = i === 0 ? C.ACCENT : C.TEXT;
    ctx.font = 'bold 20px Inter, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(n.nat, padX, y + barH / 2 + 7);

    // Count + pct on bar
    ctx.fillStyle = C.TEXT; ctx.font = 'bold 16px JetBrains Mono, monospace'; ctx.textAlign = 'left';
    ctx.fillText(n.count + ' atleti', padX + 90, y + barH / 2 - 1);
    ctx.fillStyle = C.TEXT2; ctx.font = '13px Inter, sans-serif';
    ctx.fillText(pct + '%', padX + 90, y + barH / 2 + 16);

    // Avg time on right
    if (n.avgTime) {
      ctx.fillStyle = C.ACCENT; ctx.font = '15px JetBrains Mono, monospace'; ctx.textAlign = 'right';
      ctx.fillText(minsToTime(n.avgTime), W - padX, y + barH / 2 + 6);
    }

    y += barH + barGap;
  });

  // Fastest nationality card
  if (fastestNat) {
    y += 20;
    ctx.fillStyle = C.SURFACE;
    roundRect(padX, y, W - 2 * padX, isStory ? 100 : 80, 12); ctx.fill();

    ctx.fillStyle = C.TEXT2; ctx.font = '15px Inter, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('NAZIONALITA PIU VELOCE (min. 3 atleti)', W / 2, y + 25);
    ctx.fillStyle = C.GREEN; ctx.font = 'bold 30px JetBrains Mono, monospace';
    ctx.fillText(fastestNat.nat + '  ' + minsToTime(fastestNat.avgTime), W / 2, y + (isStory ? 68 : 58));
  }

  drawFooter([data.div, data.gen].filter(Boolean).join(' | '));
}

  ctx.fillStyle = C.BG; ctx.fillRect(0, 0, W, H);
