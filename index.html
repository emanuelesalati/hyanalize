<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HYANALIZE — Hyrox Dashboard</title>
  <style>
    :root {
      --bg: #0f1117; --surface: #1a1d27; --surface2: #232736; --border: #2e3347;
      --text: #e4e6ed; --text2: #8b8fa3; --accent: #c8ff00; --accent2: #a3cc00;
      --gold: #ffd700; --silver: #c0c0c0; --bronze: #cd7f32; --green: #00d68f;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }

    .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1.2rem 2rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
    .header h1 { font-size: 1.5rem; font-weight: 700; }
    .header h1 span { color: var(--accent); }
    .header .meta { color: var(--text2); font-size: 0.85rem; }

    .container { max-width: 1400px; margin: 0 auto; padding: 1.5rem; }

    .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem; }
    .kpi .label { color: var(--text2); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .kpi .value { font-size: 1.8rem; font-weight: 700; color: var(--accent); margin-top: 0.3rem; }
    .kpi .sub { color: var(--text2); font-size: 0.85rem; margin-top: 0.2rem; }

    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .tab { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.6rem 1.2rem; color: var(--text2); cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
    .tab:hover { border-color: var(--accent); color: var(--text); }
    .tab.active { background: var(--accent); color: var(--bg); font-weight: 600; border-color: var(--accent); }

    .section { display: none; }
    .section.active { display: block; }

    .filters { display: flex; gap: 0.8rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
    .filters select, .filters input { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 0.8rem; color: var(--text); font-size: 0.85rem; min-width: 140px; }
    .filters select:focus, .filters input:focus { outline: none; border-color: var(--accent); }
    .filters label { color: var(--text2); font-size: 0.8rem; }

    .table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); max-height: 70vh; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { background: var(--surface2); color: var(--text2); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px; padding: 0.8rem 0.8rem; text-align: left; position: sticky; top: 0; cursor: pointer; user-select: none; z-index: 1; }
    th:hover { color: var(--accent); }
    th.sorted-asc::after { content: ' ▲'; color: var(--accent); }
    th.sorted-desc::after { content: ' ▼'; color: var(--accent); }
    td { padding: 0.6rem 0.8rem; border-top: 1px solid var(--border); }
    tr:hover td { background: var(--surface2); }
    .rank-1 { color: var(--gold); font-weight: 700; }
    .rank-2 { color: var(--silver); font-weight: 700; }
    .rank-3 { color: var(--bronze); font-weight: 700; }
    .time { font-variant-numeric: tabular-nums; font-family: 'SF Mono', 'Cascadia Code', monospace; }

    .event-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; }
    .event-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem; cursor: pointer; transition: all 0.2s; }
    .event-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .event-card h3 { font-size: 1rem; margin-bottom: 0.2rem; }
    .event-card .city { color: var(--accent); font-size: 0.9rem; }
    .event-card .info { color: var(--text2); font-size: 0.85rem; margin-top: 0.4rem; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem; }
    .stat-card h3 { font-size: 0.95rem; margin-bottom: 0.8rem; color: var(--accent); }
    .stat-row { display: flex; justify-content: space-between; padding: 0.3rem 0; font-size: 0.85rem; }
    .stat-row .sl { color: var(--text2); }

    .pagination { display: flex; gap: 0.5rem; justify-content: center; align-items: center; margin-top: 1rem; color: var(--text2); font-size: 0.85rem; }
    .pagination button { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 0.4rem 0.8rem; color: var(--text); cursor: pointer; }
    .pagination button:hover { border-color: var(--accent); }
    .pagination button:disabled { opacity: 0.3; cursor: default; }

    .loading-msg { text-align: center; padding: 2rem; color: var(--text2); }

    .content-type-btns { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .content-type-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 0.6rem 1.2rem; color: var(--text2); cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
    .content-type-btn:hover { border-color: var(--accent); color: var(--text); }
    .content-type-btn.active { background: var(--accent); color: var(--bg); font-weight: 600; border-color: var(--accent); }

    .content-output { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-top: 1rem; white-space: pre-wrap; font-size: 0.9rem; line-height: 1.7; position: relative; min-height: 80px; }
    .content-output:empty::before { content: 'Seleziona un evento e clicca Genera'; color: var(--text2); }

    .btn-copy { position: absolute; top: 0.8rem; right: 0.8rem; background: var(--accent); color: var(--bg); border: none; border-radius: 6px; padding: 0.4rem 1rem; cursor: pointer; font-weight: 600; font-size: 0.8rem; }
    .btn-copy:hover { background: var(--accent2); }
    .btn-generate { background: var(--accent); color: var(--bg); border: none; border-radius: 8px; padding: 0.6rem 1.5rem; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
    .btn-generate:hover { background: var(--accent2); }

    .athlete-results { margin-top: 1rem; }
    .athlete-race-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 0; margin-bottom: 1.2rem; overflow: hidden; }
    .athlete-race-card h4 { color: var(--accent); margin-bottom: 0.5rem; }
    .athlete-splits { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.3rem; margin-top: 0.5rem; }
    .athlete-split { font-size: 0.8rem; }
    .athlete-split .sl { color: var(--text2); }
    .athlete-split .sv { font-family: 'SF Mono', monospace; }
    .athlete-best { color: var(--green); font-weight: 600; }
    .athlete-worst { color: #ff6b6b; font-weight: 600; }

    /* Enhanced race card styles */
    .arc-header { padding: 1.2rem 1.5rem; border-bottom: 1px solid var(--border); }
    .arc-event-line { color: var(--text2); font-size: 0.85rem; margin-bottom: 0.3rem; letter-spacing: 0.5px; text-transform: uppercase; }
    .arc-meta-line { color: var(--text2); font-size: 0.8rem; margin-top: 0.4rem; }
    .arc-meta-line span { display: inline-block; margin-right: 0.5rem; padding: 0.15rem 0.5rem; background: var(--surface2); border-radius: 4px; font-size: 0.75rem; }
    .arc-total-time { font-size: 2rem; font-weight: 800; color: var(--accent); font-family: 'SF Mono', 'Cascadia Code', monospace; margin-top: 0.3rem; }

    .arc-ranking-badge { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.8rem; border-radius: 8px; font-size: 0.85rem; font-weight: 700; margin: 0.8rem 1.5rem; }
    .arc-ranking-badge.top25 { background: rgba(0,214,143,0.15); color: #00d68f; border: 1px solid rgba(0,214,143,0.3); }
    .arc-ranking-badge.top50 { background: rgba(200,255,0,0.12); color: #c8ff00; border: 1px solid rgba(200,255,0,0.25); }
    .arc-ranking-badge.top75 { background: rgba(255,165,0,0.12); color: #ffa500; border: 1px solid rgba(255,165,0,0.25); }
    .arc-ranking-badge.bottom25 { background: rgba(255,107,107,0.12); color: #ff6b6b; border: 1px solid rgba(255,107,107,0.25); }

    .arc-body { padding: 1rem 1.5rem; }
    .arc-section-title { font-size: 0.75rem; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.6rem; font-weight: 600; }

    .arc-split-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem; font-size: 0.82rem; }
    .arc-split-name { width: 85px; color: var(--text2); flex-shrink: 0; font-size: 0.78rem; }
    .arc-split-bars { flex: 1; position: relative; height: 22px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
    .arc-split-bar-athlete { height: 100%; border-radius: 4px; min-width: 4px; transition: width 0.3s; }
    .arc-split-bar-avg { position: absolute; top: 0; width: 2px; height: 100%; background: rgba(255,255,255,0.5); z-index: 2; }
    .arc-split-time { width: 60px; text-align: right; font-family: 'SF Mono', monospace; font-weight: 600; flex-shrink: 0; font-size: 0.8rem; }
    .arc-split-rank { width: 44px; text-align: right; font-size: 0.72rem; color: var(--text2); flex-shrink: 0; }
    .arc-split-delta { width: 56px; text-align: right; font-size: 0.72rem; flex-shrink: 0; font-family: 'SF Mono', monospace; }
    .arc-split-delta.faster { color: #00d68f; }
    .arc-split-delta.slower { color: #ff6b6b; }

    .arc-legend { display: flex; gap: 1rem; margin-top: 0.5rem; font-size: 0.72rem; color: var(--text2); align-items: center; }
    .arc-legend-dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 3px; vertical-align: middle; }

    .arc-radar-section { display: flex; justify-content: center; padding: 1rem 1.5rem; border-top: 1px solid var(--border); }
    .arc-radar-canvas { max-width: 100%; }

    .arc-stations-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; padding: 1rem 1.5rem; border-top: 1px solid var(--border); }
    .arc-station-card { background: var(--surface2); border-radius: 12px; padding: 1rem; }
    .arc-station-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.6rem; }
    .arc-station-name { font-weight: 700; font-size: 0.9rem; }
    .arc-station-time { font-family: 'SF Mono', monospace; font-size: 1.1rem; font-weight: 800; color: var(--accent); }
    .arc-station-badges { display: flex; gap: 0.4rem; margin-bottom: 0.6rem; }
    .arc-station-badge { font-size: 0.7rem; padding: 0.15rem 0.5rem; border-radius: 4px; font-weight: 600; }
    .arc-histo-wrap { position: relative; height: 80px; margin-top: 0.4rem; }
    .arc-histo-canvas { width: 100%; height: 100%; }
    .arc-histo-axis { display: flex; justify-content: space-between; font-size: 0.65rem; color: var(--text2); margin-top: 2px; font-family: monospace; }

    .arc-footer { padding: 0.8rem 1.5rem; border-top: 1px solid var(--border); display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }

    /* Cross Analysis styles */
    .cross-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .cross-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem; }
    .cross-card h3 { font-size: 0.8rem; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.4rem; }
    .cross-card .big { font-size: 1.6rem; font-weight: 800; color: var(--accent); font-family: 'SF Mono', monospace; }
    .cross-card .sub { font-size: 0.8rem; color: var(--text2); margin-top: 0.2rem; }

    .cross-section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.2rem; }
    .cross-section h3 { font-size: 1rem; font-weight: 700; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
    .cross-section h3 .icon { color: var(--accent); }

    .cross-chart-wrap { position: relative; width: 100%; }
    .cross-chart-wrap canvas { display: block; max-width: 100%; }

    .cross-pb-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.8rem; }
    .cross-pb-item { background: var(--surface2); border-radius: 8px; padding: 0.8rem; }
    .cross-pb-item .station { font-size: 0.8rem; color: var(--text2); text-transform: uppercase; letter-spacing: 0.3px; }
    .cross-pb-item .pb-time { font-size: 1.3rem; font-weight: 800; color: var(--green); font-family: 'SF Mono', monospace; }
    .cross-pb-item .pb-where { font-size: 0.75rem; color: var(--text2); margin-top: 0.2rem; }

    .cross-weakness-row { display: flex; align-items: center; gap: 0.8rem; padding: 0.6rem 0; border-bottom: 1px solid var(--border); }
    .cross-weakness-row:last-child { border-bottom: none; }
    .cross-weakness-name { width: 100px; font-weight: 600; font-size: 0.85rem; flex-shrink: 0; }
    .cross-weakness-bar-wrap { flex: 1; height: 24px; background: var(--surface2); border-radius: 4px; overflow: hidden; position: relative; }
    .cross-weakness-bar { height: 100%; border-radius: 4px; }
    .cross-weakness-pct { width: 70px; text-align: right; font-family: 'SF Mono', monospace; font-size: 0.85rem; font-weight: 700; flex-shrink: 0; }

    .cross-fatigue-laps { display: flex; align-items: flex-end; gap: 4px; height: 120px; padding: 0 0.5rem; }
    .cross-fatigue-bar { flex: 1; background: var(--accent); border-radius: 4px 4px 0 0; min-width: 30px; position: relative; transition: height 0.3s; }
    .cross-fatigue-bar .label { position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); font-size: 0.7rem; color: var(--text2); }
    .cross-fatigue-bar .val { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 0.7rem; font-family: monospace; color: var(--text); white-space: nowrap; }

    .cross-target-row { display: flex; align-items: center; gap: 0.8rem; padding: 0.5rem 0; font-size: 0.85rem; }
    .cross-target-station { width: 100px; color: var(--text2); flex-shrink: 0; }
    .cross-target-current { width: 65px; font-family: monospace; text-align: right; flex-shrink: 0; }
    .cross-target-arrow { color: var(--accent); flex-shrink: 0; }
    .cross-target-needed { width: 65px; font-family: monospace; text-align: right; flex-shrink: 0; color: var(--green); font-weight: 700; }
    .cross-target-delta { font-size: 0.8rem; color: var(--text2); flex-shrink: 0; }

    .cross-global-rank { display: flex; align-items: center; gap: 1rem; padding: 1rem; background: var(--surface2); border-radius: 12px; }
    .cross-global-rank .rank-num { font-size: 2.5rem; font-weight: 900; color: var(--accent); font-family: 'SF Mono', monospace; }
    .cross-global-rank .rank-detail { font-size: 0.85rem; color: var(--text2); }
    .cross-global-rank .rank-detail strong { color: var(--text); }

    @media (max-width: 500px) {
      .arc-split-delta { display: none; }
      .arc-split-rank { display: none; }
      .arc-split-name { width: 68px; font-size: 0.72rem; }
      .arc-total-time { font-size: 1.5rem; }
    }

    @media (max-width: 768px) {
      .header { padding: 1rem; }
      .container { padding: 1rem; }
      .kpi .value { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1><span>HY</span>ANALIZE</h1>
  <div class="meta" id="sync-info">Caricamento...</div>
</div>

<div class="container">
  <div class="kpi-row" id="kpi-row"></div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-section="events">Eventi</div>
    <div class="tab" data-section="results">Classifiche</div>
    <div class="tab" data-section="stats">Statistiche</div>
    <div class="tab" data-section="cross">Cross Analysis</div>
    <div class="tab" data-section="content">Contenuti IG</div>
  </div>

  <div class="section active" id="sec-events">
    <div class="filters">
      <label>Cerca</label>
      <input type="text" id="filter-event" placeholder="Citta, anno, stagione..." oninput="renderEvents()">
    </div>
    <div class="event-grid" id="event-grid"></div>
  </div>

  <div class="section" id="sec-results">
    <div class="filters" id="results-filters"></div>
    <div id="results-loading" class="loading-msg"></div>
    <div class="table-wrap" id="results-table-wrap" style="display:none">
      <table id="results-table"><thead><tr></tr></thead><tbody></tbody></table>
    </div>
    <div class="pagination" id="results-pagination"></div>
  </div>

  <div class="section" id="sec-stats">
    <div class="filters" id="stats-filters"></div>
    <div class="stats-grid" id="stats-grid"></div>
  </div>

  <div class="section" id="sec-cross">
    <div class="filters" id="cross-filters">
      <label>Cerca atleta</label>
      <input type="text" id="cross-athlete-search" placeholder="Nome atleta..." style="min-width:250px">
      <button class="btn-generate" onclick="crossSearch()">Analisi Cross-Evento</button>
    </div>
    <div id="cross-area"></div>
  </div>

  <div class="section" id="sec-content">
    <div class="content-type-btns" id="content-type-btns">
      <div class="content-type-btn active" data-type="top10">Top 10</div>
      <div class="content-type-btn" data-type="report">Report Evento</div>
      <div class="content-type-btn" data-type="athlete">Profilo Atleta</div>
    </div>

    <div class="filters" id="content-filters"></div>
    <div id="content-area"></div>
  </div>
</div>

<script>
let DATA = null;
let raceCache = {};
let currentRaceResults = [];
let filteredResults = [];
let currentSort = { col: 'total_time', asc: true };
let resultsPage = 0;
const PAGE_SIZE = 50;

function minsToTime(m) {
  if (!m || isNaN(m)) return '—';
  const t = Math.round(m * 60);
  const h = Math.floor(t / 3600), mn = Math.floor((t % 3600) / 60), s = t % 60;
  return h > 0 ? `${h}:${String(mn).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${mn}:${String(s).padStart(2,'0')}`;
}

// -- KPI --
function renderKPI() {
  const totalResults = DATA.events.reduce((s, e) => s + (e.results_count || 0), 0);
  const locations = new Set(DATA.events.map(e => `${e.location}_${e.year}`));
  const seasons = new Set(DATA.events.map(e => e.season));
  document.getElementById('kpi-row').innerHTML = `
    <div class="kpi"><div class="label">Gare</div><div class="value">${locations.size}</div><div class="sub">${seasons.size} stagioni</div></div>
    <div class="kpi"><div class="label">Risultati totali</div><div class="value">${totalResults.toLocaleString()}</div><div class="sub">${DATA.events.length} divisioni</div></div>
    <div class="kpi"><div class="label">Ultimo Sync</div><div class="value">${DATA.last_sync ? DATA.last_sync.slice(0,8).replace(/(\d{4})(\d{2})(\d{2})/, '$3/$2/$1') : '—'}</div></div>
  `;
}

// -- Events --
function renderEvents() {
  const grid = document.getElementById('event-grid');
  const q = (document.getElementById('filter-event')?.value || '').toLowerCase();
  let events = DATA.events;
  if (q) events = events.filter(e => [e.name, e.location, String(e.year), String(e.season), e.divisions?.join(' ')].join(' ').toLowerCase().includes(q));
  events = [...events].sort((a, b) => (b.season || 0) - (a.season || 0) || (b.year || 0) - (a.year || 0) || a.location.localeCompare(b.location));

  grid.innerHTML = events.length ? events.map(e => `
    <div class="event-card" onclick="loadRace('${e.key}')">
      <h3>${e.name}</h3>
      <div class="city">${e.location} ${e.year} — Season ${e.season}</div>
      <div class="info">${(e.results_count||0).toLocaleString()} atleti &middot; ${e.divisions?.join(', ') || ''}</div>
    </div>
  `).join('') : '<div class="loading-msg">Nessun evento trovato</div>';
}

// -- Load race results on demand --
async function loadRace(key) {
  document.querySelector('[data-section="results"]').click();
  const loading = document.getElementById('results-loading');
  const wrap = document.getElementById('results-table-wrap');

  // Set event selector
  const sel = document.getElementById('filter-event-select');
  if (sel) sel.value = key;

  if (raceCache[key]) {
    currentRaceResults = raceCache[key];
    applyResultFilters();
    return;
  }

  loading.textContent = 'Caricamento risultati...';
  wrap.style.display = 'none';
  document.getElementById('results-pagination').innerHTML = '';

  try {
    const resp = await fetch(`data/races/${key}.json`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    currentRaceResults = await resp.json();
    raceCache[key] = currentRaceResults;
    loading.textContent = '';
    wrap.style.display = '';
    applyResultFilters();
  } catch (err) {
    loading.textContent = `Errore: ${err.message}`;
  }
}

// -- Results filters --
function renderResultsFilters() {
  const events = DATA.events.sort((a, b) => a.name.localeCompare(b.name));
  document.getElementById('results-filters').innerHTML = `
    <label>Evento</label>
    <select id="filter-event-select" onchange="loadRace(this.value)" style="min-width:250px">
      <option value="">— Seleziona un evento —</option>
      ${events.map(e => `<option value="${e.key}">${e.name} (${e.location} ${e.year})</option>`).join('')}
    </select>
    <label>Divisione</label>
    <select id="filter-division" onchange="applyResultFilters()">
      <option value="">Tutte</option>
    </select>
    <label>Genere</label>
    <select id="filter-gender" onchange="applyResultFilters()">
      <option value="">Tutti</option>
    </select>
    <label>Cerca atleta</label>
    <input type="text" id="filter-athlete" placeholder="Nome..." oninput="applyResultFilters()">
  `;
}

function applyResultFilters() {
  // Update division/gender dropdowns based on loaded data
  const divSel = document.getElementById('filter-division');
  const genSel = document.getElementById('filter-gender');
  const curDiv = divSel.value;
  const curGen = genSel.value;

  const divs = [...new Set(currentRaceResults.map(r => r.division).filter(Boolean))].sort();
  const gens = [...new Set(currentRaceResults.map(r => r.gender).filter(Boolean))].sort();

  divSel.innerHTML = '<option value="">Tutte</option>' + divs.map(d => `<option value="${d}" ${d===curDiv?'selected':''}>${d}</option>`).join('');
  genSel.innerHTML = '<option value="">Tutti</option>' + gens.map(g => `<option value="${g}" ${g===curGen?'selected':''}>${g}</option>`).join('');

  const div = divSel.value;
  const gen = genSel.value;
  const search = (document.getElementById('filter-athlete').value || '').toLowerCase();

  filteredResults = currentRaceResults.filter(r => {
    if (div && r.division !== div) return false;
    if (gen && r.gender !== gen) return false;
    if (search && !(r.name || '').toLowerCase().includes(search)) return false;
    return true;
  });

  filteredResults.sort((a, b) => (a.total_time || 9999) - (b.total_time || 9999));
  currentSort = { col: 'total_time', asc: true };
  resultsPage = 0;

  document.getElementById('results-loading').textContent = '';
  document.getElementById('results-table-wrap').style.display = '';
  renderResultsTable();
}

function sortResults(col) {
  if (currentSort.col === col) currentSort.asc = !currentSort.asc;
  else { currentSort.col = col; currentSort.asc = true; }

  filteredResults.sort((a, b) => {
    let va = a[col], vb = b[col];
    if (va == null || va !== va) va = typeof vb === 'string' ? 'zzz' : 999999;
    if (vb == null || vb !== vb) vb = typeof va === 'string' ? 'zzz' : 999999;
    return typeof va === 'string'
      ? (currentSort.asc ? va.localeCompare(vb) : vb.localeCompare(va))
      : (currentSort.asc ? va - vb : vb - va);
  });
  resultsPage = 0;
  renderResultsTable();
}

function renderResultsTable() {
  const thead = document.querySelector('#results-table thead tr');
  const tbody = document.querySelector('#results-table tbody');

  const cols = [
    { key: '_rank', label: '#' },
    { key: 'name', label: 'Atleta' },
    { key: 'division', label: 'Divisione' },
    { key: 'gender', label: 'Gen' },
    { key: 'age_group', label: 'Eta' },
    { key: 'nationality', label: 'Naz' },
    { key: 'total_time', label: 'Tempo' },
    { key: 'skiErg', label: 'SkiErg' },
    { key: 'sledPush', label: 'Sled Push' },
    { key: 'sledPull', label: 'Sled Pull' },
    { key: 'burpee', label: 'Burpee' },
    { key: 'row', label: 'Row' },
    { key: 'farmersCarry', label: 'Farmers' },
    { key: 'lunges', label: 'Lunges' },
    { key: 'wallBalls', label: 'Wall Balls' },
    { key: 'run_time', label: 'Run' },
    { key: 'work_time', label: 'Work' },
  ];

  thead.innerHTML = cols.map(c => {
    let cls = currentSort.col === c.key ? (currentSort.asc ? 'sorted-asc' : 'sorted-desc') : '';
    return `<th class="${cls}" onclick="sortResults('${c.key}')">${c.label}</th>`;
  }).join('');

  const start = resultsPage * PAGE_SIZE;
  const page = filteredResults.slice(start, start + PAGE_SIZE);

  tbody.innerHTML = page.map((r, i) => {
    const rank = start + i + 1;
    const rc = rank <= 3 ? `rank-${rank}` : '';
    return `<tr>
      <td class="${rc}">${rank}</td>
      <td>${(r.name||'').split(', ').reverse().join(' ')}</td>
      <td>${r.division||''}</td>
      <td>${r.gender||''}</td>
      <td>${r.age_group||''}</td>
      <td>${r.nationality||''}</td>
      <td class="time">${minsToTime(r.total_time)}</td>
      <td class="time">${minsToTime(r.skiErg)}</td>
      <td class="time">${minsToTime(r.sledPush)}</td>
      <td class="time">${minsToTime(r.sledPull)}</td>
      <td class="time">${minsToTime(r.burpee)}</td>
      <td class="time">${minsToTime(r.row)}</td>
      <td class="time">${minsToTime(r.farmersCarry)}</td>
      <td class="time">${minsToTime(r.lunges)}</td>
      <td class="time">${minsToTime(r.wallBalls)}</td>
      <td class="time">${minsToTime(r.run_time)}</td>
      <td class="time">${minsToTime(r.work_time)}</td>
    </tr>`;
  }).join('');

  const tp = Math.ceil(filteredResults.length / PAGE_SIZE) || 1;
  document.getElementById('results-pagination').innerHTML = `
    <button onclick="resultsPage=0;renderResultsTable()" ${resultsPage===0?'disabled':''}>&laquo;</button>
    <button onclick="resultsPage--;renderResultsTable()" ${resultsPage===0?'disabled':''}>&lsaquo;</button>
    <span>Pag ${resultsPage+1}/${tp} (${filteredResults.length.toLocaleString()} ris.)</span>
    <button onclick="resultsPage++;renderResultsTable()" ${resultsPage>=tp-1?'disabled':''}>&rsaquo;</button>
    <button onclick="resultsPage=${tp-1};renderResultsTable()" ${resultsPage>=tp-1?'disabled':''}>&raquo;</button>
  `;
}

async function loadContentRace(key) {
  if (raceCache[key]) return raceCache[key];
  const resp = await fetch(`data/races/${key}.json`);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const data = await resp.json();
  raceCache[key] = data;
  return data;
}

async function generateContent() {
  const key = document.getElementById('content-event-select').value;
  if (!key) return;
  const area = document.getElementById('content-area');
  area.innerHTML = '<div class="loading-msg">Caricamento...</div>';

  try {
    const results = await loadContentRace(key);
    contentRaceData = results;
    contentEventKey = key;

    // Update division/gender dropdowns
    const divSel = document.getElementById('content-division');
    const genSel = document.getElementById('content-gender');
    const divs = [...new Set(results.map(r => r.division).filter(Boolean))].sort();
    const gens = [...new Set(results.map(r => r.gender).filter(Boolean))].sort();
    divSel.innerHTML = '<option value="">Tutte</option>' + divs.map(d => `<option value="${d}">${d}</option>`).join('');
    genSel.innerHTML = '<option value="">Tutti</option>' + gens.map(g => `<option value="${g}">${g}</option>`).join('');

    if (contentType === 'top10') generateTop10(key, results);
    else if (contentType === 'report') generateReport(key, results);
  } catch (err) {
    area.innerHTML = `<div class="loading-msg">Errore: ${err.message}</div>`;
  }
}

function getFilteredContent(results) {
  const div = document.getElementById('content-division')?.value || '';
  const gen = document.getElementById('content-gender')?.value || '';
  let filtered = results;
  if (div) filtered = filtered.filter(r => r.division === div);
  if (gen) filtered = filtered.filter(r => r.gender === gen);
  return filtered.filter(r => r.total_time).sort((a, b) => a.total_time - b.total_time);
}

function formatName(name) {
  if (!name) return '???';
  return name.split(', ').reverse().join(' ');
}

function generateTop10(key, results) {
  const event = DATA.events.find(e => e.key === key);
  const filtered = getFilteredContent(results);
  const top = filtered.slice(0, 10);
  const div = document.getElementById('content-division')?.value || '';
  const gen = document.getElementById('content-gender')?.value || '';

  const title = `TOP 10 — ${event.location.toUpperCase()} ${event.year}`;
  const subtitle = [div, gen].filter(Boolean).join(' | ') || 'Open';

  let text = `${title}\n${subtitle}\n${'─'.repeat(40)}\n\n`;
  top.forEach((r, i) => {
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i+1}.`;
    const flag = r.nationality ? ` (${r.nationality})` : '';
    text += `${medal} ${formatName(r.name)}${flag}\n`;
    text += `   Tempo: ${minsToTime(r.total_time)}\n`;

    // Find best and worst split
    const splits = [
      { name: 'SkiErg', val: r.skiErg },
      { name: 'Sled Push', val: r.sledPush },
      { name: 'Sled Pull', val: r.sledPull },
      { name: 'Burpee BJ', val: r.burpee },
      { name: 'Row', val: r.row },
      { name: 'Farmers', val: r.farmersCarry },
      { name: 'Lunges', val: r.lunges },
      { name: 'Wall Balls', val: r.wallBalls },
    ].filter(s => s.val);

    if (splits.length) {
      const best = splits.reduce((a, b) => a.val < b.val ? a : b);
      text += `   Best split: ${best.name} ${minsToTime(best.val)}\n`;
    }
    text += '\n';
  });

  text += `\n${filtered.length.toLocaleString()} partecipanti totali`;

  const area = document.getElementById('content-area');
  area.innerHTML = `<div class="content-output"><button class="btn-copy" onclick="copyContent()">Copia</button>${escHtml(text)}</div>` + renderGraphicControls('top10');
  // store data for graphic generation
  window._igData = { type: 'top10', key, event, filtered, top, div, gen, subtitle };
}

function generateReport(key, results) {
  const event = DATA.events.find(e => e.key === key);
  const filtered = getFilteredContent(results);
  if (!filtered.length) {
    document.getElementById('content-area').innerHTML = '<div class="loading-msg">Nessun risultato con i filtri selezionati</div>';
    return;
  }

  const n = filtered.length;
  const times = filtered.map(r => r.total_time);
  const avg = times.reduce((a, b) => a + b, 0) / n;
  const median = times[Math.floor(n / 2)];
  const p10 = n >= 10 ? times[Math.floor(n * 0.1)] : null;
  const p90 = n >= 10 ? times[Math.floor(n * 0.9)] : null;

  // Average splits
  const splitNames = ['skiErg','sledPush','sledPull','burpee','row','farmersCarry','lunges','wallBalls'];
  const splitLabels = { skiErg:'SkiErg', sledPush:'Sled Push', sledPull:'Sled Pull', burpee:'Burpee BJ', row:'Row', farmersCarry:'Farmers Carry', lunges:'Lunges', wallBalls:'Wall Balls' };
  const avgSplits = splitNames.map(s => {
    const vals = filtered.map(r => r[s]).filter(v => v && !isNaN(v));
    return { name: splitLabels[s], avg: vals.length ? vals.reduce((a,b) => a+b,0) / vals.length : null };
  }).filter(s => s.avg);

  const slowest = avgSplits.length ? avgSplits.reduce((a, b) => a.avg > b.avg ? a : b) : null;
  const fastest = avgSplits.length ? avgSplits.reduce((a, b) => a.avg < b.avg ? a : b) : null;

  // Nationality breakdown
  const natCounts = {};
  filtered.forEach(r => { if (r.nationality) natCounts[r.nationality] = (natCounts[r.nationality]||0) + 1; });
  const topNats = Object.entries(natCounts).sort((a,b) => b[1]-a[1]).slice(0, 5);

  const div = document.getElementById('content-division')?.value || '';
  const gen = document.getElementById('content-gender')?.value || '';
  const title = `REPORT — ${event.location.toUpperCase()} ${event.year}`;
  const subtitle = [div, gen].filter(Boolean).join(' | ') || 'Tutte le divisioni';

  let text = `${title}\n${subtitle}\n${'─'.repeat(40)}\n\n`;
  text += `Partecipanti: ${n.toLocaleString()}\n\n`;
  text += `Miglior tempo:  ${minsToTime(times[0])} (${formatName(filtered[0].name)})\n`;
  text += `Tempo medio:    ${minsToTime(avg)}\n`;
  text += `Mediana:        ${minsToTime(median)}\n`;
  text += `Peggior tempo:  ${minsToTime(times[n-1])}\n`;
  if (p10) text += `Top 10%:        sotto ${minsToTime(p10)}\n`;
  if (p90) text += `Top 90%:        sotto ${minsToTime(p90)}\n`;

  if (avgSplits.length) {
    text += `\nTEMPI MEDI PER STAZIONE\n${'─'.repeat(30)}\n`;
    avgSplits.sort((a,b) => b.avg - a.avg).forEach(s => {
      const marker = s === slowest ? ' ← PIU LENTA' : s === fastest ? ' ← PIU VELOCE' : '';
      text += `${s.name.padEnd(14)} ${minsToTime(s.avg)}${marker}\n`;
    });
  }

  if (topNats.length) {
    text += `\nNAZIONALITA TOP 5\n${'─'.repeat(30)}\n`;
    topNats.forEach(([nat, cnt]) => {
      text += `${nat.padEnd(6)} ${cnt} atleti (${Math.round(cnt/n*100)}%)\n`;
    });
  }

  const area = document.getElementById('content-area');
  area.innerHTML = `<div class="content-output"><button class="btn-copy" onclick="copyContent()">Copia</button>${escHtml(text)}</div>` + renderGraphicControls('report');
  window._igData = { type: 'report', key, event, filtered, n, times, avg, median, p10, p90, avgSplits, slowest, fastest, topNats, div, gen, subtitle };
}

async function searchAthlete() {
  const search = (document.getElementById('content-athlete-search')?.value || '').toLowerCase().trim();
  if (search.length < 3) {
    document.getElementById('content-area').innerHTML = '<div class="loading-msg">Inserisci almeno 3 caratteri</div>';
    return;
  }

  const area = document.getElementById('content-area');
  const total = DATA.events.length;
  let done = 0;
  area.innerHTML = `<div class="loading-msg" id="search-progress">Cerco in tutte le gare... 0/${total}</div>`;

  const found = [];
  // Parallel fetch in batches of 10
  const BATCH = 10;
  for (let i = 0; i < total; i += BATCH) {
    const batch = DATA.events.slice(i, i + BATCH);
    const promises = batch.map(async event => {
      try {
        const results = await loadContentRace(event.key);
        const words = search.split(/\s+/);
        const matches = results.filter(r => {
          const name = (r.name || '').toLowerCase();
          return words.every(w => name.includes(w));
        });
        if (matches.length) {
          matches.forEach(m => found.push({ ...m, event }));
        }
      } catch (err) {
        console.error(`Errore caricamento ${event.key}:`, err);
      }
      done++;
    });
    await Promise.all(promises);
    const prog = document.getElementById('search-progress');
    if (prog) prog.textContent = `Cerco in tutte le gare... ${done}/${total} (${found.length} trovati)`;
  }

  if (!found.length) {
    area.innerHTML = '<div class="loading-msg">Atleta non trovato in nessuna gara</div>';
    return;
  }

  // Group by athlete name (exact match)
  const byName = {};
  found.forEach(r => {
    const key = r.name || '???';
    if (!byName[key]) byName[key] = [];
    byName[key].push(r);
  });

  // Pick the athlete with most results (most relevant match)
  const entries = Object.entries(byName).sort((a, b) => b[1].length - a[1].length);

  let html = '';
  let raceIdx = 0;
  if (!window._athleteData) window._athleteData = {};
  window._radarQueue = [];

  for (const [name, races] of entries) {
    const sorted = races.sort((a, b) => (a.total_time || 9999) - (b.total_time || 9999));
    const bestResult = sorted.find(r => r.total_time);
    const displayName = formatName(name);

    html += `<div style="margin-bottom:1.5rem">`;
    html += `<h3 style="color:var(--accent);margin-bottom:0.3rem">${displayName}</h3>`;
    html += `<div style="color:var(--text2);font-size:0.85rem;margin-bottom:0.8rem">${races.length} gara/e${bestResult ? ` — Miglior tempo: ${minsToTime(bestResult.total_time)}` : ''}</div>`;

    races.forEach(r => {
      const ev = r.event;
      const rid = `race-${raceIdx++}`;

      // --- Compute rankings & averages from cached race data ---
      const allResults = raceCache[ev.key] || [];
      const peers = allResults.filter(p => p.division === r.division && p.gender === r.gender && p.total_time);
      const sortedPeers = [...peers].sort((a, b) => a.total_time - b.total_time);
      const totalPeers = sortedPeers.length;
      const rank = sortedPeers.findIndex(p => p.name === r.name && Math.abs((p.total_time||0) - (r.total_time||0)) < 0.01) + 1;
      const pctile = totalPeers > 0 && rank > 0 ? ((rank / totalPeers) * 100) : 0;
      const pctileClass = pctile <= 25 ? 'top25' : pctile <= 50 ? 'top50' : pctile <= 75 ? 'top75' : 'bottom25';

      const splitKeys = [
        { key: 'skiErg', name: 'SkiErg' },
        { key: 'sledPush', name: 'Sled Push' },
        { key: 'sledPull', name: 'Sled Pull' },
        { key: 'burpee', name: 'Burpee BJ' },
        { key: 'row', name: 'Row' },
        { key: 'farmersCarry', name: 'Farmers' },
        { key: 'lunges', name: 'Lunges' },
        { key: 'wallBalls', name: 'Wall Balls' },
        { key: 'run_time', name: 'Run' },
      ];

      // Compute averages, best times, and per-split ranks
      const splitData = splitKeys.map(sk => {
        const val = r[sk.key];
        if (!val || isNaN(val)) return null;
        const peerVals = sortedPeers.map(p => p[sk.key]).filter(v => v && !isNaN(v));
        const avg = peerVals.length ? peerVals.reduce((a,b) => a+b, 0) / peerVals.length : null;
        const best = peerVals.length ? Math.min(...peerVals) : null;
        const peerSorted = [...peerVals].sort((a,b) => a - b);
        const splitRank = peerSorted.filter(v => v < val).length + 1;
        return { name: sk.name, key: sk.key, val, avg, best, splitRank, totalWithSplit: peerVals.length };
      }).filter(Boolean);

      const maxSplitVal = splitData.length ? Math.max(...splitData.map(s => s.val), ...splitData.map(s => s.avg || 0)) : 1;

      // --- Build HTML ---
      html += `<div class="athlete-race-card">`;

      // 1. Header
      html += `<div class="arc-header">`;
      html += `<div class="arc-event-line">${ev.location.toUpperCase()} ${ev.year} — Season ${ev.season}</div>`;
      html += `<div class="arc-meta-line">`;
      if (r.division) html += `<span>${r.division}</span>`;
      if (r.gender) html += `<span>${r.gender}</span>`;
      if (r.age_group) html += `<span>${r.age_group}</span>`;
      if (r.nationality) html += `<span>${r.nationality}</span>`;
      html += `</div>`;
      html += `<div class="arc-total-time">${minsToTime(r.total_time)}</div>`;
      html += `</div>`;

      // 2. Ranking badge
      if (rank > 0 && totalPeers > 0) {
        html += `<div class="arc-ranking-badge ${pctileClass}">`;
        html += `#${rank} su ${totalPeers} — top ${pctile.toFixed(1)}%`;
        html += `</div>`;
      }

      // 3. Split bars with comparison
      if (splitData.length) {
        html += `<div class="arc-body">`;
        html += `<div class="arc-section-title">Split times vs media evento</div>`;

        splitData.forEach(s => {
          const barPct = (s.val / maxSplitVal) * 100;
          const avgPct = s.avg ? (s.avg / maxSplitVal) * 100 : 0;
          const isFaster = s.avg && s.val < s.avg;
          const barColor = s.avg ? (isFaster ? 'rgba(0,214,143,0.7)' : 'rgba(255,107,107,0.7)') : 'rgba(139,143,163,0.5)';
          const delta = s.avg ? s.val - s.avg : 0;
          const deltaSign = delta < 0 ? '' : '+';
          const deltaClass = delta < 0 ? 'faster' : 'slower';

          html += `<div class="arc-split-row">`;
          html += `<div class="arc-split-name">${s.name}</div>`;
          html += `<div class="arc-split-bars">`;
          html += `<div class="arc-split-bar-athlete" style="width:${barPct.toFixed(1)}%;background:${barColor}"></div>`;
          if (s.avg) html += `<div class="arc-split-bar-avg" style="left:${avgPct.toFixed(1)}%" title="Media: ${minsToTime(s.avg)}"></div>`;
          html += `</div>`;
          html += `<div class="arc-split-time">${minsToTime(s.val)}</div>`;
          if (s.avg) html += `<div class="arc-split-delta ${deltaClass}">${deltaSign}${minsToTime(Math.abs(delta))}</div>`;
          else html += `<div class="arc-split-delta"></div>`;
          html += `<div class="arc-split-rank">#${s.splitRank}</div>`;
          html += `</div>`;
        });

        // Legend
        html += `<div class="arc-legend">`;
        html += `<span><span class="arc-legend-dot" style="background:rgba(0,214,143,0.7)"></span>Piu veloce della media</span>`;
        html += `<span><span class="arc-legend-dot" style="background:rgba(255,107,107,0.7)"></span>Piu lento della media</span>`;
        html += `<span><span class="arc-legend-dot" style="background:rgba(255,255,255,0.5);width:2px;height:10px;border-radius:0"></span>Media evento</span>`;
        html += `</div>`;

        html += `</div>`; // arc-body
      }

      // 3b. Station distribution histograms
      const histoStations = splitData.filter(s => s.name !== 'Run');
      if (histoStations.length) {
        if (!window._histoQueue) window._histoQueue = [];

        html += `<div class="arc-stations-grid">`;
        histoStations.forEach(s => {
          const hid = `histo-${rid}-${s.key}`;
          const peerVals = sortedPeers.map(p => p[s.key]).filter(v => v && !isNaN(v));
          const splitPctile = s.totalWithSplit > 0 ? ((s.splitRank / s.totalWithSplit) * 100) : 0;
          const badgeClass = splitPctile <= 25 ? 'top25' : splitPctile <= 50 ? 'top50' : splitPctile <= 75 ? 'top75' : 'bottom25';

          html += `<div class="arc-station-card">`;
          html += `<div class="arc-station-header">`;
          html += `<div class="arc-station-name">${s.name}</div>`;
          html += `<div class="arc-station-time">${minsToTime(s.val)}</div>`;
          html += `</div>`;
          html += `<div class="arc-station-badges">`;
          html += `<span class="arc-station-badge arc-ranking-badge ${badgeClass}" style="margin:0;padding:0.1rem 0.4rem">#${s.splitRank} su ${s.totalWithSplit}</span>`;
          html += `<span class="arc-station-badge arc-ranking-badge ${badgeClass}" style="margin:0;padding:0.1rem 0.4rem">top ${splitPctile.toFixed(1)}%</span>`;
          html += `</div>`;
          html += `<div class="arc-histo-wrap"><canvas id="${hid}" class="arc-histo-canvas"></canvas></div>`;
          html += `<div class="arc-histo-axis" id="${hid}-axis"></div>`;
          html += `</div>`;

          window._histoQueue.push({ id: hid, vals: peerVals, athleteVal: s.val });
        });
        html += `</div>`;
      }

      // 4. Individual Run Laps
      const runLapKeys = ['run1','run2','run3','run4','run5','run6','run7','run8'];
      const runLaps = runLapKeys.map((k, i) => {
        const val = r[k];
        if (!val || isNaN(val)) return null;
        const peerVals = sortedPeers.map(p => p[k]).filter(v => v && !isNaN(v));
        const avg = peerVals.length ? peerVals.reduce((a,b) => a+b, 0) / peerVals.length : null;
        const peerSorted = [...peerVals].sort((a,b) => a - b);
        const lapRank = peerSorted.filter(v => v < val).length + 1;
        return { name: `Run ${i+1}`, key: k, val, avg, lapRank, total: peerVals.length };
      }).filter(Boolean);

      if (runLaps.length > 0) {
        const maxRunVal = Math.max(...runLaps.map(l => l.val), ...runLaps.map(l => l.avg || 0));
        const minRunVal = Math.min(...runLaps.map(l => l.val));
        const avgRunVal = runLaps.reduce((s, l) => s + l.val, 0) / runLaps.length;

        // Stations interleaved between runs
        const stationOrder = ['skiErg','sledPush','sledPull','burpee','row','farmersCarry','lunges','wallBalls'];
        const stationNames = { skiErg:'SkiErg', sledPush:'Sled Push', sledPull:'Sled Pull', burpee:'Burpee BJ', row:'Row', farmersCarry:'Farmers', lunges:'Lunges', wallBalls:'Wall Balls' };

        html += `<div class="arc-body" style="border-top:1px solid var(--border)">`;
        html += `<div class="arc-section-title">Run Laps</div>`;
        html += `<div style="display:flex;gap:1rem;margin-bottom:0.8rem;font-size:0.78rem;color:var(--text2)">`;
        html += `<span>Avg: <strong style="color:var(--text)">${minsToTime(avgRunVal)}</strong></span>`;
        html += `<span>Best: <strong style="color:var(--green)">${minsToTime(minRunVal)}</strong></span>`;
        const maxLap = runLaps.reduce((a,b) => a.val > b.val ? a : b);
        const minLap = runLaps.reduce((a,b) => a.val < b.val ? a : b);
        html += `</div>`;

        runLaps.forEach((lap, i) => {
          const barPct = (lap.val / maxRunVal) * 100;
          const avgPct = lap.avg ? (lap.avg / maxRunVal) * 100 : 0;
          const isFaster = lap.avg && lap.val < lap.avg;
          const isBest = lap === minLap;
          const isWorst = lap === maxLap;
          const barColor = isBest ? 'rgba(0,214,143,0.8)' : isWorst ? 'rgba(255,107,107,0.8)' : isFaster ? 'rgba(0,214,143,0.5)' : 'rgba(255,107,107,0.5)';
          const delta = lap.avg ? lap.val - lap.avg : 0;
          const deltaSign = delta < 0 ? '' : '+';
          const deltaClass = delta < 0 ? 'faster' : 'slower';
          const lapPctile = lap.total > 0 ? ((lap.lapRank / lap.total) * 100).toFixed(1) : '—';

          html += `<div class="arc-split-row">`;
          html += `<div class="arc-split-name" style="font-weight:${isBest||isWorst?'700':'400'};color:${isBest?'var(--green)':isWorst?'#ff6b6b':'var(--text2)'}">${lap.name}</div>`;
          html += `<div class="arc-split-bars">`;
          html += `<div class="arc-split-bar-athlete" style="width:${barPct.toFixed(1)}%;background:${barColor}"></div>`;
          if (lap.avg) html += `<div class="arc-split-bar-avg" style="left:${avgPct.toFixed(1)}%" title="Media: ${minsToTime(lap.avg)}"></div>`;
          html += `</div>`;
          html += `<div class="arc-split-time">${minsToTime(lap.val)}</div>`;
          if (lap.avg) html += `<div class="arc-split-delta ${deltaClass}">${deltaSign}${minsToTime(Math.abs(delta))}</div>`;
          else html += `<div class="arc-split-delta"></div>`;
          html += `<div class="arc-split-rank">#${lap.lapRank}</div>`;
          html += `</div>`;

          // Show station between runs (smaller, dimmed)
          if (i < stationOrder.length && i < runLaps.length - 1) {
            const sk = stationOrder[i];
            const sVal = r[sk];
            if (sVal) {
              html += `<div style="display:flex;align-items:center;gap:0.6rem;margin:0.1rem 0 0.1rem 0;font-size:0.7rem;color:var(--text2);opacity:0.6">`;
              html += `<div style="width:85px;text-align:right;flex-shrink:0">${stationNames[sk]}</div>`;
              html += `<div style="flex:1;height:1px;background:var(--border)"></div>`;
              html += `<div style="width:60px;text-align:right;font-family:monospace">${minsToTime(sVal)}</div>`;
              html += `<div style="width:56px"></div><div style="width:44px"></div>`;
              html += `</div>`;
            }
          }
        });

        // Roxzone
        if (r.roxzone) {
          html += `<div style="margin-top:0.5rem;font-size:0.8rem;color:var(--text2)">Roxzone: <span style="color:var(--text);font-family:monospace">${minsToTime(r.roxzone)}</span></div>`;
        }

        html += `</div>`;
      }

      // 5. Radar chart
      const workSplits = splitData.filter(s => s.name !== 'Run');
      if (workSplits.length >= 3) {
        const radarId = `radar-${rid}`;
        html += `<div class="arc-radar-section">`;
        html += `<canvas id="${radarId}" class="arc-radar-canvas" width="320" height="320"></canvas>`;
        html += `</div>`;
        // Queue radar drawing after DOM insertion
        if (!window._radarQueue) window._radarQueue = [];
        window._radarQueue.push({ id: radarId, splits: workSplits });
      }

      // 5. Genera Grafica buttons (preserved)
      html += `<div class="arc-footer">
        <select id="ig-format-${rid}" style="background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:0.3rem 0.6rem;color:var(--text);font-size:0.8rem">
          <option value="post">Post 1080x1080</option>
          <option value="story">Story 1080x1920</option>
        </select>
        <button class="btn-generate" style="padding:0.3rem 0.8rem;font-size:0.8rem" onclick="generateAthleteGraphic('${rid}')">Genera Grafica</button>
        <button class="btn-generate" id="btn-download-${rid}" style="display:none;background:var(--green);padding:0.3rem 0.8rem;font-size:0.8rem" onclick="downloadAthlPNG('${rid}')">Scarica PNG</button>
      </div>
      <div style="padding:0 1.5rem 1rem;text-align:center">
        <canvas id="canvas-${rid}" style="display:none;max-width:100%;border:1px solid var(--border);border-radius:8px"></canvas>
      </div>`;

      // Store data for this specific race (preserved for graphic generation)
      const splits = splitKeys.map(sk => ({ name: sk.name, val: r[sk.key] })).filter(s => s.val);
      window._athleteData[rid] = {
        name: displayName,
        eventLocation: ev.location,
        eventYear: ev.year,
        eventSeason: ev.season,
        division: r.division,
        gender: r.gender,
        total_time: r.total_time,
        splits: splits,
        nationality: r.nationality,
        age_group: r.age_group,
      };

      html += '</div>';
    });

    html += '</div>';
  }

  area.innerHTML = html;

  // Draw queued radar charts
  if (window._radarQueue && window._radarQueue.length) {
    window._radarQueue.forEach(({ id, splits }) => drawRadarChart(id, splits));
    window._radarQueue = [];
  }
  // Draw queued histograms
  if (window._histoQueue && window._histoQueue.length) {
    window._histoQueue.forEach(h => drawHistogram(h.id, h.vals, h.athleteVal));
    window._histoQueue = [];
  }
}

function drawRadarChart(canvasId, splits) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2;
  const R = Math.min(cx, cy) - 40;
  const n = splits.length;

  ctx.clearRect(0, 0, W, H);

  // Background rings
  for (let ring = 1; ring <= 5; ring++) {
    const rr = (ring / 5) * R;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
      const x = cx + rr * Math.cos(angle);
      const y = cy + rr * Math.sin(angle);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = 'rgba(46,51,71,0.8)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Axis lines + labels
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
    const x = cx + R * Math.cos(angle);
    const y = cy + R * Math.sin(angle);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(x, y);
    ctx.strokeStyle = 'rgba(46,51,71,0.5)';
    ctx.stroke();

    // Label
    const lx = cx + (R + 22) * Math.cos(angle);
    const ly = cy + (R + 22) * Math.sin(angle);
    ctx.fillStyle = '#8b8fa3';
    ctx.font = '11px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(splits[i].name, lx, ly);
  }

  // For radar: invert scale so faster = bigger
  // Use the worst time in the field as baseline (0%), best time = 100%
  function normalizeInverted(s) {
    if (!s.best || !s.avg) return 0.5;
    // worst = avg * 1.5 as a reasonable upper bound (or use actual max)
    const worst = Math.max(s.val, s.avg) * 1.4;
    const best = s.best;
    if (worst === best) return 1;
    const pct = 1 - ((s.val - best) / (worst - best));
    return Math.max(0.08, Math.min(1, pct));
  }

  // Draw average polygon
  const avgNorms = splits.map(s => {
    if (!s.best || !s.avg) return 0.5;
    const worst = Math.max(s.val, s.avg) * 1.4;
    const best = s.best;
    if (worst === best) return 1;
    return Math.max(0.08, Math.min(1, 1 - ((s.avg - best) / (worst - best))));
  });

  ctx.beginPath();
  avgNorms.forEach((norm, i) => {
    const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
    const x = cx + R * norm * Math.cos(angle);
    const y = cy + R * norm * Math.sin(angle);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.closePath();
  ctx.fillStyle = 'rgba(139,143,163,0.12)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(139,143,163,0.4)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([4, 4]);
  ctx.stroke();
  ctx.setLineDash([]);

  // Draw athlete polygon
  const athleteNorms = splits.map(normalizeInverted);

  ctx.beginPath();
  athleteNorms.forEach((norm, i) => {
    const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
    const x = cx + R * norm * Math.cos(angle);
    const y = cy + R * norm * Math.sin(angle);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.closePath();
  ctx.fillStyle = 'rgba(200,255,0,0.15)';
  ctx.fill();
  ctx.strokeStyle = '#c8ff00';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Draw dots on athlete polygon
  athleteNorms.forEach((norm, i) => {
    const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
    const x = cx + R * norm * Math.cos(angle);
    const y = cy + R * norm * Math.sin(angle);
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#c8ff00';
    ctx.fill();
  });

  // Legend at bottom
  ctx.fillStyle = '#c8ff00';
  ctx.fillRect(W / 2 - 80, H - 18, 10, 10);
  ctx.fillStyle = '#8b8fa3';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('Atleta', W / 2 - 66, H - 9);

  ctx.strokeStyle = 'rgba(139,143,163,0.5)';
  ctx.setLineDash([3, 3]);
  ctx.beginPath();
  ctx.moveTo(W / 2 + 10, H - 13);
  ctx.lineTo(W / 2 + 22, H - 13);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillText('Media', W / 2 + 26, H - 9);
}

function copyContent() {
  const output = document.querySelector('.content-output');
  if (!output) return;
  const text = output.textContent.replace('Copia', '').trim();
  navigator.clipboard.writeText(text).then(() => {
    const btn = output.querySelector('.btn-copy');
    if (btn) { btn.textContent = 'Copiato!'; setTimeout(() => btn.textContent = 'Copia', 1500); }
  });
}

function drawHistogram(canvasId, vals, athleteVal) {
  const canvas = document.getElementById(canvasId);
  if (!canvas || !vals.length) return;

  // Set canvas size to container
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const W = rect.width;
  const H = rect.height;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const sorted = [...vals].sort((a, b) => a - b);
  const minV = sorted[0];
  const maxV = sorted[sorted.length - 1];
  const range = maxV - minV || 1;

  // Create bins
  const numBins = Math.min(40, Math.max(15, Math.floor(vals.length / 10)));
  const binWidth = range / numBins;
  const bins = new Array(numBins).fill(0);
  vals.forEach(v => {
    let idx = Math.floor((v - minV) / binWidth);
    if (idx >= numBins) idx = numBins - 1;
    bins[idx]++;
  });
  const maxBin = Math.max(...bins);

  const padL = 0, padR = 0, padT = 4, padB = 4;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  const barW = chartW / numBins;

  // Draw bars
  bins.forEach((count, i) => {
    const barH = maxBin > 0 ? (count / maxBin) * chartH : 0;
    const x = padL + i * barW;
    const y = padT + chartH - barH;

    // Color based on position relative to athlete
    const binCenter = minV + (i + 0.5) * binWidth;
    if (binCenter <= athleteVal) {
      ctx.fillStyle = 'rgba(0,214,143,0.4)';  // faster = green
    } else {
      ctx.fillStyle = 'rgba(139,143,163,0.25)';  // slower = gray
    }
    ctx.fillRect(x + 0.5, y, barW - 1, barH);
  });

  // Athlete line
  const athleteX = padL + ((athleteVal - minV) / range) * chartW;
  ctx.strokeStyle = '#c8ff00';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(athleteX, padT);
  ctx.lineTo(athleteX, padT + chartH);
  ctx.stroke();

  // Athlete dot
  ctx.fillStyle = '#c8ff00';
  ctx.beginPath();
  ctx.arc(athleteX, padT + 6, 4, 0, Math.PI * 2);
  ctx.fill();

  // Axis labels
  const axisDiv = document.getElementById(canvasId + '-axis');
  if (axisDiv) {
    const nLabels = 5;
    let labels = '';
    for (let i = 0; i <= nLabels; i++) {
      const v = minV + (range * i / nLabels);
      labels += `<span>${minsToTime(v)}</span>`;
    }
    axisDiv.innerHTML = labels;
  }
}

function generateGraphic() {
  const format = document.getElementById('ig-format').value;
  const W = 1080;
  const H = format === 'story' ? 1920 : 1080;
  const canvas = document.getElementById('ig-canvas');
  canvas.width = W;
  canvas.height = H;
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');

  const BG = '#0f1117', SURFACE = '#1a1d27', ACCENT = '#c8ff00', TEXT = '#e4e6ed', TEXT2 = '#8b8fa3';
  const GOLD = '#ffd700', SILVER = '#c0c0c0', BRONZE = '#cd7f32', GREEN = '#00d68f', RED = '#ff6b6b';

  // Background
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);

  // Helper: draw rounded rect
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  // Header
  function drawHeader(title) {
    // Top bar
    ctx.fillStyle = SURFACE;
    ctx.fillRect(0, 0, W, 100);
    ctx.fillStyle = ACCENT;
    ctx.font = 'bold 40px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('HY', 50, 65);
    const hyW = ctx.measureText('HY').width;
    ctx.fillStyle = TEXT;
    ctx.fillText('ANALIZE', 50 + hyW, 65);
    // Title
    ctx.fillStyle = ACCENT;
    ctx.font = 'bold 32px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(title, W / 2, 160);
  }

  // Footer
  function drawFooter(extra) {
    const fy = H - 60;
    ctx.fillStyle = SURFACE;
    ctx.fillRect(0, fy, W, 60);
    ctx.fillStyle = TEXT2;
    ctx.font = '22px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('@hyroxitaliacommunity' + (extra ? '  |  ' + extra : ''), W / 2, fy + 38);
  }

  const data = window._igData;
  const athleteData = window._igAthleteData;

  if (data && data.type === 'top10') {
    drawTop10Graphic(ctx, W, H, data, drawHeader, drawFooter, roundRect, { BG, SURFACE, ACCENT, TEXT, TEXT2, GOLD, SILVER, BRONZE });
  } else if (data && data.type === 'report') {
    drawReportGraphic(ctx, W, H, data, drawHeader, drawFooter, roundRect, { BG, SURFACE, ACCENT, TEXT, TEXT2, GREEN, RED });
  } else if (athleteData) {
    drawAthleteGraphic(ctx, W, H, athleteData, drawHeader, drawFooter, roundRect, { BG, SURFACE, ACCENT, TEXT, TEXT2, GREEN, RED });
  }

  document.getElementById('btn-download-png').style.display = '';
}

function drawTop10Graphic(ctx, W, H, data, drawHeader, drawFooter, roundRect, C) {

function drawReportGraphic(ctx, W, H, data, drawHeader, drawFooter, roundRect, C) {
  const { event, n, times, avg, median, p10, p90, avgSplits, slowest, fastest, subtitle } = data;
  const title = `REPORT - ${event.location.toUpperCase()} ${event.year}`;
  drawHeader(title);

  ctx.fillStyle = C.TEXT2;
  ctx.font = '24px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(subtitle || 'Tutte le divisioni', W / 2, 200);

  const padX = 60;
  let y = 240;

  // Stats blocks
  const stats = [
    { label: 'PARTECIPANTI', value: n.toLocaleString() },
    { label: 'MIGLIOR TEMPO', value: minsToTime(times[0]) },
    { label: 'TEMPO MEDIO', value: minsToTime(avg) },
    { label: 'MEDIANA', value: minsToTime(median) },
  ];
  if (p10) stats.push({ label: 'TOP 10%', value: minsToTime(p10) });
  if (p90) stats.push({ label: 'TOP 90%', value: minsToTime(p90) });

  const cols = Math.min(stats.length, 3);
  const boxW = (W - 2 * padX - (cols - 1) * 15) / cols;
  const boxH = 90;

  stats.forEach((s, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const bx = padX + col * (boxW + 15);
    const by = y + row * (boxH + 15);

    ctx.fillStyle = C.SURFACE;
    roundRect(bx, by, boxW, boxH, 10);
    ctx.fill();

    ctx.fillStyle = C.TEXT2;
    ctx.font = '16px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(s.label, bx + boxW / 2, by + 30);

    ctx.fillStyle = C.ACCENT;
    ctx.font = 'bold 30px SF Mono, Cascadia Code, monospace';
    ctx.fillText(s.value, bx + boxW / 2, by + 68);
  });

  const statRows = Math.ceil(stats.length / cols);
  y += statRows * (boxH + 15) + 30;

  // Bar chart - average split times
  if (avgSplits.length) {
    ctx.fillStyle = C.TEXT;
    ctx.font = 'bold 22px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('TEMPI MEDI PER STAZIONE', padX, y);
    y += 30;

    const sorted = [...avgSplits].sort((a, b) => b.avg - a.avg);
    const maxVal = sorted[0].avg;
    const barMaxW = W - 2 * padX - 180;
    const barH = H === 1920 ? 55 : 40;
    const barGap = H === 1920 ? 12 : 8;

    sorted.forEach(s => {
      const barW = (s.avg / maxVal) * barMaxW;
      let barColor = C.TEXT2;
      if (s === slowest) barColor = '#ff6b6b';
      else if (s === fastest) barColor = C.GREEN;

      // Label
      ctx.fillStyle = C.TEXT;
      ctx.font = '18px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(s.name, padX, y + barH / 2 + 6);

      // Bar
      ctx.fillStyle = barColor;
      roundRect(padX + 150, y, barW, barH, 6);
      ctx.fill();

      // Time label on bar
      ctx.fillStyle = C.BG;
      ctx.font = 'bold 16px SF Mono, Cascadia Code, monospace';
      ctx.textAlign = 'left';
      ctx.fillText(minsToTime(s.avg), padX + 158, y + barH / 2 + 6);

      y += barH + barGap;
    });

    // Legend
    y += 10;
    ctx.font = '16px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ff6b6b';
    ctx.fillRect(padX, y, 14, 14);
    ctx.fillStyle = C.TEXT2;
    ctx.fillText('Piu lenta', padX + 22, y + 12);
    ctx.fillStyle = C.GREEN;
    ctx.fillRect(padX + 140, y, 14, 14);
    ctx.fillStyle = C.TEXT2;
    ctx.fillText('Piu veloce', padX + 162, y + 12);
  }

  drawFooter([data.div, data.gen].filter(Boolean).join(' | '));
}
