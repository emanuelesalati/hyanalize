<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HYANALIZE — Hyrox Dashboard</title>
  <style>
    :root {
      --bg: #0f1117; --surface: #1a1d27; --surface2: #232736; --border: #2e3347;
      --text: #e4e6ed; --text2: #8b8fa3; --accent: #c8ff00; --accent2: #a3cc00;
      --gold: #ffd700; --silver: #c0c0c0; --bronze: #cd7f32; --green: #00d68f;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }

    .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1.2rem 2rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
    .header h1 { font-size: 1.5rem; font-weight: 700; }
    .header h1 span { color: var(--accent); }
    .header .meta { color: var(--text2); font-size: 0.85rem; }

    .container { max-width: 1400px; margin: 0 auto; padding: 1.5rem; }

    .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem; }
    .kpi .label { color: var(--text2); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .kpi .value { font-size: 1.8rem; font-weight: 700; color: var(--accent); margin-top: 0.3rem; }
    .kpi .sub { color: var(--text2); font-size: 0.85rem; margin-top: 0.2rem; }

    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .tab { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.6rem 1.2rem; color: var(--text2); cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
    .tab:hover { border-color: var(--accent); color: var(--text); }
    .tab.active { background: var(--accent); color: var(--bg); font-weight: 600; border-color: var(--accent); }

    .section { display: none; }
    .section.active { display: block; }

    .filters { display: flex; gap: 0.8rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
    .filters select, .filters input { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 0.8rem; color: var(--text); font-size: 0.85rem; min-width: 140px; }
    .filters select:focus, .filters input:focus { outline: none; border-color: var(--accent); }
    .filters label { color: var(--text2); font-size: 0.8rem; }

    .table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); max-height: 70vh; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { background: var(--surface2); color: var(--text2); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px; padding: 0.8rem 0.8rem; text-align: left; position: sticky; top: 0; cursor: pointer; user-select: none; z-index: 1; }
    th:hover { color: var(--accent); }
    th.sorted-asc::after { content: ' ▲'; color: var(--accent); }
    th.sorted-desc::after { content: ' ▼'; color: var(--accent); }
    td { padding: 0.6rem 0.8rem; border-top: 1px solid var(--border); }
    tr:hover td { background: var(--surface2); }
    .rank-1 { color: var(--gold); font-weight: 700; }
    .rank-2 { color: var(--silver); font-weight: 700; }
    .rank-3 { color: var(--bronze); font-weight: 700; }
    .time { font-variant-numeric: tabular-nums; font-family: 'SF Mono', 'Cascadia Code', monospace; }

    .event-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; }
    .event-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem; cursor: pointer; transition: all 0.2s; }
    .event-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .event-card h3 { font-size: 1rem; margin-bottom: 0.2rem; }
    .event-card .city { color: var(--accent); font-size: 0.9rem; }
    .event-card .info { color: var(--text2); font-size: 0.85rem; margin-top: 0.4rem; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem; }
    .stat-card h3 { font-size: 0.95rem; margin-bottom: 0.8rem; color: var(--accent); }
    .stat-row { display: flex; justify-content: space-between; padding: 0.3rem 0; font-size: 0.85rem; }
    .stat-row .sl { color: var(--text2); }

    .pagination { display: flex; gap: 0.5rem; justify-content: center; align-items: center; margin-top: 1rem; color: var(--text2); font-size: 0.85rem; }
    .pagination button { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 0.4rem 0.8rem; color: var(--text); cursor: pointer; }
    .pagination button:hover { border-color: var(--accent); }
    .pagination button:disabled { opacity: 0.3; cursor: default; }

    .loading-msg { text-align: center; padding: 2rem; color: var(--text2); }

    .content-type-btns { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .content-type-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 0.6rem 1.2rem; color: var(--text2); cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
    .content-type-btn:hover { border-color: var(--accent); color: var(--text); }
    .content-type-btn.active { background: var(--accent); color: var(--bg); font-weight: 600; border-color: var(--accent); }

    .content-output { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-top: 1rem; white-space: pre-wrap; font-size: 0.9rem; line-height: 1.7; position: relative; min-height: 80px; }
    .content-output:empty::before { content: 'Seleziona un evento e clicca Genera'; color: var(--text2); }

    .btn-copy { position: absolute; top: 0.8rem; right: 0.8rem; background: var(--accent); color: var(--bg); border: none; border-radius: 6px; padding: 0.4rem 1rem; cursor: pointer; font-weight: 600; font-size: 0.8rem; }
    .btn-copy:hover { background: var(--accent2); }
    .btn-generate { background: var(--accent); color: var(--bg); border: none; border-radius: 8px; padding: 0.6rem 1.5rem; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
    .btn-generate:hover { background: var(--accent2); }

    .athlete-results { margin-top: 1rem; }
    .athlete-race-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem; margin-bottom: 0.8rem; }
    .athlete-race-card h4 { color: var(--accent); margin-bottom: 0.5rem; }
    .athlete-splits { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.3rem; margin-top: 0.5rem; }
    .athlete-split { font-size: 0.8rem; }
    .athlete-split .sl { color: var(--text2); }
    .athlete-split .sv { font-family: 'SF Mono', monospace; }
    .athlete-best { color: var(--green); font-weight: 600; }
    .athlete-worst { color: #ff6b6b; font-weight: 600; }

    @media (max-width: 768px) {
      .header { padding: 1rem; }
      .container { padding: 1rem; }
      .kpi .value { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1><span>HY</span>ANALIZE</h1>
  <div class="meta" id="sync-info">Caricamento...</div>
</div>

<div class="container">
  <div class="kpi-row" id="kpi-row"></div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-section="events">Eventi</div>
    <div class="tab" data-section="results">Classifiche</div>
    <div class="tab" data-section="stats">Statistiche</div>
    <div class="tab" data-section="content">Contenuti IG</div>
  </div>

  <div class="section active" id="sec-events">
    <div class="filters">
      <label>Cerca</label>
      <input type="text" id="filter-event" placeholder="Citta, anno, stagione..." oninput="renderEvents()">
    </div>
    <div class="event-grid" id="event-grid"></div>
  </div>

  <div class="section" id="sec-results">
    <div class="filters" id="results-filters"></div>
    <div id="results-loading" class="loading-msg"></div>
    <div class="table-wrap" id="results-table-wrap" style="display:none">
      <table id="results-table"><thead><tr></tr></thead><tbody></tbody></table>
    </div>
    <div class="pagination" id="results-pagination"></div>
  </div>

  <div class="section" id="sec-stats">
    <div class="filters" id="stats-filters"></div>
    <div class="stats-grid" id="stats-grid"></div>
  </div>

  <div class="section" id="sec-content">
    <div class="content-type-btns" id="content-type-btns">
      <div class="content-type-btn active" data-type="top10">Top 10</div>
      <div class="content-type-btn" data-type="report">Report Evento</div>
      <div class="content-type-btn" data-type="athlete">Profilo Atleta</div>
    </div>

    <div class="filters" id="content-filters"></div>
    <div id="content-area"></div>
  </div>
</div>

<script>
let DATA = null;
let raceCache = {};
let currentRaceResults = [];
let filteredResults = [];
let currentSort = { col: 'total_time', asc: true };
let resultsPage = 0;
const PAGE_SIZE = 50;

function minsToTime(m) {
  if (!m || isNaN(m)) return '—';
  const t = Math.round(m * 60);
  const h = Math.floor(t / 3600), mn = Math.floor((t % 3600) / 60), s = t % 60;
  return h > 0 ? `${h}:${String(mn).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${mn}:${String(s).padStart(2,'0')}`;
}

// -- KPI --
function renderKPI() {
  const totalResults = DATA.events.reduce((s, e) => s + (e.results_count || 0), 0);
  const locations = new Set(DATA.events.map(e => `${e.location}_${e.year}`));
  const seasons = new Set(DATA.events.map(e => e.season));
  document.getElementById('kpi-row').innerHTML = `
    <div class="kpi"><div class="label">Gare</div><div class="value">${locations.size}</div><div class="sub">${seasons.size} stagioni</div></div>
    <div class="kpi"><div class="label">Risultati totali</div><div class="value">${totalResults.toLocaleString()}</div><div class="sub">${DATA.events.length} divisioni</div></div>
    <div class="kpi"><div class="label">Ultimo Sync</div><div class="value">${DATA.last_sync ? DATA.last_sync.slice(0,8).replace(/(\d{4})(\d{2})(\d{2})/, '$3/$2/$1') : '—'}</div></div>
  `;
}

// -- Events --
function renderEvents() {
  const grid = document.getElementById('event-grid');
  const q = (document.getElementById('filter-event')?.value || '').toLowerCase();
  let events = DATA.events;
  if (q) events = events.filter(e => [e.name, e.location, String(e.year), String(e.season), e.divisions?.join(' ')].join(' ').toLowerCase().includes(q));
  events = [...events].sort((a, b) => (b.results_count || 0) - (a.results_count || 0));

  grid.innerHTML = events.length ? events.map(e => `
    <div class="event-card" onclick="loadRace('${e.key}')">
      <h3>${e.name}</h3>
      <div class="city">${e.location} ${e.year} — Season ${e.season}</div>
      <div class="info">${(e.results_count||0).toLocaleString()} atleti &middot; ${e.divisions?.join(', ') || ''}</div>
    </div>
  `).join('') : '<div class="loading-msg">Nessun evento trovato</div>';
}

// -- Load race results on demand --
async function loadRace(key) {
  document.querySelector('[data-section="results"]').click();
  const loading = document.getElementById('results-loading');
  const wrap = document.getElementById('results-table-wrap');

  // Set event selector
  const sel = document.getElementById('filter-event-select');
  if (sel) sel.value = key;

  if (raceCache[key]) {
    currentRaceResults = raceCache[key];
    applyResultFilters();
    return;
  }

  loading.textContent = 'Caricamento risultati...';
  wrap.style.display = 'none';
  document.getElementById('results-pagination').innerHTML = '';

  try {
    const resp = await fetch(`data/races/${key}.json`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    currentRaceResults = await resp.json();
    raceCache[key] = currentRaceResults;
    loading.textContent = '';
    wrap.style.display = '';
    applyResultFilters();
  } catch (err) {
    loading.textContent = `Errore: ${err.message}`;
  }
}

// -- Results filters --
function renderResultsFilters() {
  const events = DATA.events.sort((a, b) => a.name.localeCompare(b.name));
  document.getElementById('results-filters').innerHTML = `
    <label>Evento</label>
    <select id="filter-event-select" onchange="loadRace(this.value)" style="min-width:250px">
      <option value="">— Seleziona un evento —</option>
      ${events.map(e => `<option value="${e.key}">${e.name} (${e.location} ${e.year})</option>`).join('')}
    </select>
    <label>Divisione</label>
    <select id="filter-division" onchange="applyResultFilters()">
      <option value="">Tutte</option>
    </select>
    <label>Genere</label>
    <select id="filter-gender" onchange="applyResultFilters()">
      <option value="">Tutti</option>
    </select>
    <label>Cerca atleta</label>
    <input type="text" id="filter-athlete" placeholder="Nome..." oninput="applyResultFilters()">
  `;
}

function applyResultFilters() {
  // Update division/gender dropdowns based on loaded data
  const divSel = document.getElementById('filter-division');
  const genSel = document.getElementById('filter-gender');
  const curDiv = divSel.value;
  const curGen = genSel.value;

  const divs = [...new Set(currentRaceResults.map(r => r.division).filter(Boolean))].sort();
  const gens = [...new Set(currentRaceResults.map(r => r.gender).filter(Boolean))].sort();

  divSel.innerHTML = '<option value="">Tutte</option>' + divs.map(d => `<option value="${d}" ${d===curDiv?'selected':''}>${d}</option>`).join('');
  genSel.innerHTML = '<option value="">Tutti</option>' + gens.map(g => `<option value="${g}" ${g===curGen?'selected':''}>${g}</option>`).join('');

  const div = divSel.value;
  const gen = genSel.value;
  const search = (document.getElementById('filter-athlete').value || '').toLowerCase();

  filteredResults = currentRaceResults.filter(r => {
    if (div && r.division !== div) return false;
    if (gen && r.gender !== gen) return false;
    if (search && !(r.name || '').toLowerCase().includes(search)) return false;
    return true;
  });

  filteredResults.sort((a, b) => (a.total_time || 9999) - (b.total_time || 9999));
  currentSort = { col: 'total_time', asc: true };
  resultsPage = 0;

  document.getElementById('results-loading').textContent = '';
  document.getElementById('results-table-wrap').style.display = '';
  renderResultsTable();
}

function sortResults(col) {
  if (currentSort.col === col) currentSort.asc = !currentSort.asc;
  else { currentSort.col = col; currentSort.asc = true; }

  filteredResults.sort((a, b) => {
    let va = a[col], vb = b[col];
    if (va == null || va !== va) va = typeof vb === 'string' ? 'zzz' : 999999;
    if (vb == null || vb !== vb) vb = typeof va === 'string' ? 'zzz' : 999999;
    return typeof va === 'string'
      ? (currentSort.asc ? va.localeCompare(vb) : vb.localeCompare(va))
      : (currentSort.asc ? va - vb : vb - va);
  });
  resultsPage = 0;
  renderResultsTable();
}

function renderResultsTable() {
  const thead = document.querySelector('#results-table thead tr');
  const tbody = document.querySelector('#results-table tbody');

  const cols = [
    { key: '_rank', label: '#' },
    { key: 'name', label: 'Atleta' },
    { key: 'division', label: 'Divisione' },
    { key: 'gender', label: 'Gen' },
    { key: 'age_group', label: 'Eta' },
    { key: 'nationality', label: 'Naz' },
    { key: 'total_time', label: 'Tempo' },
    { key: 'skiErg', label: 'SkiErg' },
    { key: 'sledPush', label: 'Sled Push' },
    { key: 'sledPull', label: 'Sled Pull' },
    { key: 'burpee', label: 'Burpee' },
    { key: 'row', label: 'Row' },
    { key: 'farmersCarry', label: 'Farmers' },
    { key: 'lunges', label: 'Lunges' },
    { key: 'wallBalls', label: 'Wall Balls' },
  ];

  thead.innerHTML = cols.map(c => {
    let cls = currentSort.col === c.key ? (currentSort.asc ? 'sorted-asc' : 'sorted-desc') : '';
    return `<th class="${cls}" onclick="sortResults('${c.key}')">${c.label}</th>`;
  }).join('');

  const start = resultsPage * PAGE_SIZE;
  const page = filteredResults.slice(start, start + PAGE_SIZE);

  tbody.innerHTML = page.map((r, i) => {
    const rank = start + i + 1;
    const rc = rank <= 3 ? `rank-${rank}` : '';
    return `<tr>
      <td class="${rc}">${rank}</td>
      <td>${(r.name||'').split(', ').reverse().join(' ')}</td>
      <td>${r.division||''}</td>
      <td>${r.gender||''}</td>
      <td>${r.age_group||''}</td>
      <td>${r.nationality||''}</td>
      <td class="time">${minsToTime(r.total_time)}</td>
      <td class="time">${minsToTime(r.skiErg)}</td>
      <td class="time">${minsToTime(r.sledPush)}</td>
      <td class="time">${minsToTime(r.sledPull)}</td>
      <td class="time">${minsToTime(r.burpee)}</td>
      <td class="time">${minsToTime(r.row)}</td>
      <td class="time">${minsToTime(r.farmersCarry)}</td>
      <td class="time">${minsToTime(r.lunges)}</td>
      <td class="time">${minsToTime(r.wallBalls)}</td>
    </tr>`;
  }).join('');

  const tp = Math.ceil(filteredResults.length / PAGE_SIZE) || 1;
  document.getElementById('results-pagination').innerHTML = `
    <button onclick="resultsPage=0;renderResultsTable()" ${resultsPage===0?'disabled':''}>&laquo;</button>
    <button onclick="resultsPage--;renderResultsTable()" ${resultsPage===0?'disabled':''}>&lsaquo;</button>
    <span>Pag ${resultsPage+1}/${tp} (${filteredResults.length.toLocaleString()} ris.)</span>
    <button onclick="resultsPage++;renderResultsTable()" ${resultsPage>=tp-1?'disabled':''}>&rsaquo;</button>
    <button onclick="resultsPage=${tp-1};renderResultsTable()" ${resultsPage>=tp-1?'disabled':''}>&raquo;</button>
  `;
}

// -- Stats --
function renderStatsFilters() {
  const events = DATA.events.filter(e => e.stats && Object.keys(e.stats).length > 0).sort((a,b) => a.name.localeCompare(b.name));
  if (!events.length) { document.getElementById('stats-filters').innerHTML = '<span style="color:var(--text2)">Nessuna statistica</span>'; return; }

  document.getElementById('stats-filters').innerHTML = `
    <label>Evento</label>
    <select id="filter-stats-event" onchange="renderStats()" style="min-width:250px">
      ${events.map(e => `<option value="${e.key}">${e.name} (${e.location} ${e.year})</option>`).join('')}
    </select>
  `;
  renderStats();
}

function renderStats() {
  const grid = document.getElementById('stats-grid');
  const key = document.getElementById('filter-stats-event')?.value;
  const event = DATA.events.find(e => e.key === key);
  if (!event || !event.stats) { grid.innerHTML = ''; return; }

  grid.innerHTML = Object.values(event.stats).sort((a,b) => `${a.division}_${a.gender}`.localeCompare(`${b.division}_${b.gender}`)).map(s => `
    <div class="stat-card">
      <h3>${s.division} — ${s.gender} (${s.count} atleti)</h3>
      <div class="stat-row"><span class="sl">Miglior tempo</span><span class="time">${minsToTime(s.min)}</span></div>
      <div class="stat-row"><span class="sl">Tempo medio</span><span class="time">${minsToTime(s.avg)}</span></div>
      <div class="stat-row"><span class="sl">Mediana</span><span class="time">${minsToTime(s.median)}</span></div>
      <div class="stat-row"><span class="sl">Peggior tempo</span><span class="time">${minsToTime(s.max)}</span></div>
      ${s.p10 ? `<div class="stat-row"><span class="sl">P10 (top 10%)</span><span class="time">${minsToTime(s.p10)}</span></div>` : ''}
      ${s.p25 ? `<div class="stat-row"><span class="sl">P25</span><span class="time">${minsToTime(s.p25)}</span></div>` : ''}
      ${s.p75 ? `<div class="stat-row"><span class="sl">P75</span><span class="time">${minsToTime(s.p75)}</span></div>` : ''}
      ${s.p90 ? `<div class="stat-row"><span class="sl">P90</span><span class="time">${minsToTime(s.p90)}</span></div>` : ''}
    </div>
  `).join('');
}

// -- Content IG --
let contentType = 'top10';
let contentRaceData = null;
let contentEventKey = '';

document.getElementById('content-type-btns').addEventListener('click', e => {
  const btn = e.target.closest('.content-type-btn');
  if (!btn) return;
  document.querySelectorAll('.content-type-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  contentType = btn.dataset.type;
  renderContentFilters();
});

function renderContentFilters() {
  const events = DATA.events.sort((a, b) => a.name.localeCompare(b.name));
  const area = document.getElementById('content-area');
  area.innerHTML = '';

  if (contentType === 'athlete') {
    document.getElementById('content-filters').innerHTML = `
      <label>Cerca atleta</label>
      <input type="text" id="content-athlete-search" placeholder="Nome atleta..." style="min-width:250px">
      <button class="btn-generate" onclick="searchAthlete()">Cerca in tutte le gare</button>
    `;
    return;
  }

  document.getElementById('content-filters').innerHTML = `
    <label>Evento</label>
    <select id="content-event-select" style="min-width:250px">
      <option value="">— Seleziona —</option>
      ${events.map(e => `<option value="${e.key}">${e.name} (${e.location} ${e.year})</option>`).join('')}
    </select>
    <label>Divisione</label>
    <select id="content-division"><option value="">Tutte</option></select>
    <label>Genere</label>
    <select id="content-gender"><option value="">Tutti</option></select>
    <button class="btn-generate" onclick="generateContent()">Genera</button>
  `;
}

async function loadContentRace(key) {
  if (raceCache[key]) return raceCache[key];
  const resp = await fetch(`data/races/${key}.json`);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const data = await resp.json();
  raceCache[key] = data;
  return data;
}

async function generateContent() {
  const key = document.getElementById('content-event-select').value;
  if (!key) return;
  const area = document.getElementById('content-area');
  area.innerHTML = '<div class="loading-msg">Caricamento...</div>';

  try {
    const results = await loadContentRace(key);
    contentRaceData = results;
    contentEventKey = key;

    // Update division/gender dropdowns
    const divSel = document.getElementById('content-division');
    const genSel = document.getElementById('content-gender');
    const divs = [...new Set(results.map(r => r.division).filter(Boolean))].sort();
    const gens = [...new Set(results.map(r => r.gender).filter(Boolean))].sort();
    divSel.innerHTML = '<option value="">Tutte</option>' + divs.map(d => `<option value="${d}">${d}</option>`).join('');
    genSel.innerHTML = '<option value="">Tutti</option>' + gens.map(g => `<option value="${g}">${g}</option>`).join('');

    if (contentType === 'top10') generateTop10(key, results);
    else if (contentType === 'report') generateReport(key, results);
  } catch (err) {
    area.innerHTML = `<div class="loading-msg">Errore: ${err.message}</div>`;
  }
}

function getFilteredContent(results) {
  const div = document.getElementById('content-division')?.value || '';
  const gen = document.getElementById('content-gender')?.value || '';
  let filtered = results;
  if (div) filtered = filtered.filter(r => r.division === div);
  if (gen) filtered = filtered.filter(r => r.gender === gen);
  return filtered.filter(r => r.total_time).sort((a, b) => a.total_time - b.total_time);
}

function formatName(name) {
  if (!name) return '???';
  return name.split(', ').reverse().join(' ');
}

function generateTop10(key, results) {
  const event = DATA.events.find(e => e.key === key);
  const filtered = getFilteredContent(results);
  const top = filtered.slice(0, 10);
  const div = document.getElementById('content-division')?.value || '';
  const gen = document.getElementById('content-gender')?.value || '';

  const title = `TOP 10 — ${event.location.toUpperCase()} ${event.year}`;
  const subtitle = [div, gen].filter(Boolean).join(' | ') || 'Open';

  let text = `${title}\n${subtitle}\n${'─'.repeat(40)}\n\n`;
  top.forEach((r, i) => {
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i+1}.`;
    const flag = r.nationality ? ` (${r.nationality})` : '';
    text += `${medal} ${formatName(r.name)}${flag}\n`;
    text += `   Tempo: ${minsToTime(r.total_time)}\n`;

    // Find best and worst split
    const splits = [
      { name: 'SkiErg', val: r.skiErg },
      { name: 'Sled Push', val: r.sledPush },
      { name: 'Sled Pull', val: r.sledPull },
      { name: 'Burpee BJ', val: r.burpee },
      { name: 'Row', val: r.row },
      { name: 'Farmers', val: r.farmersCarry },
      { name: 'Lunges', val: r.lunges },
      { name: 'Wall Balls', val: r.wallBalls },
    ].filter(s => s.val);

    if (splits.length) {
      const best = splits.reduce((a, b) => a.val < b.val ? a : b);
      text += `   Best split: ${best.name} ${minsToTime(best.val)}\n`;
    }
    text += '\n';
  });

  text += `\n${filtered.length.toLocaleString()} partecipanti totali`;

  const area = document.getElementById('content-area');
  area.innerHTML = `<div class="content-output"><button class="btn-copy" onclick="copyContent()">Copia</button>${escHtml(text)}</div>`;
}

function generateReport(key, results) {
  const event = DATA.events.find(e => e.key === key);
  const filtered = getFilteredContent(results);
  if (!filtered.length) {
    document.getElementById('content-area').innerHTML = '<div class="loading-msg">Nessun risultato con i filtri selezionati</div>';
    return;
  }

  const n = filtered.length;
  const times = filtered.map(r => r.total_time);
  const avg = times.reduce((a, b) => a + b, 0) / n;
  const median = times[Math.floor(n / 2)];
  const p10 = n >= 10 ? times[Math.floor(n * 0.1)] : null;
  const p90 = n >= 10 ? times[Math.floor(n * 0.9)] : null;

  // Average splits
  const splitNames = ['skiErg','sledPush','sledPull','burpee','row','farmersCarry','lunges','wallBalls'];
  const splitLabels = { skiErg:'SkiErg', sledPush:'Sled Push', sledPull:'Sled Pull', burpee:'Burpee BJ', row:'Row', farmersCarry:'Farmers Carry', lunges:'Lunges', wallBalls:'Wall Balls' };
  const avgSplits = splitNames.map(s => {
    const vals = filtered.map(r => r[s]).filter(v => v && !isNaN(v));
    return { name: splitLabels[s], avg: vals.length ? vals.reduce((a,b) => a+b,0) / vals.length : null };
  }).filter(s => s.avg);

  const slowest = avgSplits.length ? avgSplits.reduce((a, b) => a.avg > b.avg ? a : b) : null;
  const fastest = avgSplits.length ? avgSplits.reduce((a, b) => a.avg < b.avg ? a : b) : null;

  // Nationality breakdown
  const natCounts = {};
  filtered.forEach(r => { if (r.nationality) natCounts[r.nationality] = (natCounts[r.nationality]||0) + 1; });
  const topNats = Object.entries(natCounts).sort((a,b) => b[1]-a[1]).slice(0, 5);

  const div = document.getElementById('content-division')?.value || '';
  const gen = document.getElementById('content-gender')?.value || '';
  const title = `REPORT — ${event.location.toUpperCase()} ${event.year}`;
  const subtitle = [div, gen].filter(Boolean).join(' | ') || 'Tutte le divisioni';

  let text = `${title}\n${subtitle}\n${'─'.repeat(40)}\n\n`;
  text += `Partecipanti: ${n.toLocaleString()}\n\n`;
  text += `Miglior tempo:  ${minsToTime(times[0])} (${formatName(filtered[0].name)})\n`;
  text += `Tempo medio:    ${minsToTime(avg)}\n`;
  text += `Mediana:        ${minsToTime(median)}\n`;
  text += `Peggior tempo:  ${minsToTime(times[n-1])}\n`;
  if (p10) text += `Top 10%:        sotto ${minsToTime(p10)}\n`;
  if (p90) text += `Top 90%:        sotto ${minsToTime(p90)}\n`;

  if (avgSplits.length) {
    text += `\nTEMPI MEDI PER STAZIONE\n${'─'.repeat(30)}\n`;
    avgSplits.sort((a,b) => b.avg - a.avg).forEach(s => {
      const marker = s === slowest ? ' ← PIU LENTA' : s === fastest ? ' ← PIU VELOCE' : '';
      text += `${s.name.padEnd(14)} ${minsToTime(s.avg)}${marker}\n`;
    });
  }

  if (topNats.length) {
    text += `\nNAZIONALITA TOP 5\n${'─'.repeat(30)}\n`;
    topNats.forEach(([nat, cnt]) => {
      text += `${nat.padEnd(6)} ${cnt} atleti (${Math.round(cnt/n*100)}%)\n`;
    });
  }

  const area = document.getElementById('content-area');
  area.innerHTML = `<div class="content-output"><button class="btn-copy" onclick="copyContent()">Copia</button>${escHtml(text)}</div>`;
}

async function searchAthlete() {
  const search = (document.getElementById('content-athlete-search')?.value || '').toLowerCase().trim();
  if (search.length < 3) {
    document.getElementById('content-area').innerHTML = '<div class="loading-msg">Inserisci almeno 3 caratteri</div>';
    return;
  }

  const area = document.getElementById('content-area');
  area.innerHTML = '<div class="loading-msg">Cerco in tutte le gare...</div>';

  const found = [];
  for (const event of DATA.events) {
    let results;
    try {
      results = await loadContentRace(event.key);
    } catch { continue; }

    const matches = results.filter(r => (r.name || '').toLowerCase().includes(search));
    if (matches.length) {
      matches.forEach(m => found.push({ ...m, event }));
    }
  }

  if (!found.length) {
    area.innerHTML = '<div class="loading-msg">Atleta non trovato in nessuna gara</div>';
    return;
  }

  // Group by athlete name (exact match)
  const byName = {};
  found.forEach(r => {
    const key = r.name || '???';
    if (!byName[key]) byName[key] = [];
    byName[key].push(r);
  });

  let html = '';
  for (const [name, races] of Object.entries(byName)) {
    const sorted = races.sort((a, b) => (a.total_time || 9999) - (b.total_time || 9999));
    const best = sorted.find(r => r.total_time);

    html += `<div style="margin-bottom:1.5rem">`;
    html += `<h3 style="color:var(--accent);margin-bottom:0.3rem">${formatName(name)}</h3>`;
    html += `<div style="color:var(--text2);font-size:0.85rem;margin-bottom:0.8rem">${races.length} gara/e trovata/e${best ? ` — Miglior tempo: ${minsToTime(best.total_time)}` : ''}</div>`;

    // Copyable text
    let text = `PROFILO ATLETA — ${formatName(name)}\n${'─'.repeat(40)}\n\n`;
    text += `Gare disputate: ${races.length}\n`;
    if (best) text += `Miglior tempo: ${minsToTime(best.total_time)}\n`;
    if (best?.nationality) text += `Nazionalita: ${best.nationality}\n`;
    text += '\n';

    races.forEach(r => {
      const ev = r.event;
      html += `<div class="athlete-race-card">`;
      html += `<h4>${ev.location.toUpperCase()} ${ev.year} — Season ${ev.season}</h4>`;
      html += `<div>${r.division || ''} | ${r.gender || ''} | ${r.age_group || ''}</div>`;
      html += `<div style="font-size:1.1rem;font-weight:700;margin:0.3rem 0">Tempo: ${minsToTime(r.total_time)}</div>`;

      text += `${ev.location.toUpperCase()} ${ev.year} (Season ${ev.season})\n`;
      text += `  Divisione: ${r.division || '—'} | ${r.gender || '—'}\n`;
      text += `  Tempo: ${minsToTime(r.total_time)}\n`;

      const splits = [
        { name: 'SkiErg', val: r.skiErg },
        { name: 'Sled Push', val: r.sledPush },
        { name: 'Sled Pull', val: r.sledPull },
        { name: 'Burpee BJ', val: r.burpee },
        { name: 'Row', val: r.row },
        { name: 'Farmers', val: r.farmersCarry },
        { name: 'Lunges', val: r.lunges },
        { name: 'Wall Balls', val: r.wallBalls },
      ].filter(s => s.val);

      if (splits.length) {
        const best = splits.reduce((a, b) => a.val < b.val ? a : b);
        const worst = splits.reduce((a, b) => a.val > b.val ? a : b);
        html += '<div class="athlete-splits">';
        splits.forEach(s => {
          const cls = s === best ? 'athlete-best' : s === worst ? 'athlete-worst' : '';
          html += `<div class="athlete-split"><span class="sl">${s.name}</span> <span class="sv ${cls}">${minsToTime(s.val)}</span></div>`;
        });
        html += '</div>';
        text += `  Splits: ${splits.map(s => `${s.name} ${minsToTime(s.val)}`).join(' | ')}\n`;
        text += `  Punto forte: ${best.name} (${minsToTime(best.val)}) | Punto debole: ${worst.name} (${minsToTime(worst.val)})\n`;
      }
      html += '</div>';
      text += '\n';
    });

    html += `<button class="btn-copy" style="position:static;margin-top:0.5rem" onclick="navigator.clipboard.writeText(this.dataset.text).then(()=>{this.textContent='Copiato!';setTimeout(()=>this.textContent='Copia profilo',1500)})" data-text="${escAttr(text)}">Copia profilo</button>`;
    html += '</div>';
  }

  area.innerHTML = html;
}

function copyContent() {
  const output = document.querySelector('.content-output');
  if (!output) return;
  const text = output.textContent.replace('Copia', '').trim();
  navigator.clipboard.writeText(text).then(() => {
    const btn = output.querySelector('.btn-copy');
    if (btn) { btn.textContent = 'Copiato!'; setTimeout(() => btn.textContent = 'Copia', 1500); }
  });
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// -- Tabs --
document.getElementById('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  tab.classList.add('active');
  document.getElementById('sec-' + tab.dataset.section).classList.add('active');
});

// -- Init --
async function init() {
  try {
    const resp = await fetch('data/dashboard.json');
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    DATA = await resp.json();
  } catch (err) {
    document.querySelector('.container').innerHTML = `<div class="loading-msg">Errore: ${err.message}</div>`;
    return;
  }
  document.getElementById('sync-info').textContent = `${DATA.events.length} gare disponibili`;
  renderKPI();
  renderEvents();
  renderResultsFilters();
  renderStatsFilters();
  renderContentFilters();
}
init();
</script>
