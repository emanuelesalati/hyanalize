// =============================================
// CROSS-EVENT INTELLIGENCE
// =============================================

async function crossSearch() {
  const search = (document.getElementById('cross-athlete-search')?.value || '').toLowerCase().trim();
  if (search.length < 3) {
    document.getElementById('cross-area').innerHTML = '<div class="loading-msg">Inserisci almeno 3 caratteri</div>';
    return;
  }

  const area = document.getElementById('cross-area');
  const total = DATA.events.length;
  let done = 0;
  area.innerHTML = '<div class="loading-msg" id="cross-progress">Cerco in tutte le gare... 0/' + total + '</div>';

  const found = [];
  const BATCH = 10;
  for (let i = 0; i < total; i += BATCH) {
    const batch = DATA.events.slice(i, i + BATCH);
    const promises = batch.map(async event => {
      try {
        const results = await loadContentRace(event.key);
        const words = search.split(/\s+/);
        const matches = results.filter(r => {
          const name = (r.name || '').toLowerCase();
          return words.every(w => name.includes(w));
        });
        if (matches.length) {
          matches.forEach(m => found.push({ ...m, event }));
        }
      } catch (err) { /* skip */ }
      done++;
    });
    await Promise.all(promises);
    const prog = document.getElementById('cross-progress');
    if (prog) prog.textContent = 'Cerco in tutte le gare... ' + done + '/' + total + ' (' + found.length + ' trovati)';
  }

  if (!found.length) {
    area.innerHTML = '<div class="loading-msg">Atleta non trovato in nessuna gara</div>';
    return;
  }

  // All found results belong to the searched athlete (search already filtered by name match).
  // In doubles, the name field contains both partners (e.g. "Eugenio Bianchi Beau Wills"),
  // so we take ALL results rather than grouping by exact name.
  const allRaces = found;

  // Find the most common solo name for display
  const nameCounts = {};
  found.forEach(r => { nameCounts[r.name] = (nameCounts[r.name]||0) + 1; });
  const mainName = Object.entries(nameCounts).sort((a,b) => b[1] - a[1])[0][0];
  const displayName = formatName(mainName);

  // Group by division + gender (e.g. "doubles_mixed", "doubles_male", "open_male")
  const byDiv = {};
  allRaces.forEach(r => {
    const div = r.division || 'unknown';
    const gen = r.gender || 'unknown';
    const key = div + '_' + gen;
    if (!byDiv[key]) byDiv[key] = [];
    byDiv[key].push(r);
  });

  const divKeys = Object.keys(byDiv).sort((a, b) => byDiv[b].length - byDiv[a].length);
  const divGenderLabels = {
    open_male: 'Open Men', open_female: 'Open Women',
    doubles_male: 'Doubles Men', doubles_female: 'Doubles Women', doubles_mixed: 'Doubles Mixed',
    pro_male: 'Pro Men', pro_female: 'Pro Women',
    pro_doubles_male: 'Pro Doubles Men', pro_doubles_female: 'Pro Doubles Women', pro_doubles_mixed: 'Pro Doubles Mixed',
  };

  // Store data globally for division switching
  window._crossData = { name: displayName, byDiv, divKeys, divLabels: divGenderLabels };

  // Show division selector + first division analysis
  let selectorHtml = '<div style="margin-bottom:1rem;display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center">';
  selectorHtml += '<span style="color:var(--text2);font-size:0.85rem">Categoria:</span>';
  divKeys.forEach((d, i) => {
    const label = divGenderLabels[d] || d;
    const count = byDiv[d].length;
    const cls = i === 0 ? 'tab active' : 'tab';
    selectorHtml += '<div class="' + cls + '" data-cross-div="' + d + '" onclick="switchCrossDiv(\'' + d + '\')" style="font-size:0.82rem;padding:0.4rem 0.8rem">' + label + ' (' + count + ')</div>';
  });
  selectorHtml += '</div>';
  selectorHtml += '<div id="cross-div-content"></div>';

  area.innerHTML = selectorHtml;
  switchCrossDiv(divKeys[0]);
}

function switchCrossDiv(div) {
  // Update active tab
  document.querySelectorAll('[data-cross-div]').forEach(t => {
    t.classList.toggle('active', t.dataset.crossDiv === div);
  });

  const { name, byDiv } = window._crossData;
  const races = byDiv[div];

  // Sort races by date (oldest first — needed for progression charts)
  const sorted = [...races].sort((a, b) => {
    const sa = a.event.season, sb = b.event.season;
    if (sa !== sb) return sa - sb;
    return (a.event.year || 0) - (b.event.year || 0);
  });

  renderCrossAnalysis(name, sorted, div);
}

function renderCrossAnalysis(name, races, divFilter) {
  const area = document.getElementById('cross-div-content');
  const stationKeys = [
    { key: 'skiErg', name: 'SkiErg' },
    { key: 'sledPush', name: 'Sled Push' },
    { key: 'sledPull', name: 'Sled Pull' },
    { key: 'burpee', name: 'Burpee BJ' },
    { key: 'row', name: 'Row' },
    { key: 'farmersCarry', name: 'Farmers' },
    { key: 'lunges', name: 'Lunges' },
    { key: 'wallBalls', name: 'Wall Balls' },
  ];

  // ===== 1. Summary cards =====
  const bestRace = races.filter(r => r.total_time).sort((a, b) => a.total_time - b.total_time)[0];
  const latestRace = races[races.length - 1];
  const firstRace = races.find(r => r.total_time);
  const improvement = firstRace && latestRace && firstRace.total_time && latestRace.total_time
    ? firstRace.total_time - latestRace.total_time : null;

  // Global percentile: count across ALL cached races for same division+gender
  // divFilter is now "division_gender" (e.g. "doubles_mixed"), split it
  const filterParts = (divFilter || '').split('_');
  const refDiv = filterParts.length >= 2 ? filterParts.slice(0, -1).join('_') : (bestRace?.division);
  const refGen = filterParts.length >= 2 ? filterParts[filterParts.length - 1] : (bestRace?.gender);
  const bestTime = bestRace?.total_time;
  let globalRank = null, globalTotal = 0;
  if (refDiv && refGen && bestTime) {
    const allTimes = [];
    for (const key of Object.keys(raceCache)) {
      raceCache[key].forEach(r => {
        if (r.division === refDiv && r.gender === refGen && r.total_time) {
          allTimes.push(r.total_time);
        }
      });
    }
    globalTotal = allTimes.length;
    globalRank = allTimes.filter(t => t < bestTime).length + 1;
  }

  const divGenderLabels = {
    open_male: 'Open Men', open_female: 'Open Women',
    doubles_male: 'Doubles Men', doubles_female: 'Doubles Women', doubles_mixed: 'Doubles Mixed',
    pro_male: 'Pro Men', pro_female: 'Pro Women',
    pro_doubles_male: 'Pro Doubles Men', pro_doubles_female: 'Pro Doubles Women', pro_doubles_mixed: 'Pro Doubles Mixed',
  };
  const divLabel = divGenderLabels[divFilter] || divFilter || '';
  let html = '<h2 style="color:var(--accent);margin-bottom:1rem;font-size:1.3rem">' + name + ' — ' + divLabel + '</h2>';

  html += '<div class="cross-summary">';
  html += '<div class="cross-card"><h3>Gare analizzate</h3><div class="big">' + races.length + '</div><div class="sub">' + new Set(races.map(r => r.event.season)).size + ' stagioni</div></div>';
  if (bestRace) html += '<div class="cross-card"><h3>Personal Best</h3><div class="big">' + minsToTime(bestRace.total_time) + '</div><div class="sub">' + bestRace.event.location + ' ' + bestRace.event.year + '</div></div>';
  if (improvement !== null) {
    const impSign = improvement > 0 ? '-' : '+';
    const impColor = improvement > 0 ? 'var(--green)' : '#ff6b6b';
    html += '<div class="cross-card"><h3>Progresso totale</h3><div class="big" style="color:' + impColor + '">' + impSign + minsToTime(Math.abs(improvement)) + '</div><div class="sub">dalla prima all\'ultima gara</div></div>';
  }
  if (globalRank && globalTotal) {
    const globalPct = ((globalRank / globalTotal) * 100).toFixed(1);
    html += '<div class="cross-card"><h3>Classifica globale</h3><div class="big">#' + globalRank + '</div><div class="sub">su ' + globalTotal.toLocaleString() + ' risultati (' + refDiv + ' ' + refGen + ') — top ' + globalPct + '%</div></div>';
  }
  html += '</div>';

  // ===== 2. Progression chart (total time over events) =====
  const progressionId = 'cross-progression-canvas';
  html += '<div class="cross-section">';
  html += '<h3><span class="icon">&#x1F4C8;</span> Progressione tempo totale</h3>';
  html += '<div class="cross-chart-wrap"><canvas id="' + progressionId + '"></canvas></div>';
  html += '</div>';

  // ===== 3. Split Evolution (HTML table) =====
  const splitEvoId = 'cross-splitevo-container';
  html += '<div class="cross-section">';
  html += '<h3><span class="icon">&#x1F3CB;</span> Evoluzione stazioni</h3>';
  html += '<div id="' + splitEvoId + '"></div>';
  html += '</div>';

  // ===== 4. Personal Best per stazione =====
  html += '<div class="cross-section">';
  html += '<h3><span class="icon">&#x1F3C6;</span> Personal Best per stazione</h3>';
  html += '<div class="cross-pb-grid">';

  // PB for total time
  if (bestRace) {
    html += '<div class="cross-pb-item"><div class="station">Total</div><div class="pb-time">' + minsToTime(bestRace.total_time) + '</div><div class="pb-where">' + bestRace.event.location + ' ' + bestRace.event.year + '</div></div>';
  }

  stationKeys.forEach(sk => {
    const withVal = races.filter(r => r[sk.key] && !isNaN(r[sk.key]));
    if (!withVal.length) return;
    const best = withVal.reduce((a, b) => a[sk.key] < b[sk.key] ? a : b);
    html += '<div class="cross-pb-item"><div class="station">' + sk.name + '</div><div class="pb-time">' + minsToTime(best[sk.key]) + '</div><div class="pb-where">' + best.event.location + ' ' + best.event.year + '</div></div>';
  });

  // PB for run_time
  const withRun = races.filter(r => r.run_time && !isNaN(r.run_time));
  if (withRun.length) {
    const bestRun = withRun.reduce((a, b) => a.run_time < b.run_time ? a : b);
    html += '<div class="cross-pb-item"><div class="station">Run</div><div class="pb-time">' + minsToTime(bestRun.run_time) + '</div><div class="pb-where">' + bestRun.event.location + ' ' + bestRun.event.year + '</div></div>';
  }
  html += '</div></div>';

  // ===== 5. Persistent weakness analysis =====
  html += '<div class="cross-section">';
  html += '<h3><span class="icon">&#x1F3AF;</span> Analisi punti deboli persistenti</h3>';
  html += '<p style="color:var(--text2);font-size:0.82rem;margin-bottom:1rem">Percentile medio per stazione su tutte le gare. Piu basso = piu forte.</p>';

  const avgPercentiles = [];
  stationKeys.forEach(sk => {
    const pctiles = [];
    races.forEach(r => {
      if (!r[sk.key] || isNaN(r[sk.key])) return;
      const allResults = raceCache[r.event.key] || [];
      const peers = allResults.filter(p => p.division === r.division && p.gender === r.gender && p[sk.key] && !isNaN(p[sk.key]));
      if (!peers.length) return;
      const sorted = peers.map(p => p[sk.key]).sort((a, b) => a - b);
      const rank = sorted.filter(v => v < r[sk.key]).length + 1;
      pctiles.push((rank / sorted.length) * 100);
    });
    if (pctiles.length) {
      const avgPct = pctiles.reduce((a, b) => a + b, 0) / pctiles.length;
      avgPercentiles.push({ name: sk.name, key: sk.key, avgPct, count: pctiles.length });
    }
  });

  avgPercentiles.sort((a, b) => a.avgPct - b.avgPct);

  avgPercentiles.forEach(s => {
    const color = s.avgPct <= 25 ? '#00d68f' : s.avgPct <= 50 ? '#c8ff00' : s.avgPct <= 75 ? '#ffa500' : '#ff6b6b';
    const label = s.avgPct <= 25 ? 'Forte' : s.avgPct <= 50 ? 'Buono' : s.avgPct <= 75 ? 'Da migliorare' : 'Punto debole';
    html += '<div class="cross-weakness-row">';
    html += '<div class="cross-weakness-name">' + s.name + '</div>';
    html += '<div class="cross-weakness-bar-wrap"><div class="cross-weakness-bar" style="width:' + s.avgPct.toFixed(1) + '%;background:' + color + '"></div></div>';
    html += '<div class="cross-weakness-pct" style="color:' + color + '">top ' + s.avgPct.toFixed(1) + '%</div>';
    html += '</div>';
  });

  // Training priority recommendation
  if (avgPercentiles.length) {
    const worst = avgPercentiles[avgPercentiles.length - 1];
    const best = avgPercentiles[0];
    html += '<div style="margin-top:1rem;padding:1rem;background:var(--surface2);border-radius:8px;font-size:0.85rem">';
    html += '<strong style="color:var(--accent)">Raccomandazione allenamento:</strong> ';
    html += 'Concentrati su <strong style="color:#ff6b6b">' + worst.name + '</strong> (top ' + worst.avgPct.toFixed(0) + '%) — hai il massimo margine di miglioramento. ';
    html += 'Il tuo punto di forza e <strong style="color:#00d68f">' + best.name + '</strong> (top ' + best.avgPct.toFixed(0) + '%).';
    html += '</div>';
  }
  html += '</div>';

  // ===== 6. Fatigue Index (run lap decay) =====
  const latestWithLaps = [...races].reverse().find(r => r.run1 && r.run8);
  if (latestWithLaps) {
    html += '<div class="cross-section">';
    html += '<h3><span class="icon">&#x1F4A8;</span> Fatigue Index — ' + latestWithLaps.event.location + ' ' + latestWithLaps.event.year + '</h3>';

    const laps = [];
    for (let i = 1; i <= 8; i++) {
      const v = latestWithLaps['run' + i];
      if (v && !isNaN(v)) laps.push({ num: i, val: v });
    }

    if (laps.length >= 2) {
      const firstLap = laps[0].val;
      const lastLap = laps[laps.length - 1].val;
      const fatigueIdx = ((lastLap / firstLap) - 1) * 100;
      const maxLap = Math.max(...laps.map(l => l.val));

      html += '<div style="display:flex;gap:2rem;align-items:center;margin-bottom:1rem;flex-wrap:wrap">';
      html += '<div><span style="color:var(--text2);font-size:0.82rem">Fatigue Index:</span> ';
      const fiColor = fatigueIdx <= 5 ? '#00d68f' : fatigueIdx <= 15 ? '#c8ff00' : fatigueIdx <= 25 ? '#ffa500' : '#ff6b6b';
      const fiLabel = fatigueIdx <= 5 ? 'Eccellente' : fatigueIdx <= 15 ? 'Buono' : fatigueIdx <= 25 ? 'Da migliorare' : 'Critico';
      html += '<strong style="color:' + fiColor + ';font-size:1.1rem">+' + fatigueIdx.toFixed(1) + '% (' + fiLabel + ')</strong></div>';
      html += '<div style="font-size:0.8rem;color:var(--text2)">Run 1: ' + minsToTime(firstLap) + ' → Run ' + laps.length + ': ' + minsToTime(lastLap) + '</div>';
      html += '</div>';

      html += '<div class="cross-fatigue-laps" style="margin-bottom:1.5rem">';
      laps.forEach(l => {
        const pct = (l.val / maxLap) * 100;
        const isBest = l.val === Math.min(...laps.map(x => x.val));
        const isWorst = l.val === maxLap;
        const color = isBest ? '#00d68f' : isWorst ? '#ff6b6b' : 'var(--accent)';
        html += '<div class="cross-fatigue-bar" style="height:' + pct + '%;background:' + color + '">';
        html += '<div class="val">' + minsToTime(l.val) + '</div>';
        html += '<div class="label">R' + l.num + '</div>';
        html += '</div>';
      });
      html += '</div>';

      // Fatigue trend across events
      const fatigueOverTime = [];
      races.forEach(r => {
        if (r.run1 && r.run8 && !isNaN(r.run1) && !isNaN(r.run8)) {
          const fi = ((r.run8 / r.run1) - 1) * 100;
          fatigueOverTime.push({ event: r.event, fi });
        }
      });

      if (fatigueOverTime.length > 1) {
        const fatigueTrendId = 'cross-fatigue-trend';
        html += '<div style="margin-top:0.5rem"><div style="font-size:0.8rem;color:var(--text2);margin-bottom:0.5rem">Fatigue Index nel tempo</div>';
        html += '<div class="cross-chart-wrap"><canvas id="' + fatigueTrendId + '"></canvas></div></div>';
        // We'll draw this after DOM insertion
        window._fatigueTrendData = fatigueOverTime;
      }
    }
    html += '</div>';
  }

  // ===== 7. Target gap analysis =====
  if (bestRace && bestRace.total_time) {
    html += '<div class="cross-section">';
    html += '<h3><span class="icon">&#x1F3AF;</span> Gap Analysis — Obiettivo tempo</h3>';

    // Calculate target options based on current best
    const currentBest = bestRace.total_time;
    const targets = [];
    // Round down to nearest 10 minutes
    const roundedMin = Math.floor(currentBest / 10) * 10;
    if (roundedMin < currentBest) targets.push(roundedMin);
    if (roundedMin - 10 > 0) targets.push(roundedMin - 10);
    // Also add 5-minute steps
    const five = Math.floor(currentBest / 5) * 5;
    if (five < currentBest && !targets.includes(five)) targets.push(five);

    targets.sort((a, b) => b - a);
    const target = targets[0] || currentBest - 5;
    const gap = currentBest - target;

    html += '<div style="margin-bottom:1rem">';
    html += '<span style="color:var(--text2);font-size:0.85rem">Attuale: </span><strong style="font-family:monospace">' + minsToTime(currentBest) + '</strong>';
    html += '<span style="color:var(--accent);margin:0 0.5rem">→</span>';
    html += '<span style="color:var(--text2);font-size:0.85rem">Obiettivo: </span><strong style="font-family:monospace;color:var(--green)">' + minsToTime(target) + '</strong>';
    html += '<span style="color:var(--text2);font-size:0.85rem;margin-left:0.5rem">(da recuperare: ' + minsToTime(gap) + ')</span>';
    html += '</div>';

    // Distribute gap across stations based on weakness
    if (avgPercentiles.length) {
      html += '<div style="font-size:0.82rem;color:var(--text2);margin-bottom:0.8rem">Dove recuperare tempo (basato sulle tue debolezze):</div>';

      // Weight by percentile: weaker stations get more of the gap
      const totalWeight = avgPercentiles.reduce((s, p) => s + p.avgPct, 0);
      avgPercentiles.sort((a, b) => b.avgPct - a.avgPct);

      avgPercentiles.forEach(s => {
        const weight = s.avgPct / totalWeight;
        const stationGap = gap * weight;
        const currentAvg = races.map(r => r[s.key]).filter(v => v && !isNaN(v));
        const currentBestStation = currentAvg.length ? Math.min(...currentAvg) : null;
        if (!currentBestStation) return;
        const targetStation = currentBestStation - stationGap;

        html += '<div class="cross-target-row">';
        html += '<div class="cross-target-station">' + s.name + '</div>';
        html += '<div class="cross-target-current">' + minsToTime(currentBestStation) + '</div>';
        html += '<div class="cross-target-arrow">→</div>';
        html += '<div class="cross-target-needed">' + minsToTime(Math.max(targetStation, 0)) + '</div>';
        html += '<div class="cross-target-delta">(-' + minsToTime(stationGap) + ' | peso ' + (weight * 100).toFixed(0) + '%)</div>';
        html += '</div>';
      });
    }
    html += '</div>';
  }

  // ===== 8. Global ranking detail =====
  if (globalRank && globalTotal) {
    html += '<div class="cross-section">';
    html += '<h3><span class="icon">&#x1F30D;</span> Classifica globale (' + refDiv + ' ' + refGen + ')</h3>';
    const pct = ((globalRank / globalTotal) * 100);
    html += '<div class="cross-global-rank">';
    html += '<div class="rank-num">#' + globalRank + '</div>';
    html += '<div class="rank-detail">';
    html += 'Su <strong>' + globalTotal.toLocaleString() + '</strong> risultati caricati<br>';
    html += 'Top <strong>' + pct.toFixed(1) + '%</strong> mondiale<br>';
    html += 'Miglior tempo: <strong>' + minsToTime(bestTime) + '</strong>';
    html += '</div></div>';
    html += '<p style="color:var(--text2);font-size:0.75rem;margin-top:0.5rem">Nota: basato sulle gare caricate in cache (' + Object.keys(raceCache).length + ' gare). Per dati completi, cerca prima l\'atleta per caricare tutte le gare.</p>';
    html += '</div>';
  }

  // ===== Render =====
  area.innerHTML = html;

  // Draw progression chart
  drawProgressionChart(progressionId, races);
  // Render split evolution table
  renderSplitEvoHTML(splitEvoId, races, stationKeys);
  // Draw fatigue trend if data exists
  if (window._fatigueTrendData) {
    drawFatigueTrend('cross-fatigue-trend', window._fatigueTrendData);
    window._fatigueTrendData = null;
  }
}

function setupHiDPICanvas(canvas, cssW, cssH) {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = cssW * dpr;
  canvas.height = cssH * dpr;
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  return { ctx, W: cssW, H: cssH };
}

function drawProgressionChart(canvasId, races) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;

  const withTime = races.filter(r => r.total_time);
  const cssW = canvas.parentElement.clientWidth || 800;
  const cssH = Math.max(300, Math.min(400, cssW * 0.4));
  const { ctx, W, H } = setupHiDPICanvas(canvas, cssW, cssH);

  if (withTime.length < 2) {
    ctx.fillStyle = '#8b8fa3'; ctx.font = '14px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Servono almeno 2 gare per il grafico di progressione', W/2, H/2);
    return;
  }

  const padL = 75, padR = 30, padT = 40, padB = 80;
  const chartW = W - padL - padR, chartH = H - padT - padB;

  const times = withTime.map(r => r.total_time);
  const minT = Math.min(...times) - 2;
  const maxT = Math.max(...times) + 2;

  // Background
  ctx.fillStyle = '#1a1d27';
  ctx.fillRect(0, 0, W, H);

  // Grid + Y axis labels
  ctx.strokeStyle = '#2e3347'; ctx.lineWidth = 1;
  const steps = 5;
  for (let i = 0; i <= steps; i++) {
    const y = padT + (chartH / steps) * i;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
    const tVal = maxT - (maxT - minT) * (i / steps);
    ctx.fillStyle = '#8b8fa3'; ctx.font = '12px monospace'; ctx.textAlign = 'right';
    ctx.fillText(minsToTime(tVal), padL - 10, y + 4);
  }

  // Points coords
  const points = withTime.map((r, i) => ({
    x: padL + (withTime.length === 1 ? chartW/2 : (i / (withTime.length - 1)) * chartW),
    y: padT + ((maxT - r.total_time) / (maxT - minT)) * chartH,
    r: r
  }));

  // Area fill under line
  ctx.beginPath();
  ctx.moveTo(points[0].x, padT + chartH);
  points.forEach(p => ctx.lineTo(p.x, p.y));
  ctx.lineTo(points[points.length-1].x, padT + chartH);
  ctx.closePath();
  const grad = ctx.createLinearGradient(0, padT, 0, padT + chartH);
  grad.addColorStop(0, 'rgba(200,255,0,0.15)');
  grad.addColorStop(1, 'rgba(200,255,0,0.01)');
  ctx.fillStyle = grad;
  ctx.fill();

  // Line
  ctx.strokeStyle = '#c8ff00'; ctx.lineWidth = 3;
  ctx.beginPath();
  points.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
  ctx.stroke();

  // Trend line
  if (points.length >= 3) {
    const n = points.length;
    const xs = points.map((_, i) => i);
    const ys = withTime.map(r => r.total_time);
    const sumX = xs.reduce((a, b) => a + b, 0), sumY = ys.reduce((a, b) => a + b, 0);
    const sumXY = xs.reduce((s, x, i) => s + x * ys[i], 0);
    const sumX2 = xs.reduce((s, x) => s + x * x, 0);
    const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
    const intercept = (sumY - slope * sumX) / n;

    ctx.strokeStyle = 'rgba(200,255,0,0.3)'; ctx.lineWidth = 2;
    ctx.setLineDash([8, 5]);
    ctx.beginPath();
    const y0 = padT + ((maxT - intercept) / (maxT - minT)) * chartH;
    const y1 = padT + ((maxT - (slope * (n - 1) + intercept)) / (maxT - minT)) * chartH;
    ctx.moveTo(points[0].x, y0); ctx.lineTo(points[points.length - 1].x, y1);
    ctx.stroke(); ctx.setLineDash([]);
  }

  // Points + labels
  const bestTimeVal = Math.min(...times);
  points.forEach((p, i) => {
    const isBest = p.r.total_time === bestTimeVal;

    // Point
    ctx.beginPath(); ctx.arc(p.x, p.y, isBest ? 8 : 6, 0, Math.PI * 2);
    ctx.fillStyle = isBest ? '#00d68f' : '#c8ff00'; ctx.fill();
    ctx.strokeStyle = '#0f1117'; ctx.lineWidth = 2; ctx.stroke();

    // Time label above point
    ctx.fillStyle = isBest ? '#00d68f' : '#e4e6ed';
    ctx.font = (isBest ? 'bold ' : '') + '13px monospace'; ctx.textAlign = 'center';
    ctx.fillText(minsToTime(p.r.total_time), p.x, p.y - 16);

    // Event label below x-axis
    const loc = p.r.event.location.charAt(0).toUpperCase() + p.r.event.location.slice(1);
    const yr = (p.r.event.year || '').toString().slice(-2);
    ctx.fillStyle = '#8b8fa3'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
    ctx.save();
    ctx.translate(p.x, padT + chartH + 15);
    ctx.rotate(-0.5);
    ctx.fillText(loc + " '" + yr, 0, 0);
    ctx.restore();
  });

  // PB label
  if (withTime.length > 1) {
    ctx.fillStyle = '#00d68f'; ctx.font = '11px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('● PB', W - padR - 30, padT - 10);
    ctx.fillStyle = '#c8ff00';
    ctx.fillText('— Trend', W - padR - 90, padT - 10);
  }
}

function renderSplitEvoHTML(containerId, races, stationKeys) {
  const el = document.getElementById(containerId);
  if (!el) return;

  const racesWithSplits = races.filter(r => stationKeys.some(sk => r[sk.key]));
  if (racesWithSplits.length < 2) {
    el.innerHTML = '<div style="color:var(--text2);text-align:center;padding:1rem">Servono almeno 2 gare con split</div>';
    return;
  }

  const colors = { skiErg:'#c8ff00', sledPush:'#00d68f', sledPull:'#ff6b6b', burpee:'#ffa500', row:'#00bfff', farmersCarry:'#ff69b4', lunges:'#9370db', wallBalls:'#20b2aa' };

  // Find global max for bar scaling
  let maxVal = 0;
  racesWithSplits.forEach(r => stationKeys.forEach(sk => {
    const v = r[sk.key];
    if (v && !isNaN(v) && v > maxVal) maxVal = v;
  }));

  let html = '<div style="overflow-x:auto">';
  html += '<table style="width:100%;border-collapse:collapse;font-size:0.82rem;min-width:' + (racesWithSplits.length * 100 + 110) + 'px">';

  // Header row with event names
  html += '<tr><th style="text-align:left;padding:0.5rem;color:var(--text2);font-size:0.75rem;min-width:100px">Stazione</th>';
  racesWithSplits.forEach(r => {
    const loc = r.event.location.charAt(0).toUpperCase() + r.event.location.slice(1);
    html += '<th style="text-align:center;padding:0.5rem;color:var(--text2);font-size:0.72rem;min-width:80px">' + loc + " '" + (r.event.year||'').toString().slice(-2) + '</th>';
  });
  html += '</tr>';

  // One row per station
  stationKeys.forEach(sk => {
    const vals = racesWithSplits.map(r => r[sk.key]);
    const validVals = vals.filter(v => v && !isNaN(v));
    if (!validVals.length) return;

    const bestVal = Math.min(...validVals);
    const firstVal = vals.find(v => v && !isNaN(v));
    const lastValid = [...vals].reverse().find(v => v && !isNaN(v));

    html += '<tr style="border-top:1px solid var(--border)">';
    html += '<td style="padding:0.5rem;font-weight:600;white-space:nowrap"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + (colors[sk.key]||'#888') + ';margin-right:6px"></span>' + sk.name + '</td>';

    vals.forEach((v, i) => {
      if (!v || isNaN(v)) {
        html += '<td style="text-align:center;padding:0.4rem;color:var(--text2)">—</td>';
        return;
      }
      const barPct = (v / maxVal) * 100;
      const isBest = v === bestVal;
      const barColor = colors[sk.key] || '#888';
      const opacity = isBest ? '1' : '0.5';

      // Delta vs first race
      let delta = '';
      if (firstVal && i > 0) {
        const d = v - firstVal;
        if (Math.abs(d) > 0.01) {
          const sign = d < 0 ? '' : '+';
          const dColor = d < 0 ? '#00d68f' : '#ff6b6b';
          delta = '<div style="font-size:0.68rem;color:' + dColor + '">' + sign + minsToTime(Math.abs(d)) + '</div>';
        }
      }

      html += '<td style="padding:0.4rem;text-align:center">';
      html += '<div style="height:18px;background:var(--surface);border-radius:3px;overflow:hidden;margin-bottom:2px">';
      html += '<div style="height:100%;width:' + barPct.toFixed(1) + '%;background:' + barColor + ';opacity:' + opacity + ';border-radius:3px"></div>';
      html += '</div>';
      html += '<div style="font-family:monospace;font-size:0.8rem;font-weight:' + (isBest ? '800' : '400') + ';color:' + (isBest ? '#00d68f' : 'var(--text)') + '">' + minsToTime(v) + '</div>';
      html += delta;
      html += '</td>';
    });
    html += '</tr>';
  });

  html += '</table></div>';

  // Summary: which stations improved, which worsened
  const changes = [];
  stationKeys.forEach(sk => {
    const vals = racesWithSplits.map(r => r[sk.key]).filter(v => v && !isNaN(v));
    if (vals.length < 2) return;
    const first = vals[0], last = vals[vals.length - 1];
    const d = last - first;
    changes.push({ name: sk.name, delta: d, key: sk.key });
  });

  if (changes.length) {
    changes.sort((a, b) => a.delta - b.delta);
    const improved = changes.filter(c => c.delta < -0.05);
    const worsened = changes.filter(c => c.delta > 0.05);

    html += '<div style="display:flex;gap:1.5rem;margin-top:1rem;flex-wrap:wrap;font-size:0.82rem">';
    if (improved.length) {
      html += '<div><span style="color:#00d68f;font-weight:700">Migliorate:</span> ';
      html += improved.map(c => c.name + ' <span style="color:#00d68f;font-family:monospace">-' + minsToTime(Math.abs(c.delta)) + '</span>').join(', ');
      html += '</div>';
    }
    if (worsened.length) {
      html += '<div><span style="color:#ff6b6b;font-weight:700">Peggiorate:</span> ';
      html += worsened.map(c => c.name + ' <span style="color:#ff6b6b;font-family:monospace">+' + minsToTime(c.delta) + '</span>').join(', ');
      html += '</div>';
    }
    html += '</div>';
  }

  el.innerHTML = html;
}

function drawFatigueTrend(canvasId, data) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;

  const cssW = canvas.parentElement.clientWidth || 700;
  const cssH = 200;
  const { ctx, W, H } = setupHiDPICanvas(canvas, cssW, cssH);

  const padL = 60, padR = 20, padT = 25, padB = 55;
  const chartW = W - padL - padR, chartH = H - padT - padB;

  const fis = data.map(d => d.fi);
  const minFI = Math.min(0, Math.min(...fis) - 2);
  const maxFI = Math.max(...fis) + 5;

  // Background
  ctx.fillStyle = '#1a1d27'; ctx.fillRect(0, 0, W, H);

  // Grid
  ctx.strokeStyle = '#2e3347'; ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = padT + (chartH / 4) * i;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
    const val = maxFI - (maxFI - minFI) * (i / 4);
    ctx.fillStyle = '#8b8fa3'; ctx.font = '11px monospace'; ctx.textAlign = 'right';
    ctx.fillText(val.toFixed(0) + '%', padL - 8, y + 4);
  }

  // Points and line
  const pts = data.map((d, i) => ({
    x: padL + (data.length > 1 ? (i / (data.length - 1)) * chartW : chartW / 2),
    y: padT + ((maxFI - d.fi) / (maxFI - minFI)) * chartH,
    d
  }));

  ctx.strokeStyle = '#ffa500'; ctx.lineWidth = 2;
  ctx.beginPath();
  pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
  ctx.stroke();

  pts.forEach(p => {
    const color = p.d.fi <= 5 ? '#00d68f' : p.d.fi <= 15 ? '#c8ff00' : p.d.fi <= 25 ? '#ffa500' : '#ff6b6b';
    ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.fill();
    ctx.strokeStyle = '#0f1117'; ctx.lineWidth = 2; ctx.stroke();

    ctx.fillStyle = '#e4e6ed'; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center';
    ctx.fillText('+' + p.d.fi.toFixed(1) + '%', p.x, p.y - 12);

    const loc = p.d.event.location.charAt(0).toUpperCase() + p.d.event.location.slice(1);
    ctx.fillStyle = '#8b8fa3'; ctx.font = '10px sans-serif';
    ctx.save();
    ctx.translate(p.x, padT + chartH + 15);
    ctx.rotate(-0.5);
    ctx.fillText(loc + " '" + (p.d.event.year || '').toString().slice(-2), 0, 0);
    ctx.restore();
  });
}

// -- Tabs --
document.getElementById('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  tab.classList.add('active');
  document.getElementById('sec-' + tab.dataset.section).classList.add('active');
});

// -- Init --
async function init() {
  try {
    const resp = await fetch('data/dashboard.json');
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    DATA = await resp.json();
  } catch (err) {
    document.querySelector('.container').innerHTML = `<div class="loading-msg">Errore: ${err.message}</div>`;
    return;
  }
  document.getElementById('sync-info').textContent = `${DATA.events.length} gare disponibili`;
  renderKPI();
  renderEvents();
  renderResultsFilters();
  renderStatsFilters();
  renderContentFilters();
}
init();
