<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HYANALIZE — Hyrox Dashboard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap');

    :root {
      --bg: #0a0c10; --surface: #13161d; --surface2: #1c2029; --surface3: #242833; --border: #2a2e3d;
      --text: #eaecf0; --text2: #7c819a; --text3: #50546b;
      --accent: #c8ff00; --accent2: #a8d900; --accent-glow: rgba(200,255,0,0.12);
      --gold: #fbbf24; --silver: #94a3b8; --bronze: #d97706; --green: #10b981; --red: #ef4444;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3), 0 1px 3px rgba(0,0,0,0.15);
      --shadow-md: 0 4px 6px rgba(0,0,0,0.25), 0 10px 15px rgba(0,0,0,0.15);
      --shadow-lg: 0 10px 25px rgba(0,0,0,0.3), 0 20px 40px rgba(0,0,0,0.2);
      --shadow-glow: 0 0 20px rgba(200,255,0,0.08);
      --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      --ease-out: cubic-bezier(0.0, 0.0, 0.2, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; }

    /* Header */
    .header { background: linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%); padding: 1.4rem 2rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; position: relative; }
    .header::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0.3; }
    .header h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: 2px; }
    .header h1 span { color: var(--accent); text-shadow: 0 0 20px rgba(200,255,0,0.3); }
    .header .meta { color: var(--text2); font-size: 0.82rem; font-weight: 500; }

    .container { max-width: 1400px; margin: 0 auto; padding: 1.5rem 2rem; }

    /* KPI */
    .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .kpi { background: linear-gradient(135deg, var(--surface) 0%, rgba(200,255,0,0.03) 100%); border: 1px solid var(--border); border-radius: 16px; padding: 1.4rem; box-shadow: var(--shadow-sm); transition: all 0.35s var(--ease); position: relative; overflow: hidden; }
    .kpi::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent), transparent); opacity: 0.5; }
    .kpi:hover { transform: translateY(-3px); box-shadow: var(--shadow-md), var(--shadow-glow); border-color: rgba(200,255,0,0.15); }
    .kpi .label { color: var(--text2); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
    .kpi .value { font-size: 2.2rem; font-weight: 800; color: var(--accent); margin-top: 0.4rem; font-family: 'JetBrains Mono', monospace; }
    .kpi .sub { color: var(--text3); font-size: 0.8rem; margin-top: 0.3rem; font-weight: 500; }

    /* Tabs */
    .tabs { display: flex; gap: 0.3rem; margin-bottom: 2rem; flex-wrap: wrap; background: var(--surface); border-radius: 12px; padding: 4px; border: 1px solid var(--border); }
    .tab { background: transparent; border: none; border-radius: 10px; padding: 0.65rem 1.3rem; color: var(--text2); cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: all 0.3s var(--ease); position: relative; }
    .tab:hover { color: var(--text); background: rgba(255,255,255,0.04); }
    .tab.active { background: var(--accent); color: var(--bg); font-weight: 700; box-shadow: 0 2px 8px rgba(200,255,0,0.25); }

    .section { display: none; animation: fadeIn 0.3s var(--ease-out); }
    .section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* Filters */
    .filters { display: flex; gap: 0.8rem; margin-bottom: 1.2rem; flex-wrap: wrap; align-items: center; }
    .filters select, .filters input { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 0.6rem 1rem; color: var(--text); font-size: 0.85rem; min-width: 140px; font-family: inherit; transition: all 0.2s var(--ease); }
    .filters select:focus, .filters input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(200,255,0,0.1); }
    .filters label { color: var(--text2); font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

    /* Table */
    .table-wrap { overflow-x: auto; border-radius: 16px; border: 1px solid var(--border); max-height: 70vh; overflow-y: auto; box-shadow: var(--shadow-md); }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { background: var(--surface2); color: var(--text2); font-weight: 700; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.8px; padding: 1rem 0.8rem; text-align: left; position: sticky; top: 0; cursor: pointer; user-select: none; z-index: 1; transition: color 0.2s; }
    th:hover { color: var(--accent); }
    th.sorted-asc::after { content: ' ▲'; color: var(--accent); }
    th.sorted-desc::after { content: ' ▼'; color: var(--accent); }
    td { padding: 0.7rem 0.8rem; border-top: 1px solid rgba(255,255,255,0.04); }
    tr { transition: background 0.15s; }
    tr:hover td { background: rgba(200,255,0,0.03); }
    .rank-1 { color: var(--gold); font-weight: 700; }
    .rank-2 { color: var(--silver); font-weight: 700; }
    .rank-3 { color: var(--bronze); font-weight: 700; }
    .time { font-variant-numeric: tabular-nums; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.3px; }

    /* Event grid */
    .event-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
    .event-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.4rem; cursor: pointer; transition: all 0.35s var(--ease); box-shadow: var(--shadow-sm); position: relative; overflow: hidden; }
    .event-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--accent); opacity: 0; transition: opacity 0.3s; }
    .event-card:hover { border-color: rgba(200,255,0,0.2); transform: translateY(-4px); box-shadow: var(--shadow-lg), var(--shadow-glow); }
    .event-card:hover::before { opacity: 1; }
    .event-card:active { transform: translateY(-2px); }
    .event-card h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.3rem; }
    .event-card .city { color: var(--accent); font-size: 0.88rem; font-weight: 600; }
    .event-card .info { color: var(--text2); font-size: 0.82rem; margin-top: 0.5rem; font-weight: 500; }

    /* Stats */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.4rem; box-shadow: var(--shadow-sm); }
    .stat-card h3 { font-size: 0.92rem; margin-bottom: 0.8rem; color: var(--accent); font-weight: 700; }
    .stat-row { display: flex; justify-content: space-between; padding: 0.4rem 0; font-size: 0.85rem; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .stat-row:last-child { border-bottom: none; }
    .stat-row .sl { color: var(--text2); }

    /* Pagination */
    .pagination { display: flex; gap: 0.5rem; justify-content: center; align-items: center; margin-top: 1.2rem; color: var(--text2); font-size: 0.85rem; }
    .pagination button { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 1rem; color: var(--text); cursor: pointer; font-family: inherit; font-weight: 600; transition: all 0.2s var(--ease); }
    .pagination button:hover { border-color: var(--accent); background: rgba(200,255,0,0.05); }
    .pagination button:disabled { opacity: 0.2; cursor: default; }

    .loading-msg { text-align: center; padding: 3rem; color: var(--text2); font-weight: 500; }

    /* Content type buttons */
    .content-type-btns { display: flex; gap: 0.3rem; margin-bottom: 1.2rem; flex-wrap: wrap; background: var(--surface); border-radius: 12px; padding: 4px; border: 1px solid var(--border); }
    .content-type-btn { background: transparent; border: none; border-radius: 10px; padding: 0.6rem 1.2rem; color: var(--text2); cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: all 0.3s var(--ease); }
    .content-type-btn:hover { color: var(--text); background: rgba(255,255,255,0.04); }
    .content-type-btn.active { background: var(--accent); color: var(--bg); font-weight: 700; box-shadow: 0 2px 8px rgba(200,255,0,0.25); }

    .content-output { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; margin-top: 1rem; white-space: pre-wrap; font-size: 0.88rem; line-height: 1.7; position: relative; min-height: 80px; box-shadow: var(--shadow-sm); }
    .content-output:empty::before { content: 'Seleziona un evento e clicca Genera'; color: var(--text3); }

    /* Buttons */
    .btn-copy { position: absolute; top: 0.8rem; right: 0.8rem; background: var(--accent); color: var(--bg); border: none; border-radius: 8px; padding: 0.45rem 1rem; cursor: pointer; font-weight: 700; font-size: 0.78rem; font-family: inherit; transition: all 0.2s var(--ease); }
    .btn-copy:hover { background: var(--accent2); box-shadow: 0 0 12px rgba(200,255,0,0.3); }
    .btn-copy:active { transform: scale(0.96); }
    .btn-generate { background: var(--accent); color: var(--bg); border: none; border-radius: 10px; padding: 0.7rem 1.6rem; cursor: pointer; font-weight: 700; font-size: 0.88rem; font-family: inherit; transition: all 0.25s var(--ease); box-shadow: 0 2px 8px rgba(200,255,0,0.15); }
    .btn-generate:hover { background: var(--accent2); box-shadow: 0 4px 16px rgba(200,255,0,0.3); transform: translateY(-1px); }
    .btn-generate:active { transform: translateY(0) scale(0.98); }

    /* Athlete race cards */
    .athlete-results { margin-top: 1rem; }
    .athlete-race-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 0; margin-bottom: 1.4rem; overflow: hidden; box-shadow: var(--shadow-md); transition: box-shadow 0.3s var(--ease); }
    .athlete-race-card:hover { box-shadow: var(--shadow-lg); }
    .athlete-race-card h4 { color: var(--accent); margin-bottom: 0.5rem; }
    .athlete-splits { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.3rem; margin-top: 0.5rem; }
    .athlete-split { font-size: 0.8rem; }
    .athlete-split .sl { color: var(--text2); }
    .athlete-split .sv { font-family: 'JetBrains Mono', monospace; }
    .athlete-best { color: var(--green); font-weight: 600; }
    .athlete-worst { color: var(--red); font-weight: 600; }

    /* Enhanced race card styles */
    .arc-header { padding: 1.4rem 1.8rem; background: linear-gradient(135deg, var(--surface) 0%, rgba(200,255,0,0.03) 100%); border-bottom: 1px solid var(--border); }
    .arc-event-line { color: var(--text2); font-size: 0.78rem; margin-bottom: 0.4rem; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; }
    .arc-meta-line { color: var(--text2); font-size: 0.8rem; margin-top: 0.5rem; display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .arc-meta-line span { display: inline-block; padding: 0.2rem 0.6rem; background: var(--surface2); border-radius: 6px; font-size: 0.72rem; font-weight: 600; border: 1px solid rgba(255,255,255,0.05); }
    .arc-total-time { font-size: 2.4rem; font-weight: 900; color: var(--accent); font-family: 'JetBrains Mono', monospace; margin-top: 0.4rem; letter-spacing: 1px; text-shadow: 0 0 30px rgba(200,255,0,0.15); }

    .arc-ranking-badge { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.45rem 1rem; border-radius: 10px; font-size: 0.82rem; font-weight: 700; margin: 1rem 1.8rem; backdrop-filter: blur(4px); }
    .arc-ranking-badge.top25 { background: rgba(16,185,129,0.12); color: #34d399; border: 1px solid rgba(16,185,129,0.25); }
    .arc-ranking-badge.top50 { background: rgba(200,255,0,0.08); color: #c8ff00; border: 1px solid rgba(200,255,0,0.2); }
    .arc-ranking-badge.top75 { background: rgba(251,191,36,0.1); color: #fbbf24; border: 1px solid rgba(251,191,36,0.2); }
    .arc-ranking-badge.bottom25 { background: rgba(239,68,68,0.1); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }

    .arc-body { padding: 1.2rem 1.8rem; }
    .arc-section-title { font-size: 0.72rem; color: var(--text2); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 0.8rem; font-weight: 700; }

    .arc-split-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.6rem; font-size: 0.82rem; }
    .arc-split-name { width: 88px; color: var(--text2); flex-shrink: 0; font-size: 0.78rem; font-weight: 600; }
    .arc-split-bars { flex: 1; position: relative; height: 28px; background: var(--surface2); border-radius: 6px; overflow: hidden; }
    .arc-split-bar-athlete { height: 100%; border-radius: 6px; min-width: 4px; transition: width 0.5s var(--ease-out); }
    .arc-split-bar-avg { position: absolute; top: 0; width: 2px; height: 100%; background: rgba(255,255,255,0.4); z-index: 2; }
    .arc-split-time { width: 62px; text-align: right; font-family: 'JetBrains Mono', monospace; font-weight: 700; flex-shrink: 0; font-size: 0.82rem; }
    .arc-split-rank { width: 48px; text-align: right; font-size: 0.72rem; color: var(--text3); flex-shrink: 0; font-weight: 600; }
    .arc-split-delta { width: 58px; text-align: right; font-size: 0.72rem; flex-shrink: 0; font-family: 'JetBrains Mono', monospace; font-weight: 600; }
    .arc-split-delta.faster { color: var(--green); }
    .arc-split-delta.slower { color: var(--red); }

    .arc-legend { display: flex; gap: 1.2rem; margin-top: 0.8rem; font-size: 0.72rem; color: var(--text3); align-items: center; font-weight: 500; }
    .arc-legend-dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 4px; vertical-align: middle; }

    .arc-radar-section { display: flex; justify-content: center; padding: 1.2rem 1.8rem; border-top: 1px solid var(--border); }
    .arc-radar-canvas { max-width: 100%; }

    .arc-stations-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; padding: 1.2rem 1.8rem; border-top: 1px solid var(--border); }
    .arc-station-card { background: var(--surface2); border-radius: 14px; padding: 1.1rem; border: 1px solid rgba(255,255,255,0.04); transition: border-color 0.2s; }
    .arc-station-card:hover { border-color: rgba(200,255,0,0.1); }
    .arc-station-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.6rem; }
    .arc-station-name { font-weight: 700; font-size: 0.9rem; }
    .arc-station-time { font-family: 'JetBrains Mono', monospace; font-size: 1.15rem; font-weight: 800; color: var(--accent); }
    .arc-station-badges { display: flex; gap: 0.4rem; margin-bottom: 0.6rem; }
    .arc-station-badge { font-size: 0.68rem; padding: 0.18rem 0.5rem; border-radius: 6px; font-weight: 700; }
    .arc-histo-wrap { position: relative; height: 80px; margin-top: 0.5rem; }
    .arc-histo-canvas { width: 100%; height: 100%; }
    .arc-histo-axis { display: flex; justify-content: space-between; font-size: 0.65rem; color: var(--text3); margin-top: 2px; font-family: 'JetBrains Mono', monospace; }

    .arc-footer { padding: 1rem 1.8rem; border-top: 1px solid var(--border); display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; background: rgba(0,0,0,0.15); }

    /* Cross Analysis styles */
    .cross-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1rem; margin-bottom: 1.8rem; }
    .cross-card { background: linear-gradient(135deg, var(--surface) 0%, rgba(200,255,0,0.03) 100%); border: 1px solid var(--border); border-radius: 16px; padding: 1.4rem; box-shadow: var(--shadow-sm); position: relative; overflow: hidden; transition: all 0.3s var(--ease); }
    .cross-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent), transparent); opacity: 0.4; }
    .cross-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .cross-card h3 { font-size: 0.7rem; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; font-weight: 700; }
    .cross-card .big { font-size: 1.8rem; font-weight: 900; color: var(--accent); font-family: 'JetBrains Mono', monospace; }
    .cross-card .sub { font-size: 0.78rem; color: var(--text2); margin-top: 0.3rem; font-weight: 500; }

    .cross-section { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.6rem; margin-bottom: 1.4rem; box-shadow: var(--shadow-sm); }
    .cross-section h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 1.2rem; display: flex; align-items: center; gap: 0.6rem; }
    .cross-section h3 .icon { color: var(--accent); font-size: 1.1rem; }

    .cross-chart-wrap { position: relative; width: 100%; border-radius: 12px; overflow: hidden; }
    .cross-chart-wrap canvas { display: block; max-width: 100%; }

    .cross-pb-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.8rem; }
    .cross-pb-item { background: var(--surface2); border-radius: 12px; padding: 1rem; border: 1px solid rgba(255,255,255,0.04); transition: all 0.25s var(--ease); }
    .cross-pb-item:hover { border-color: rgba(16,185,129,0.2); transform: translateY(-2px); }
    .cross-pb-item .station { font-size: 0.72rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; font-weight: 700; }
    .cross-pb-item .pb-time { font-size: 1.35rem; font-weight: 800; color: var(--green); font-family: 'JetBrains Mono', monospace; margin-top: 0.2rem; }
    .cross-pb-item .pb-where { font-size: 0.72rem; color: var(--text3); margin-top: 0.3rem; font-weight: 500; }

    .cross-weakness-row { display: flex; align-items: center; gap: 0.8rem; padding: 0.7rem 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .cross-weakness-row:last-child { border-bottom: none; }
    .cross-weakness-name { width: 100px; font-weight: 700; font-size: 0.85rem; flex-shrink: 0; }
    .cross-weakness-bar-wrap { flex: 1; height: 26px; background: var(--surface2); border-radius: 6px; overflow: hidden; position: relative; }
    .cross-weakness-bar { height: 100%; border-radius: 6px; transition: width 0.6s var(--ease-out); }
    .cross-weakness-pct { width: 75px; text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; font-weight: 700; flex-shrink: 0; }

    .cross-fatigue-laps { display: flex; align-items: flex-end; gap: 6px; height: 130px; padding: 0 0.5rem; }
    .cross-fatigue-bar { flex: 1; border-radius: 6px 6px 0 0; min-width: 30px; position: relative; transition: height 0.5s var(--ease-out); }
    .cross-fatigue-bar .label { position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%); font-size: 0.72rem; color: var(--text3); font-weight: 600; }
    .cross-fatigue-bar .val { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 0.72rem; font-family: 'JetBrains Mono', monospace; color: var(--text); white-space: nowrap; font-weight: 600; }

    .cross-target-row { display: flex; align-items: center; gap: 0.8rem; padding: 0.55rem 0; font-size: 0.85rem; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .cross-target-row:last-child { border-bottom: none; }
    .cross-target-station { width: 100px; color: var(--text2); flex-shrink: 0; font-weight: 600; }
    .cross-target-current { width: 65px; font-family: 'JetBrains Mono', monospace; text-align: right; flex-shrink: 0; font-weight: 500; }
    .cross-target-arrow { color: var(--accent); flex-shrink: 0; font-weight: 700; }
    .cross-target-needed { width: 65px; font-family: 'JetBrains Mono', monospace; text-align: right; flex-shrink: 0; color: var(--green); font-weight: 700; }
    .cross-target-delta { font-size: 0.78rem; color: var(--text3); flex-shrink: 0; font-weight: 500; }

    .cross-global-rank { display: flex; align-items: center; gap: 1.5rem; padding: 1.4rem; background: linear-gradient(135deg, var(--surface2) 0%, rgba(200,255,0,0.04) 100%); border-radius: 16px; border: 1px solid rgba(200,255,0,0.1); }
    .cross-global-rank .rank-num { font-size: 2.8rem; font-weight: 900; color: var(--accent); font-family: 'JetBrains Mono', monospace; text-shadow: 0 0 20px rgba(200,255,0,0.2); }
    .cross-global-rank .rank-detail { font-size: 0.85rem; color: var(--text2); line-height: 1.7; }
    .cross-global-rank .rank-detail strong { color: var(--text); }

    /* === TABLET (max 768px) === */
    @media (max-width: 768px) {
      .header { padding: 0.8rem 1rem; }
      .header h1 { font-size: 1.2rem; }
      .container { padding: 0.8rem; }

      .kpi-row { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.6rem; margin-bottom: 1rem; }
      .kpi { padding: 0.8rem; }
      .kpi .value { font-size: 1.4rem; }

      .tabs { gap: 0.3rem; margin-bottom: 1rem; }
      .tab { padding: 0.5rem 0.8rem; font-size: 0.8rem; }

      .filters { gap: 0.5rem; }
      .filters select, .filters input { min-width: 100px; font-size: 0.8rem; padding: 0.45rem 0.6rem; }
      .filters label { font-size: 0.75rem; }

      .event-grid { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.6rem; }
      .event-card { padding: 0.8rem; }
      .event-card h3 { font-size: 0.9rem; }

      .stats-grid { grid-template-columns: 1fr; }

      table { font-size: 0.78rem; }
      th { padding: 0.5rem 0.4rem; font-size: 0.68rem; }
      td { padding: 0.4rem 0.4rem; }

      .content-output { padding: 1rem; font-size: 0.82rem; }
      .btn-generate { padding: 0.5rem 1rem; font-size: 0.82rem; }

      .arc-header { padding: 1rem 1.2rem; }
      .arc-body { padding: 0.8rem 1.2rem; }
      .arc-footer { padding: 0.6rem 1.2rem; }
      .arc-ranking-badge { margin: 0.5rem 1.2rem; font-size: 0.78rem; }
      .arc-stations-grid { grid-template-columns: 1fr; padding: 0.8rem 1.2rem; }
      .arc-radar-section { padding: 0.8rem 1.2rem; }
      .arc-total-time { font-size: 1.8rem; }

      .cross-summary { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.6rem; }
      .cross-card { padding: 1rem; }
      .cross-card .big { font-size: 1.4rem; }
      .cross-section { padding: 1.2rem; margin-bottom: 1rem; }
      .cross-pb-grid { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.5rem; }
      .cross-global-rank { flex-wrap: wrap; gap: 1rem; }
      .cross-global-rank .rank-num { font-size: 2.2rem; }
      .cross-target-row { gap: 0.4rem; font-size: 0.78rem; }
      .cross-target-station { width: 80px; }
      .cross-target-delta { font-size: 0.72rem; }
    }

    /* === SMARTPHONE (max 480px) === */
    @media (max-width: 480px) {
      .header { padding: 0.6rem 0.8rem; flex-direction: column; align-items: flex-start; gap: 0.3rem; }
      .header h1 { font-size: 1.1rem; }
      .header .meta { font-size: 0.75rem; }
      .container { padding: 0.5rem; }

      .kpi-row { grid-template-columns: repeat(2, 1fr); gap: 0.5rem; margin-bottom: 0.8rem; }
      .kpi { padding: 0.6rem; border-radius: 8px; }
      .kpi .label { font-size: 0.7rem; }
      .kpi .value { font-size: 1.2rem; }
      .kpi .sub { font-size: 0.72rem; }

      .tabs { gap: 0.25rem; }
      .tab { padding: 0.4rem 0.6rem; font-size: 0.72rem; border-radius: 6px; }

      .filters { flex-direction: column; align-items: stretch; gap: 0.4rem; }
      .filters select, .filters input { min-width: unset; width: 100%; font-size: 0.82rem; }
      .filters label { font-size: 0.72rem; }

      .event-grid { grid-template-columns: 1fr; gap: 0.5rem; }
      .event-card { padding: 0.7rem; border-radius: 8px; }
      .event-card h3 { font-size: 0.88rem; }
      .event-card .city { font-size: 0.82rem; }
      .event-card .info { font-size: 0.78rem; }

      table { font-size: 0.72rem; }
      th { padding: 0.4rem 0.3rem; font-size: 0.62rem; letter-spacing: 0; }
      td { padding: 0.35rem 0.3rem; }

      .pagination { font-size: 0.78rem; }
      .pagination button { padding: 0.3rem 0.6rem; font-size: 0.78rem; }

      .content-type-btns { gap: 0.3rem; }
      .content-type-btn { padding: 0.4rem 0.7rem; font-size: 0.78rem; }
      .content-output { padding: 0.8rem; font-size: 0.78rem; line-height: 1.5; }
      .btn-copy { padding: 0.3rem 0.6rem; font-size: 0.72rem; }
      .btn-generate { padding: 0.45rem 0.8rem; font-size: 0.78rem; }

      /* Athlete race cards */
      .athlete-race-card { border-radius: 14px; margin-bottom: 1rem; }
      .arc-header { padding: 0.8rem 1rem; }
      .arc-event-line { font-size: 0.7rem; letter-spacing: 1px; }
      .arc-meta-line span { font-size: 0.65rem; padding: 0.15rem 0.4rem; }
      .arc-total-time { font-size: 1.6rem; }
      .arc-ranking-badge { margin: 0.5rem 1rem; font-size: 0.72rem; padding: 0.35rem 0.7rem; }
      .arc-body { padding: 0.6rem 1rem; }
      .arc-section-title { font-size: 0.65rem; }
      .arc-split-row { gap: 0.3rem; margin-bottom: 0.35rem; font-size: 0.75rem; }
      .arc-split-name { width: 65px; font-size: 0.7rem; }
      .arc-split-bars { height: 22px; }
      .arc-split-time { width: 52px; font-size: 0.72rem; }
      .arc-split-delta { display: none; }
      .arc-split-rank { display: none; }
      .arc-legend { flex-wrap: wrap; gap: 0.5rem; font-size: 0.65rem; }
      .arc-stations-grid { grid-template-columns: 1fr; padding: 0.6rem 1rem; gap: 0.6rem; }
      .arc-station-card { padding: 0.8rem; border-radius: 10px; }
      .arc-station-name { font-size: 0.82rem; }
      .arc-station-time { font-size: 1rem; }
      .arc-station-badge { font-size: 0.62rem; }
      .arc-histo-wrap { height: 60px; }
      .arc-radar-section { padding: 0.6rem; }
      .arc-footer { padding: 0.5rem 1rem; gap: 0.4rem; }
      .arc-footer select, .arc-footer button { font-size: 0.72rem !important; padding: 0.3rem 0.6rem !important; }

      /* Cross Analysis */
      .cross-summary { grid-template-columns: repeat(2, 1fr); gap: 0.5rem; margin-bottom: 1rem; }
      .cross-card { padding: 0.8rem; border-radius: 12px; }
      .cross-card::before { height: 2px; }
      .cross-card h3 { font-size: 0.62rem; }
      .cross-card .big { font-size: 1.2rem; }
      .cross-card .sub { font-size: 0.7rem; }
      .cross-section { padding: 1rem; border-radius: 12px; }
      .cross-section h3 { font-size: 0.9rem; margin-bottom: 0.6rem; }
      .cross-pb-grid { grid-template-columns: repeat(2, 1fr); gap: 0.4rem; }
      .cross-pb-item { padding: 0.7rem; border-radius: 10px; }
      .cross-pb-item .station { font-size: 0.65rem; }
      .cross-pb-item .pb-time { font-size: 1.05rem; }
      .cross-pb-item .pb-where { font-size: 0.65rem; }
      .cross-weakness-row { gap: 0.4rem; padding: 0.4rem 0; }
      .cross-weakness-name { width: 75px; font-size: 0.78rem; }
      .cross-weakness-bar-wrap { height: 20px; }
      .cross-weakness-pct { width: 60px; font-size: 0.75rem; }
      .cross-fatigue-laps { height: 90px; gap: 3px; }
      .cross-fatigue-bar { min-width: 22px; }
      .cross-fatigue-bar .val { font-size: 0.6rem; top: -16px; }
      .cross-fatigue-bar .label { font-size: 0.6rem; bottom: -16px; }
      .cross-target-row { flex-wrap: wrap; gap: 0.3rem; font-size: 0.75rem; }
      .cross-target-station { width: 70px; font-size: 0.75rem; }
      .cross-target-current, .cross-target-needed { width: 55px; font-size: 0.75rem; }
      .cross-target-delta { width: 100%; font-size: 0.68rem; padding-left: 70px; }
      .cross-global-rank { flex-direction: column; text-align: center; padding: 0.8rem; }
      .cross-global-rank .rank-num { font-size: 2rem; }
      .cross-global-rank .rank-detail { font-size: 0.78rem; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1><span>HY</span>ANALIZE</h1>
  <div class="meta" id="sync-info">Caricamento...</div>
</div>

<div class="container">
  <div class="kpi-row" id="kpi-row"></div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-section="events">Eventi</div>
    <div class="tab" data-section="results">Classifiche</div>
    <div class="tab" data-section="stats">Statistiche</div>
    <div class="tab" data-section="cross">Cross Analysis</div>
    <div class="tab" data-section="content">Contenuti IG</div>
  </div>

  <div class="section active" id="sec-events">
    <div class="filters">
      <label>Cerca</label>
      <input type="text" id="filter-event" placeholder="Citta, anno, stagione..." oninput="renderEvents()">
    </div>
    <div class="event-grid" id="event-grid"></div>
  </div>

  <div class="section" id="sec-results">
    <div class="filters" id="results-filters"></div>
    <div id="results-loading" class="loading-msg"></div>
    <div class="table-wrap" id="results-table-wrap" style="display:none">
      <table id="results-table"><thead><tr></tr></thead><tbody></tbody></table>
    </div>
    <div class="pagination" id="results-pagination"></div>
  </div>

  <div class="section" id="sec-stats">
    <div class="filters" id="stats-filters"></div>
    <div class="stats-grid" id="stats-grid"></div>
  </div>

  <div class="section" id="sec-cross">
    <div class="filters" id="cross-filters">
      <label>Cerca atleta</label>
      <input type="text" id="cross-athlete-search" placeholder="Nome atleta..." style="min-width:250px">
      <button class="btn-generate" onclick="crossSearch()">Analisi Cross-Evento</button>
    </div>
    <div id="cross-area"></div>
  </div>

  <div class="section" id="sec-content">
    <div class="content-type-btns" id="content-type-btns">
      <div class="content-type-btn active" data-type="top10">Top 10</div>
      <div class="content-type-btn" data-type="report">Report</div>
      <div class="content-type-btn" data-type="distribuzione">Distribuzione</div>
      <div class="content-type-btn" data-type="stazioni">Confronto Stazioni</div>
      <div class="content-type-btn" data-type="pacing">Pacing Analysis</div>
      <div class="content-type-btn" data-type="nazionalita">Nazionalità</div>
      <div class="content-type-btn" data-type="athlete">Cerca Atleta</div>
    </div>

    <div class="filters" id="content-filters"></div>
    <div id="content-area"></div>
  </div>
</div>

<script>
let DATA = null;
let raceCache = {};
let currentRaceResults = [];
let filteredResults = [];
let currentSort = { col: 'total_time', asc: true };
let resultsPage = 0;
const PAGE_SIZE = 50;

function minsToTime(m) {
  if (!m || isNaN(m)) return '—';
  const t = Math.round(m * 60);
  const h = Math.floor(t / 3600), mn = Math.floor((t % 3600) / 60), s = t % 60;
  return h > 0 ? `${h}:${String(mn).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${mn}:${String(s).padStart(2,'0')}`;
}

// -- KPI --
function renderKPI() {
  const totalResults = DATA.events.reduce((s, e) => s + (e.results_count || 0), 0);
  const locations = new Set(DATA.events.map(e => `${e.location}_${e.year}`));
  const seasons = new Set(DATA.events.map(e => e.season));
  document.getElementById('kpi-row').innerHTML = `
    <div class="kpi"><div class="label">Gare</div><div class="value">${locations.size}</div><div class="sub">${seasons.size} stagioni</div></div>
    <div class="kpi"><div class="label">Risultati totali</div><div class="value">${totalResults.toLocaleString()}</div><div class="sub">${DATA.events.length} divisioni</div></div>
    <div class="kpi"><div class="label">Ultimo Sync</div><div class="value">${DATA.last_sync ? DATA.last_sync.slice(0,8).replace(/(\d{4})(\d{2})(\d{2})/, '$3/$2/$1') : '—'}</div></div>
  `;
}

// -- Events --
function renderEvents() {
  const grid = document.getElementById('event-grid');
  const q = (document.getElementById('filter-event')?.value || '').toLowerCase();
  let events = DATA.events;
  if (q) events = events.filter(e => [e.name, e.location, String(e.year), String(e.season), e.divisions?.join(' ')].join(' ').toLowerCase().includes(q));
  events = [...events].sort((a, b) => (b.season || 0) - (a.season || 0) || (b.year || 0) - (a.year || 0) || a.location.localeCompare(b.location));

  grid.innerHTML = events.length ? events.map(e => `
    <div class="event-card" onclick="loadRace('${e.key}')">
      <h3>${e.name}</h3>
      <div class="city">${e.location} ${e.year} — Season ${e.season}</div>
      <div class="info">${(e.results_count||0).toLocaleString()} atleti &middot; ${e.divisions?.join(', ') || ''}</div>
    </div>
  `).join('') : '<div class="loading-msg">Nessun evento trovato</div>';
}

// -- Load race results on demand --
async function loadRace(key) {
  document.querySelector('[data-section="results"]').click();
  const loading = document.getElementById('results-loading');
  const wrap = document.getElementById('results-table-wrap');

  // Set event selector
  const sel = document.getElementById('filter-event-select');
  if (sel) sel.value = key;

  if (raceCache[key]) {
    currentRaceResults = raceCache[key];
    applyResultFilters();
    return;
  }

  loading.textContent = 'Caricamento risultati...';
  wrap.style.display = 'none';
  document.getElementById('results-pagination').innerHTML = '';

  try {
    const resp = await fetch(`data/races/${key}.json`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    currentRaceResults = deduplicateResults(await resp.json());
    raceCache[key] = currentRaceResults;
    loading.textContent = '';
    wrap.style.display = '';
    applyResultFilters();
  } catch (err) {
    loading.textContent = `Errore: ${err.message}`;
  }
}

// -- Results filters --
function sortedEventsNewestFirst() {
  return [...DATA.events].sort((a, b) => (b.season || 0) - (a.season || 0) || (b.year || 0) - (a.year || 0) || a.location.localeCompare(b.location));
}

function renderResultsFilters() {
  const events = sortedEventsNewestFirst();
  document.getElementById('results-filters').innerHTML = `
    <label>Evento</label>
    <select id="filter-event-select" onchange="loadRace(this.value)" style="min-width:250px">
      <option value="">— Seleziona un evento —</option>
      ${events.map(e => `<option value="${e.key}">${e.name} (${e.location} ${e.year})</option>`).join('')}
    </select>
    <label>Divisione</label>
    <select id="filter-division" onchange="applyResultFilters()">
      <option value="">Tutte</option>
    </select>
    <label>Genere</label>
    <select id="filter-gender" onchange="applyResultFilters()">
      <option value="">Tutti</option>
    </select>
    <label>Cerca atleta</label>
    <input type="text" id="filter-athlete" placeholder="Nome..." oninput="applyResultFilters()">
  `;
}

function applyResultFilters() {
  // Update division/gender dropdowns based on loaded data
  const divSel = document.getElementById('filter-division');
  const genSel = document.getElementById('filter-gender');
  const curDiv = divSel.value;
  const curGen = genSel.value;

  const divs = [...new Set(currentRaceResults.map(r => r.division).filter(Boolean))].sort();
  const gens = [...new Set(currentRaceResults.map(r => r.gender).filter(Boolean))].sort();

  divSel.innerHTML = '<option value="">Tutte</option>' + divs.map(d => `<option value="${d}" ${d===curDiv?'selected':''}>${d}</option>`).join('');
  genSel.innerHTML = '<option value="">Tutti</option>' + gens.map(g => `<option value="${g}" ${g===curGen?'selected':''}>${g}</option>`).join('');

  const div = divSel.value;
  const gen = genSel.value;
  const search = (document.getElementById('filter-athlete').value || '').toLowerCase();

  filteredResults = currentRaceResults.filter(r => {
    if (div && r.division !== div) return false;
    if (gen && r.gender !== gen) return false;
    if (search && !(r.name || '').toLowerCase().includes(search)) return false;
    return true;
  });

  filteredResults.sort((a, b) => (a.total_time || 9999) - (b.total_time || 9999));
  currentSort = { col: 'total_time', asc: true };
  resultsPage = 0;

  document.getElementById('results-loading').textContent = '';
  document.getElementById('results-table-wrap').style.display = '';
  renderResultsTable();
}

function sortResults(col) {
  if (currentSort.col === col) currentSort.asc = !currentSort.asc;
  else { currentSort.col = col; currentSort.asc = true; }

  filteredResults.sort((a, b) => {
    let va = a[col], vb = b[col];
    if (va == null || va !== va) va = typeof vb === 'string' ? 'zzz' : 999999;
    if (vb == null || vb !== vb) vb = typeof va === 'string' ? 'zzz' : 999999;
    return typeof va === 'string'
      ? (currentSort.asc ? va.localeCompare(vb) : vb.localeCompare(va))
      : (currentSort.asc ? va - vb : vb - va);
  });
  resultsPage = 0;
  renderResultsTable();
}

function renderResultsTable() {
  const thead = document.querySelector('#results-table thead tr');
  const tbody = document.querySelector('#results-table tbody');

  const cols = [
    { key: '_rank', label: '#' },
    { key: 'name', label: 'Atleta' },
    { key: 'division', label: 'Divisione' },
    { key: 'gender', label: 'Gen' },
    { key: 'age_group', label: 'Eta' },
    { key: 'nationality', label: 'Naz' },
    { key: 'total_time', label: 'Tempo' },
    { key: 'skiErg', label: 'SkiErg' },
    { key: 'sledPush', label: 'Sled Push' },
    { key: 'sledPull', label: 'Sled Pull' },
    { key: 'burpee', label: 'Burpee' },
    { key: 'row', label: 'Row' },
    { key: 'farmersCarry', label: 'Farmers' },
    { key: 'lunges', label: 'Lunges' },
    { key: 'wallBalls', label: 'Wall Balls' },
    { key: 'run_time', label: 'Run' },
    { key: 'work_time', label: 'Work' },
  ];

  thead.innerHTML = cols.map(c => {
    let cls = currentSort.col === c.key ? (currentSort.asc ? 'sorted-asc' : 'sorted-desc') : '';
    return `<th class="${cls}" onclick="sortResults('${c.key}')">${c.label}</th>`;
  }).join('');

  const start = resultsPage * PAGE_SIZE;
  const page = filteredResults.slice(start, start + PAGE_SIZE);

  tbody.innerHTML = page.map((r, i) => {
    const rank = start + i + 1;
    const rc = rank <= 3 ? `rank-${rank}` : '';
    return `<tr>
      <td class="${rc}">${rank}</td>
      <td>${(r.name||'').split(', ').reverse().join(' ')}</td>
      <td>${r.division||''}</td>
      <td>${r.gender||''}</td>
      <td>${r.age_group||''}</td>
      <td>${r.nationality||''}</td>
      <td class="time">${minsToTime(r.total_time)}</td>
      <td class="time">${minsToTime(r.skiErg)}</td>
      <td class="time">${minsToTime(r.sledPush)}</td>
      <td class="time">${minsToTime(r.sledPull)}</td>
      <td class="time">${minsToTime(r.burpee)}</td>
      <td class="time">${minsToTime(r.row)}</td>
      <td class="time">${minsToTime(r.farmersCarry)}</td>
      <td class="time">${minsToTime(r.lunges)}</td>
      <td class="time">${minsToTime(r.wallBalls)}</td>
      <td class="time">${minsToTime(r.run_time)}</td>
      <td class="time">${minsToTime(r.work_time)}</td>
    </tr>`;
  }).join('');

  const tp = Math.ceil(filteredResults.length / PAGE_SIZE) || 1;
  document.getElementById('results-pagination').innerHTML = `
    <button onclick="resultsPage=0;renderResultsTable()" ${resultsPage===0?'disabled':''}>&laquo;</button>
    <button onclick="resultsPage--;renderResultsTable()" ${resultsPage===0?'disabled':''}>&lsaquo;</button>
    <span>Pag ${resultsPage+1}/${tp} (${filteredResults.length.toLocaleString()} ris.)</span>
    <button onclick="resultsPage++;renderResultsTable()" ${resultsPage>=tp-1?'disabled':''}>&rsaquo;</button>
    <button onclick="resultsPage=${tp-1};renderResultsTable()" ${resultsPage>=tp-1?'disabled':''}>&raquo;</button>
  `;
}

// -- Stats --
function renderStatsFilters() {
  const events = sortedEventsNewestFirst().filter(e => e.stats && Object.keys(e.stats).length > 0);
  if (!events.length) { document.getElementById('stats-filters').innerHTML = '<span style="color:var(--text2)">Nessuna statistica</span>'; return; }

  document.getElementById('stats-filters').innerHTML = `
    <label>Evento</label>
    <select id="filter-stats-event" onchange="renderStats()" style="min-width:250px">
      ${events.map(e => `<option value="${e.key}">${e.name} (${e.location} ${e.year})</option>`).join('')}
    </select>
    <label>Divisione</label>
    <select id="filter-stats-div" onchange="renderStats()">
      <option value="">Tutte</option>
      <option value="open">Open</option>
      <option value="doubles">Doubles</option>
      <option value="pro">Pro</option>
      <option value="pro_doubles">Pro Doubles</option>
    </select>
    <label>Genere</label>
    <select id="filter-stats-gen" onchange="renderStats()">
      <option value="">Tutti</option>
      <option value="male">Male</option>
      <option value="female">Female</option>
      <option value="mixed">Mixed</option>
    </select>
  `;
  renderStats();
}

function renderStats() {
  const grid = document.getElementById('stats-grid');
  const key = document.getElementById('filter-stats-event')?.value;
  const event = DATA.events.find(e => e.key === key);
  if (!event || !event.stats) { grid.innerHTML = ''; return; }

  const filterDiv = document.getElementById('filter-stats-div')?.value || '';
  const filterGen = document.getElementById('filter-stats-gen')?.value || '';

  const filtered = Object.values(event.stats)
    .filter(s => (!filterDiv || s.division === filterDiv) && (!filterGen || s.gender === filterGen))
    .sort((a,b) => `${a.division}_${a.gender}`.localeCompare(`${b.division}_${b.gender}`));

  if (!filtered.length) { grid.innerHTML = '<div class="loading-msg">Nessuna statistica per i filtri selezionati</div>'; return; }

  grid.innerHTML = filtered.map(s => `
    <div class="stat-card">
      <h3>${s.division} — ${s.gender} (${s.count} atleti)</h3>
      <div class="stat-row"><span class="sl">Miglior tempo</span><span class="time">${minsToTime(s.min)}</span></div>
      <div class="stat-row"><span class="sl">Tempo medio</span><span class="time">${minsToTime(s.avg)}</span></div>
      <div class="stat-row"><span class="sl">Mediana</span><span class="time">${minsToTime(s.median)}</span></div>
      <div class="stat-row"><span class="sl">Peggior tempo</span><span class="time">${minsToTime(s.max)}</span></div>
      ${s.p10 ? `<div class="stat-row"><span class="sl">P10 (top 10%)</span><span class="time">${minsToTime(s.p10)}</span></div>` : ''}
      ${s.p25 ? `<div class="stat-row"><span class="sl">P25</span><span class="time">${minsToTime(s.p25)}</span></div>` : ''}
      ${s.p75 ? `<div class="stat-row"><span class="sl">P75</span><span class="time">${minsToTime(s.p75)}</span></div>` : ''}
      ${s.p90 ? `<div class="stat-row"><span class="sl">P90</span><span class="time">${minsToTime(s.p90)}</span></div>` : ''}
    </div>
  `).join('');
}

// -- Content IG --
let contentType = 'top10';
let contentRaceData = null;
let contentEventKey = '';

document.getElementById('content-type-btns').addEventListener('click', e => {
  const btn = e.target.closest('.content-type-btn');
  if (!btn) return;
  document.querySelectorAll('.content-type-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  renderContentFilters();
});

function renderContentFilters() {
  const events = sortedEventsNewestFirst();
  const area = document.getElementById('content-area');
  area.innerHTML = '';

  if (contentType === 'athlete') {
    document.getElementById('content-filters').innerHTML = `
      <label>Cerca atleta</label>
      <input type="text" id="content-athlete-search" placeholder="Nome atleta..." style="min-width:250px">
      <button class="btn-generate" onclick="searchAthlete()">Cerca in tutte le gare</button>
    `;
    return;
  }

  document.getElementById('content-filters').innerHTML = `
    <label>Evento</label>
    <select id="content-event-select" style="min-width:250px">
      <option value="">— Seleziona —</option>
      ${events.map(e => `<option value="${e.key}">${e.name} (${e.location} ${e.year})</option>`).join('')}
    </select>
    <label>Divisione</label>
    <select id="content-division"><option value="">Tutte</option></select>
