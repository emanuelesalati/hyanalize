<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HYANALIZE — Hyrox Italia Dashboard</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #232736;
      --border: #2e3347;
      --text: #e4e6ed;
      --text2: #8b8fa3;
      --accent: #c8ff00;
      --accent2: #a3cc00;
      --gold: #ffd700;
      --silver: #c0c0c0;
      --bronze: #cd7f32;
      --red: #ff4d6a;
      --green: #00d68f;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    /* Header */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1.2rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header h1 span { color: var(--accent); }

    .header .meta {
      color: var(--text2);
      font-size: 0.85rem;
    }

    /* Layout */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    /* KPI cards */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .kpi {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.2rem;
    }

    .kpi .label { color: var(--text2); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .kpi .value { font-size: 2rem; font-weight: 700; color: var(--accent); margin-top: 0.3rem; }
    .kpi .sub { color: var(--text2); font-size: 0.85rem; margin-top: 0.2rem; }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .tab {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 1.2rem;
      color: var(--text2);
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .tab:hover { border-color: var(--accent); color: var(--text); }
    .tab.active { background: var(--accent); color: var(--bg); font-weight: 600; border-color: var(--accent); }

    /* Section */
    .section { display: none; }
    .section.active { display: block; }

    .section-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    /* Filter bar */
    .filters {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .filters select, .filters input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 0.8rem;
      color: var(--text);
      font-size: 0.85rem;
    }

    .filters select:focus, .filters input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .filters label {
      color: var(--text2);
      font-size: 0.8rem;
    }

    /* Table */
    .table-wrap {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    th {
      background: var(--surface2);
      color: var(--text2);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      padding: 0.8rem 1rem;
      text-align: left;
      position: sticky;
      top: 0;
      cursor: pointer;
      user-select: none;
    }

    th:hover { color: var(--accent); }
    th.sorted-asc::after { content: ' ▲'; color: var(--accent); }
    th.sorted-desc::after { content: ' ▼'; color: var(--accent); }

    td {
      padding: 0.7rem 1rem;
      border-top: 1px solid var(--border);
    }

    tr:hover td { background: var(--surface2); }

    .rank-1 { color: var(--gold); font-weight: 700; }
    .rank-2 { color: var(--silver); font-weight: 700; }
    .rank-3 { color: var(--bronze); font-weight: 700; }

    .time { font-variant-numeric: tabular-nums; font-family: 'SF Mono', 'Cascadia Code', monospace; }

    /* Stats cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.2rem;
    }

    .stat-card h3 {
      font-size: 0.95rem;
      margin-bottom: 0.8rem;
      color: var(--accent);
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 0.3rem 0;
      font-size: 0.85rem;
    }

    .stat-row .stat-label { color: var(--text2); }
    .stat-row .stat-value { font-family: monospace; }

    /* Percentile bar */
    .pct-bar-wrap {
      background: var(--surface2);
      border-radius: 4px;
      height: 8px;
      margin-top: 0.3rem;
      position: relative;
      overflow: hidden;
    }

    .pct-bar {
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--green), var(--accent), var(--red));
    }

    .pct-marker {
      position: absolute;
      top: -2px;
      width: 3px;
      height: 12px;
      background: white;
      border-radius: 2px;
      transform: translateX(-50%);
    }

    /* Event cards */
    .event-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
    }

    .event-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.2rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .event-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .event-card h3 { font-size: 1rem; margin-bottom: 0.3rem; }
    .event-card .event-city { color: var(--accent); font-size: 0.9rem; }
    .event-card .event-date { color: var(--text2); font-size: 0.85rem; }
    .event-card .event-count { color: var(--text2); font-size: 0.85rem; margin-top: 0.5rem; }

    /* Pagination */
    .pagination {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      align-items: center;
      margin-top: 1rem;
      color: var(--text2);
      font-size: 0.85rem;
    }

    .pagination button {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.4rem 0.8rem;
      color: var(--text);
      cursor: pointer;
      font-size: 0.85rem;
    }

    .pagination button:hover { border-color: var(--accent); }
    .pagination button:disabled { opacity: 0.3; cursor: default; }

    /* Loading */
    .loading {
      text-align: center;
      padding: 4rem;
      color: var(--text2);
      font-size: 1.1rem;
    }

    .loading::after {
      content: '';
      animation: dots 1.5s infinite;
    }

    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header { padding: 1rem; }
      .container { padding: 1rem; }
      .kpi .value { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1><span>HY</span>ANALIZE</h1>
  <div class="meta" id="sync-info">Caricamento...</div>
</div>

<div class="container">
  <!-- KPI -->
  <div class="kpi-row" id="kpi-row"></div>

  <!-- Tabs -->
  <div class="tabs" id="tabs">
    <div class="tab active" data-section="events">Eventi</div>
    <div class="tab" data-section="results">Classifiche</div>
    <div class="tab" data-section="stats">Statistiche</div>
  </div>

  <!-- Events -->
  <div class="section active" id="sec-events">
    <div class="event-grid" id="event-grid"></div>
  </div>

  <!-- Results -->
  <div class="section" id="sec-results">
    <div class="filters" id="results-filters"></div>
    <div class="table-wrap">
      <table id="results-table">
        <thead><tr></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="pagination" id="results-pagination"></div>
  </div>

  <!-- Stats -->
  <div class="section" id="sec-stats">
    <div class="filters" id="stats-filters"></div>
    <div class="stats-grid" id="stats-grid"></div>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
let DATA = null;
let currentSort = { col: null, asc: true };
let resultsPage = 0;
const PAGE_SIZE = 50;
let filteredResults = [];

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
function msToTime(ms) {
  if (!ms) return '—';
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  return `${m}:${String(sec).padStart(2,'0')}`;
}

function rankClass(r) {
  if (r === 1) return 'rank-1';
  if (r === 2) return 'rank-2';
  if (r === 3) return 'rank-3';
  return '';
}

function groupEvents(events) {
  // Raggruppa per city (es. "2025 Rimini")
  const groups = {};
  for (const e of events) {
    const key = e.city || 'Altro';
    if (!groups[key]) groups[key] = { city: key, start_date: e.start_date, divisions: [] };
    groups[key].divisions.push(e);
  }
  return Object.values(groups).sort((a, b) => b.start_date.localeCompare(a.start_date));
}

function uniqueDivisions() {
  const divs = new Set();
  for (const r of DATA.results) {
    divs.add(r._division_name || r._event_name || '');
  }
  return [...divs].sort();
}

// ---------------------------------------------------------------------------
// Render KPI
// ---------------------------------------------------------------------------
function renderKPI() {
  const row = document.getElementById('kpi-row');
  const eventCities = new Set(DATA.events.map(e => e.city));
  const athletes = new Set(DATA.results.map(r => r.athlete_name));

  const bestTime = DATA.results.reduce((min, r) => {
    if (r._division_name && r._division_name.includes('PRO') && !r._division_name.includes('DOUBLES')
        && !r._division_name.includes('RELAY') && !r._division_name.includes('ADAPTIVE')) {
      const t = r.total_time_ms;
      if (t && (!min.time || t < min.time)) return { time: t, name: r.athlete_name, div: r._division_name };
    }
    return min;
  }, { time: null, name: '', div: '' });

  row.innerHTML = `
    <div class="kpi">
      <div class="label">Eventi</div>
      <div class="value">${eventCities.size}</div>
      <div class="sub">${DATA.events.length} divisioni totali</div>
    </div>
    <div class="kpi">
      <div class="label">Atleti</div>
      <div class="value">${athletes.size.toLocaleString()}</div>
      <div class="sub">${DATA.results.length.toLocaleString()} risultati</div>
    </div>
    <div class="kpi">
      <div class="label">Miglior Tempo PRO</div>
      <div class="value">${msToTime(bestTime.time)}</div>
      <div class="sub">${bestTime.name ? bestTime.name.split(', ').reverse().join(' ') : '—'}</div>
    </div>
    <div class="kpi">
      <div class="label">Ultimo Sync</div>
      <div class="value">${DATA.last_sync ? DATA.last_sync.slice(0,8).replace(/(\d{4})(\d{2})(\d{2})/, '$3/$2/$1') : '—'}</div>
      <div class="sub">${DATA.last_sync ? DATA.last_sync.slice(9).replace(/(\d{2})(\d{2})(\d{2})/, '$1:$2') : ''}</div>
    </div>
  `;
}

// ---------------------------------------------------------------------------
// Render Events
// ---------------------------------------------------------------------------
function renderEvents() {
  const grid = document.getElementById('event-grid');
  const groups = groupEvents(DATA.events);

  grid.innerHTML = groups.map(g => {
    const totalResults = g.divisions.reduce((sum, d) => sum + (d.results_count || 0), 0);
    const divNames = g.divisions.map(d => d.name).join(', ');
    return `
      <div class="event-card" onclick="showDivisionResults('${g.city}')">
        <h3>${g.city}</h3>
        <div class="event-date">${g.start_date}</div>
        <div class="event-count">${totalResults.toLocaleString()} atleti &middot; ${g.divisions.length} divisioni</div>
      </div>
    `;
  }).join('');
}

function showDivisionResults(city) {
  // Switch to results tab filtered by this city
  document.querySelector('[data-section="results"]').click();
  const sel = document.getElementById('filter-division');
  if (sel) {
    // Find divisions matching this city
    const eventSlugs = new Set(DATA.events.filter(e => e.city === city).map(e => e.slug));
    // Select first matching division
    for (const opt of sel.options) {
      const div = opt.value;
      if (div && DATA.results.some(r => r._division_name === div && eventSlugs.has(r._event_slug))) {
        sel.value = div;
        break;
      }
    }
    filterResults();
  }
}

// ---------------------------------------------------------------------------
// Render Results
// ---------------------------------------------------------------------------
function renderResultsFilters() {
  const container = document.getElementById('results-filters');
  const divisions = uniqueDivisions();

  container.innerHTML = `
    <label>Divisione</label>
    <select id="filter-division" onchange="filterResults()">
      <option value="">Tutte</option>
      ${divisions.map(d => `<option value="${d}">${d}</option>`).join('')}
    </select>
    <label>Cerca atleta</label>
    <input type="text" id="filter-athlete" placeholder="Nome o cognome..." oninput="filterResults()">
  `;
}

function filterResults() {
  const div = document.getElementById('filter-division').value;
  const search = (document.getElementById('filter-athlete').value || '').toLowerCase();

  filteredResults = DATA.results.filter(r => {
    if (div && (r._division_name || '') !== div) return false;
    if (search && !(r.athlete_name || '').toLowerCase().includes(search)) return false;
    return true;
  });

  // Sort by rank by default
  filteredResults.sort((a, b) => (a.rank_overall || 9999) - (b.rank_overall || 9999));
  currentSort = { col: 'rank_overall', asc: true };

  resultsPage = 0;
  renderResultsTable();
}

function sortResults(col) {
  if (currentSort.col === col) {
    currentSort.asc = !currentSort.asc;
  } else {
    currentSort.col = col;
    currentSort.asc = true;
  }

  filteredResults.sort((a, b) => {
    let va = a[col], vb = b[col];
    if (va == null) va = col === 'athlete_name' ? 'zzz' : 999999999;
    if (vb == null) vb = col === 'athlete_name' ? 'zzz' : 999999999;
    if (typeof va === 'string') {
      return currentSort.asc ? va.localeCompare(vb) : vb.localeCompare(va);
    }
    return currentSort.asc ? va - vb : vb - va;
  });

  resultsPage = 0;
  renderResultsTable();
}

function renderResultsTable() {
  const thead = document.querySelector('#results-table thead tr');
  const tbody = document.querySelector('#results-table tbody');

  const cols = [
    { key: 'rank_overall', label: '#' },
    { key: 'athlete_name', label: 'Atleta' },
    { key: '_division_name', label: 'Divisione' },
    { key: 'age_group', label: 'Categoria' },
    { key: 'total_time_ms', label: 'Tempo' },
  ];

  thead.innerHTML = cols.map(c => {
    let cls = '';
    if (currentSort.col === c.key) cls = currentSort.asc ? 'sorted-asc' : 'sorted-desc';
    return `<th class="${cls}" onclick="sortResults('${c.key}')">${c.label}</th>`;
  }).join('');

  const start = resultsPage * PAGE_SIZE;
  const page = filteredResults.slice(start, start + PAGE_SIZE);

  tbody.innerHTML = page.map(r => `
    <tr>
      <td class="${rankClass(r.rank_overall)}">${r.rank_overall || '—'}</td>
      <td>${(r.athlete_name || '').split(', ').reverse().join(' ')}</td>
      <td>${r._division_name || ''}</td>
      <td>${r.age_group || ''}</td>
      <td class="time">${msToTime(r.total_time_ms)}</td>
    </tr>
  `).join('');

  // Pagination
  const totalPages = Math.ceil(filteredResults.length / PAGE_SIZE);
  const pag = document.getElementById('results-pagination');
  pag.innerHTML = `
    <button onclick="resultsPage=0; renderResultsTable()" ${resultsPage === 0 ? 'disabled' : ''}>&laquo;</button>
    <button onclick="resultsPage--; renderResultsTable()" ${resultsPage === 0 ? 'disabled' : ''}>&lsaquo;</button>
    <span>Pagina ${resultsPage + 1} di ${totalPages} (${filteredResults.length.toLocaleString()} risultati)</span>
    <button onclick="resultsPage++; renderResultsTable()" ${resultsPage >= totalPages - 1 ? 'disabled' : ''}>&rsaquo;</button>
    <button onclick="resultsPage=${totalPages - 1}; renderResultsTable()" ${resultsPage >= totalPages - 1 ? 'disabled' : ''}>&raquo;</button>
  `;
}

// ---------------------------------------------------------------------------
// Render Stats
// ---------------------------------------------------------------------------
function renderStatsFilters() {
  const container = document.getElementById('stats-filters');
  const keys = Object.keys(DATA.stats);
  if (!keys.length) {
    container.innerHTML = '<span style="color:var(--text2)">Nessuna statistica disponibile</span>';
    return;
  }

  container.innerHTML = `
    <label>Divisione</label>
    <select id="filter-stats-div" onchange="renderStats()">
      ${keys.map(k => {
        const s = DATA.stats[k];
        const label = s.slug || k;
        return `<option value="${k}">${label}</option>`;
      }).join('')}
    </select>
  `;
  renderStats();
}

function renderStats() {
  const grid = document.getElementById('stats-grid');
  const sel = document.getElementById('filter-stats-div');
  if (!sel) return;

  const stat = DATA.stats[sel.value];
  if (!stat) { grid.innerHTML = ''; return; }

  // Overall stats card
  let html = `
    <div class="stat-card">
      <h3>Panoramica Generale</h3>
      <div class="stat-row"><span class="stat-label">Partecipanti</span><span class="stat-value">${stat.count || '—'}</span></div>
      <div class="stat-row"><span class="stat-label">Tempo medio</span><span class="stat-value time">${msToTime(stat.avg_total_time_ms)}</span></div>
      <div class="stat-row"><span class="stat-label">Mediana</span><span class="stat-value time">${msToTime(stat.median_total_time_ms)}</span></div>
      <div class="stat-row"><span class="stat-label">Miglior tempo</span><span class="stat-value time">${msToTime(stat.min_total_time_ms)}</span></div>
      <div class="stat-row"><span class="stat-label">Peggior tempo</span><span class="stat-value time">${msToTime(stat.max_total_time_ms)}</span></div>
      <div class="stat-row"><span class="stat-label">P10 (top 10%)</span><span class="stat-value time">${msToTime(stat.p10_total_time_ms)}</span></div>
      <div class="stat-row"><span class="stat-label">P25</span><span class="stat-value time">${msToTime(stat.p25_total_time_ms)}</span></div>
      <div class="stat-row"><span class="stat-label">P75</span><span class="stat-value time">${msToTime(stat.p75_total_time_ms)}</span></div>
      <div class="stat-row"><span class="stat-label">P90</span><span class="stat-value time">${msToTime(stat.p90_total_time_ms)}</span></div>
    </div>
  `;

  // Buckets (age groups)
  const buckets = (stat.buckets || []).filter(b => b.count >= 5);
  if (buckets.length > 0) {
    html += `
      <div class="stat-card">
        <h3>Per Categoria di Eta</h3>
        ${buckets.sort((a,b) => (a.age_group||'').localeCompare(b.age_group||'')).map(b => `
          <div style="margin-bottom:0.8rem">
            <div class="stat-row">
              <span class="stat-label"><strong>${b.age_group || '?'}</strong> (${b.count} atleti)</span>
              <span class="stat-value time">${msToTime(b.total_time?.median_ms)}</span>
            </div>
            <div class="pct-bar-wrap">
              <div class="pct-bar" style="width:100%"></div>
              ${b.total_time?.p10_ms && stat.max_total_time_ms ? `
                <div class="pct-marker" style="left:${(1 - b.total_time.p10_ms / stat.max_total_time_ms) * 100}%" title="P10: ${msToTime(b.total_time.p10_ms)}"></div>
              ` : ''}
            </div>
            <div class="stat-row" style="font-size:0.78rem">
              <span class="stat-label">Best ${msToTime(b.total_time?.min_ms)}</span>
              <span class="stat-label">P10 ${msToTime(b.total_time?.p10_ms)}</span>
              <span class="stat-label">P90 ${msToTime(b.total_time?.p90_ms)}</span>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  grid.innerHTML = html;
}

// ---------------------------------------------------------------------------
// Tabs
// ---------------------------------------------------------------------------
document.getElementById('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  tab.classList.add('active');
  document.getElementById('sec-' + tab.dataset.section).classList.add('active');
});

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------
async function init() {
  try {
    const resp = await fetch('data/dashboard.json');
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    DATA = await resp.json();
  } catch (err) {
    document.querySelector('.container').innerHTML = `
      <div class="loading" style="animation:none">
        Errore nel caricamento dei dati.<br>
        <small style="color:var(--text2)">${err.message}</small>
      </div>`;
    return;
  }

  document.getElementById('sync-info').textContent =
    `Ultimo sync: ${DATA.last_sync ? DATA.last_sync.slice(0,8).replace(/(\d{4})(\d{2})(\d{2})/, '$3/$2/$1') : '—'}`;

  renderKPI();
  renderEvents();
  renderResultsFilters();
  filterResults();
  renderStatsFilters();
}

init();
</script>

</body>
</html>
