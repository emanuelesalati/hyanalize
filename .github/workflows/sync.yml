name: Hyrox Data Sync

on:
  schedule:
    # Ogni giorno alle 06:00 UTC (08:00 ora italiana)
    - cron: "0 6 * * *"
  workflow_dispatch: # Permette esecuzione manuale da GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        env:
          PYTHONIOENCODING: utf-8
        run: python sync.py

      - name: Commit and push new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # Commit solo se ci sono cambiamenti
          git diff --cached --quiet || git commit -m "sync: aggiorna dati HYROX $(date -u +%Y-%m-%d)"
          git push
